  explanation:{
    undumbified:"The play opens in Raina Petkoff's bedroom in a small Bulgarian town, on the night of the Battle of Slivnitza (November 1885). Raina is gazing out at the night when her mother, Catherine, rushes in with news: the Bulgarians have won, and the charge that decided the battle was led by Raina's own fiancé, Major Sergius Saranoff. Raina is thrilled and proud — but once her mother has gone, she privately confesses to Sergius's portrait that she had secretly doubted him, wondering whether his 'heroic' image was just something she and Sergius had absorbed from romantic novels and operas, rather than something real. Their maid, Louka, then warns that all windows must be shuttered and bolted, since defeated Servian soldiers may be fleeing through the streets — though Raina's own window has no working bolt. Once alone, gunshots ring out; Raina blows out her candles and hides in bed. In the dark, a man climbs in through the balcony: a Servian officer on the run, who warns her not to raise the alarm or he'll fight for his life. When a search party (a young Russian officer serving with the Bulgarians, escorted by Catherine) comes to check the room, Raina hides the fugitive behind a curtain and boldly opens the shutters herself to prove no one is there — even as shots are fired at the balcony from outside. Once the searchers leave, the fugitive reveals himself to be a Swiss professional soldier fighting for pay, not patriotism, and admits — to Raina's disgust — that his pistol isn't even loaded, because he finds chocolate more useful in battle than cartridges. Raina, both outraged and oddly charmed, gives him her last box of chocolate creams, and he tells her, unprompted, the true story of the day's famous cavalry charge: it was suicidal, and only succeeded because the enemy's artillery had been sent the wrong ammunition by mistake. He mocks the charge's leader as a 'Don Quixote' who should be court-martialled rather than celebrated. Raina, stung, fetches the portrait of her fiancé to shame him — but the fugitive shows no remorse about mocking Sergius; instead, he immediately panics at the idea of being sent away down the water-pipe, insisting he'd rather give himself up. Raina asserts her family's respectability and hospitality (comparing their situation to the opera 'Ernani'), and though the fugitive is too afraid of the water-pipe to escape immediately, exhaustion catches up with him — after thirty-six hours without sleep, he collapses onto the ottoman and then the bed, falling asleep instantly just before Raina returns with her mother to help him escape.",
    sections:[
      {h:'Setting the Scene', p:"The play opens on a late November night in 1885, in the richly furnished bedchamber of Raina Petkoff, in a small Bulgarian town. Raina, wrapped in expensive furs, stands on her balcony gazing at the mountains and night sky — an image of comfortable, romantic privilege, deliberately set up before the chaos of the rest of the scene."},
      {h:'News of Victory', p:"Catherine Petkoff interrupts her daughter's reverie with electrifying news: the Bulgarians have won a major battle at Slivnitza, and the cavalry charge that won it was led by Raina's own fiancé, Major Sergius Saranoff, who defied the Russian commanders to lead the charge 'on his own responsibility'. Catherine's proud, vivid description ('swords and eyes flashing, scattering the wretched Servian dandies like chaff') frames Sergius, before we've even met him, as a storybook hero."},
      {h:"Raina's Private Doubt", p:"Left alone with Sergius's portrait, Raina admits something she hid from her mother: she had once secretly doubted whether Sergius's heroic, soldierly qualities were real, or just 'mere imagination' shaped by how fond she and Sergius were of Byron, Pushkin, and a particular opera season in Bucharest. She dismisses this doubt as cowardice now that the battle has 'proved' him a hero — but Shaw has planted, early and deliberately, the idea that heroism might be more performance than substance."},
      {h:"Louka's Warning", p:"The maid Louka interrupts to relay an order: every window must be shuttered and bolted, since defeated Servian soldiers may be fleeing through the town and could sneak in. Raina's own window, however, has no working bolt. Louka's parting comment — that the shutters can easily be pushed open again from outside — is a small, easily missed detail that becomes important within minutes."},
      {h:'The Intruder Climbs In', p:"Alone, Raina gazes adoringly at Sergius's portrait before gunshots startle her. She blows out the candles and hides in bed as, in the dark, a man climbs in through the balcony shutters. Once he strikes a match, he is revealed as a 'harried man of about thirty-five' in Serbian uniform — an enemy fugitive, and, by his own admission, determined not to be caught and killed."},
      {h:'Hiding the Fugitive', p:"When Louka warns that soldiers are searching for a man seen climbing to the balcony, and a young Russian officer (serving with the Bulgarian army) arrives to search the room, Raina hides the fugitive behind the curtain — then deliberately throws the shutters wide open and stands in front of the curtain herself, even as shots are fired at the balcony and a bullet shatters the glass beside her. Her calm, quick-thinking deception protects the fugitive completely; the officer leaves satisfied that no one could have entered without her knowledge."},
      {h:'The Chocolate Cream Soldier', p:"Once safe, the fugitive drops his guard entirely: he admits his pistol isn't loaded, since he'd rather carry chocolate than cartridges — practical fuel a soldier can actually use, unlike ammunition he rarely gets to fire. Raina, 'outraged in her most cherished ideals of manhood', is disgusted at first, but gives him her last box of chocolate creams anyway; when he later breaks down from nerves and exhaustion, her disgust softens into unexpected sympathy."},
      {h:'The Cavalry Charge Story', p:"Unprompted, the fugitive narrates the very cavalry charge Catherine had described as heroic — from the losing side. He calls it 'unprofessional': a doomed charge that only succeeded because the defending artillery had, by pure luck, been supplied with the wrong cartridges. He mockingly compares its leader to Don Quixote charging at windmills — a man who should have been court-martialled for recklessness, not celebrated as a hero."},
      {h:'The Photograph Reveal', p:"Furious at his mockery of Bulgarian courage, Raina fetches the portrait of her fiancé from her chest of drawers to shame the stranger — and the moment lands very differently than she intended. The reveal that the celebrated (and recklessly lucky) charge-leader he's just mocked is Raina's own betrothed creates a moment of sharp, awkward irony that neither character can simply brush past."},
      {h:'Hospitality and the Opera of Ernani', p:"Raina, stung, asserts her family's wealth, culture and respectability — the highest-ranking Bulgarian household, with two rows of windows and a private library — and invokes the opera 'Ernani', in which a fugitive's host refuses to betray him because a guest is sacred. This is Raina consciously casting herself as a noble protector in a story she already half-believes she is living, echoing her earlier confession about being shaped by opera and romantic literature."},
      {h:'Exhaustion and Sleep', p:"Despite everything, the fugitive is too frightened of climbing back down the water-pipe to leave immediately, and Raina goes to fetch her mother's help. Left alone and utterly exhausted — he hasn't slept in thirty-six hours — he collapses onto the bed and falls asleep instantly. When Raina and Catherine return, ready to help him escape, they instead find him fast asleep; Raina's protective, sympathetic 'Don't, mamma: the poor dear is worn out. Let him sleep' closes the unit, and quietly signals how far her feelings towards him have already shifted."}
    ],
    revision:"Nov 1885, Raina's bedroom • Catherine brings news: Bulgarians won at Slivnitza, Sergius led the cavalry charge • Raina privately doubts Sergius's heroism, blames Byron/Pushkin/opera for her romantic ideas • Louka warns of unshuttered windows/fleeing Servians • Gunshots — a fugitive Servian officer climbs in through the balcony • Raina hides him from a search party (a Russian officer who knows Sergius), opens the shutters herself to prove the room is empty, shots fired at the balcony • Fugitive reveals his pistol is unloaded — he carries chocolate instead of cartridges • Raina gives him her last chocolates, disgusted then sympathetic • He describes the famous cavalry charge as reckless and only successful by luck (wrong cartridges sent to the enemy), calls its leader a 'Don Quixote' • Raina shows him Sergius's portrait — he's just insulted her fiancé • Raina asserts her family's hospitality/status, references the opera 'Ernani' • Fugitive, exhausted after 36 sleepless hours, falls asleep on the bed before he can escape."

  extracts:[
    {
      text:"CATHERINE: Of course. He sent me the news. Sergius is the hero of the hour. He defied our Russian commanders—led a cavalry charge on his own responsibility. Can't you see it, Raina: our gallant splendid Bulgarians with their swords and eyes flashing, scattering the wretched Servian dandies like chaff. And you—you kept Sergius waiting a year before you would be betrothed to him.",
      qs:[
        {type:'Contextual', q:'What news does Catherine bring Raina at the start of the play?', a:'Catherine brings news that the Bulgarians have won a battle at Slivnitza, and that the cavalry charge which decided the battle was led by Raina\'s fiancé, Major Sergius Saranoff, on his own responsibility, against the wishes of the Russian commanders.', why:'This is the inciting news of the play, delivered directly in Catherine\'s opening speech.'},
        {type:'Literary Analysis', q:'How does Catherine\'s language in this speech shape our first impression of Sergius and the battle, before either is actually shown on stage?', a:'Catherine\'s vivid, admiring language — \'gallant splendid Bulgarians,\' \'swords and eyes flashing,\' enemies scattered \'like chaff\' — presents the battle and Sergius as glamorous and heroic in an almost story-book way, well before the audience meets either Sergius or the reality of the battle. This sets up a romantic image that the rest of the unit will begin to complicate.', why:'Shaw deliberately gives the audience the idealised version of events first, so that the fugitive\'s later, unglamorous eyewitness account creates a sharp and effective contrast.'},
        {type:'Inference', q:'What does Catherine\'s comment about Raina keeping Sergius waiting \'a year\' suggest about her priorities as a mother?', a:'It suggests Catherine is proud of Sergius\'s status and now sees Raina\'s past hesitation about becoming engaged as a mistake, implying Catherine values Sergius\'s reputation and heroic standing highly, and expects Raina to feel similarly grateful and proud now that his heroism has been publicly proven.', why:'Catherine raises the point unprompted and admiringly, showing she measures Sergius\'s worth partly by his public triumph.'}

    {
      text:"RAINA: ...and yet—and yet—it came into my head just as he was holding me in his arms and looking into my eyes, that perhaps we only had our heroic ideas because we are so fond of reading Byron and Pushkin, and because we were so delighted with the opera that season at Bucharest. Real life is so seldom like that. Only think, mother, I doubted him: I wondered whether all his heroic qualities and his soldiership might not prove mere imagination when he went into a real battle.",
      qs:[
        {type:'Meaning', q:'What exactly does Raina admit to her mother in this extract?', a:'Raina admits that she once secretly doubted Sergius — she wondered whether his heroic, soldierly image might be based more on romantic reading (Byron, Pushkin) and an opera she and Sergius had enjoyed together, rather than on anything that would actually hold up in real battle.', why:'The extract is Raina directly voicing this doubt to Catherine, in her own words.'},
        {type:'Literary Analysis', q:'Why is this confession significant so early in the play, given what happens later in the unit?', a:'This confession plants the play\'s central idea — that romantic, book-and-opera-inspired ideas of heroism might not match reality — before the audience has even met a real soldier. It is significant because the fugitive who climbs in shortly afterwards proves, from firsthand experience, that Raina\'s doubt was largely justified: real battle is unglamorous, and even Sergius\'s celebrated charge succeeded mostly through luck.', why:'Shaw plants Raina\'s doubt deliberately early so that events later in the same unit can validate it, reinforcing the play\'s anti-romantic argument through dramatic structure rather than just plot.'},
        {type:'Inference', q:'What does Raina mean by suggesting her ideas about heroism came from Byron, Pushkin, and opera?', a:'She means that her image of what a hero \'should\' be like may not come from real experience of war at all, but from Romantic poetry and dramatic, larger-than-life opera performances — sources that present war and love in an idealised, exaggerated way rather than showing what they are really like.', why:'This links Raina\'s private doubt to the play\'s wider theme: that art and fiction can shape unrealistic expectations about real life.'}
      ]
    },
    {

        {type:'Literary Analysis', q:'What is the comic and thematic effect of the man\'s casual answer here?', a:'The comic effect comes from how casually and unapologetically the man admits something Raina (and the audience) would expect a soldier to be ashamed of — being effectively unarmed. Thematically, it is the clearest possible statement of the play\'s anti-romantic argument: a professional soldier values chocolate (practical, sustaining) over cartridges (symbolic, rarely useful in his experience), directly undercutting the glamorous idea of the armed, battle-ready hero.', why:'Shaw uses understatement and a mundane detail (chocolate) to deflate the heroic image far more effectively than a dramatic speech would.'},
        {type:'Inference', q:'Why is Raina specifically \'outraged in her most cherished ideals of manhood\' rather than simply surprised or amused?', a:'Because the man\'s admission directly contradicts the romantic, storybook idea of masculine heroism that Raina has been raised on and has just been celebrating with her mother — a soldier carrying sweets like \'a schoolboy\' rather than fighting seriously is, to her at this point, close to unthinkable, so the detail strikes at something she holds personally and emotionally important.', why:'The stage direction itself names her reaction as touching her \'ideals,\' not just her expectations, showing how deeply this challenges her worldview.'}

    {
      text:"MAN: Well, it's a funny sight. It's like slinging a handful of peas against a window pane: first one comes; then two or three close behind him; and then, all the rest in a lump.\n...A regular handsome fellow, with flashing eyes and lovely moustache, shouting a war-cry and charging like Don Quixote at the windmills. We nearly burst with laughter at him; but when the sergeant ran up and told us they'd sent us the wrong cartridges, and that we couldn't fire a shot for the next ten minutes, we laughed at the other side of our mouths. And there was Don Quixote flourishing like a drum major, thinking he'd done the cleverest thing ever known, whereas he ought to be court-martialled for it.",

        {type:'Literary Analysis', q:'Identify and explain the effect of the simile used to describe the cavalry charge.', a:'The fugitive compares the charging cavalry to \'a handful of peas against a window pane\' — small, scattered, almost comic objects hitting a surface one after another. The simile deliberately deflates the charge\'s supposed grandeur, making it sound clumsy and unimpressive rather than the thrilling, unified image Catherine described earlier.', why:'This is a clear example of Shaw using an ordinary, unglamorous image to undercut a heroic scene, reinforcing the play\'s anti-romantic tone.'},
        {type:'Inference', q:'What is ironic about the fugitive\'s claim that the charge\'s leader \'ought to be court-martialled\' rather than praised?', a:'It is ironic because, unknown to the fugitive at this point, the man he is describing (and mocking) is Sergius — Raina\'s own celebrated fiancé, being praised by the entire town (and Raina\'s own mother) as a hero in the very same play, mere pages earlier. The fugitive\'s professional, unromantic judgement directly contradicts the civilian, romantic view of the same event.', why:'Recognising this dramatic irony is central to understanding how Shaw builds tension into the scene, since the audience knows what Raina is about to reveal before either character does.'}

  shortAnswers:[
    {q:'Why does Catherine burst into Raina\'s room at the start of the play, and how does Raina react?', a:'Catherine rushes in to tell Raina that the Bulgarians have won a great battle at Slivnitza, and that the celebrated cavalry charge that decided it was led by Raina\'s own fiancé, Sergius. Raina reacts rapturously, overjoyed and proud, before quickly asking, with sudden anxiety, whether her father is safe.', points:['News: Bulgarian victory at Slivnitza','Sergius led the decisive cavalry charge','Raina\'s reaction: rapturous joy, brief anxiety about her father'], why:'This opening news is the event that sets the whole unit\'s events in motion.'},
    {q:'What private doubt does Raina confess to her mother about Sergius, and why does she now dismiss it?', a:'Raina confesses that she once doubted whether Sergius\'s heroic qualities were real or just \'mere imagination\' shaped by her fondness for Byron, Pushkin, and an opera she and Sergius had enjoyed together. She now dismisses this doubt as cowardice, believing the battle has proven that \'it was all true\' and Sergius really is as splendid as he seemed.', points:['Doubted whether Sergius\'s heroism was real or imagined','Traced the doubt to Byron/Pushkin/opera influencing her ideas','Now dismisses it, believing the battle proved him a real hero'], why:'Understanding this doubt — and that it is dismissed too quickly — is important context for the irony of the rest of the unit.'},

    {q:'What does the fugitive reveal about his pistol, and how does Raina initially react?', a:'He reveals that his pistol is not loaded, since he finds chocolate more useful in battle than cartridges. Raina is initially \'outraged in her most cherished ideals of manhood,\' disgusted that a soldier would carry sweets like a schoolboy instead of ammunition.', points:['Pistol is unloaded; he carries chocolate instead of cartridges','Raina is initially disgusted/outraged','This challenges her romantic idea of what a soldier should be'], why:'This is the clearest early statement of the play\'s central satirical idea about unglamorous, practical soldiering.'},
    {q:'According to the fugitive, why did the famous cavalry charge actually succeed?', a:'According to the fugitive, the charge only succeeded because the defending side had, by mistake, been supplied with the wrong cartridges and could not fire their guns for ten minutes — not because of any real skill or bravery in the charge itself, which he calls unprofessional and compares to Don Quixote attacking windmills.', points:['Succeeded due to enemy being given wrong cartridges, not skill','Fugitive calls it unprofessional/reckless','Compares its leader to Don Quixote, says he should be court-martialled'], why:'This directly undercuts the heroic account Catherine gave earlier in the unit, and is central to the play\'s irony once Raina reveals who the leader was.'},

  longAnswers:[
    {q:'Trace how Raina\'s feelings about heroism and about the fugitive change across this unit, using evidence from the text.', a:"At the start of the unit, Raina's feelings about heroism are entirely admiring and uncomplicated. She reacts \"rapturously\" to news of Sergius's victory, and though she briefly confesses to having doubted him, she quickly dismisses this doubt as mere \"prosaic\" cowardice, reassured that \"it was all true\" — that Sergius really is as splendid as her romantic imagination had painted him.\n\nThis confidence is tested almost immediately once the fugitive climbs into her room. Notably, the text explicitly says Raina is \"far from being afraid\" — her first reaction is calm and even bold, not frightened — and this composure carries straight into the quick-thinking, protective courage she shows while hiding him from the search party — a moment where Raina herself acts heroically, in a much more grounded, practical way than the cavalry-charge heroism she has just been celebrating.\n\nHer feelings shift further, and more uncomfortably, once the fugitive reveals his unloaded pistol and admits he prefers chocolate to cartridges. Raina is \"outraged,\" disgusted by what feels like an insult to her ideals of manhood — yet she still gives him her last chocolates, suggesting sympathy is already creeping in alongside her disapproval.\n\nThe biggest shift comes once the fugitive describes the cavalry charge as reckless and lucky, and Raina discovers he has unknowingly been mocking her own fiancé. She responds \"with dignity\" rather than open anger — the hurt here is personal, not just ideological — yet by the very end of the unit, once she sees the same man collapse from pure exhaustion, her tone softens completely: she calls him \"the poor dear\" and asks her mother to let him sleep. Over the course of a single scene, then, Raina moves from uncomplicated pride, through outrage and hurt, to a new, more sympathetic understanding of the fugitive as an honest, exhausted human being rather than a coward or an enemy — a shift that quietly foreshadows the play's later romantic developments.", structure:"Introduction (Raina's feelings shift significantly within the unit) → Starting point: uncomplicated pride and dismissal of doubt → Middle: calm, undaunted courage while hiding him (text says she is 'far from being afraid') → Turning point: outrage at the chocolate/unloaded pistol, softened by sympathy → Climax: personal hurt, met 'with dignity', on discovering he mocked Sergius → Resolution: tenderness once she sees him exhausted → Conclusion linking this arc to the play's wider themes.", points:["Trace at least three distinct emotional stages in order","Use specific evidence/quotations for each stage","Explain the significance of the portrait-reveal turning point","Conclude by connecting this arc to the play's wider themes of realism vs romance"]},
    {q:'How does Shaw use the contrast between Catherine\'s account of the cavalry charge and the fugitive\'s account of the same event to build the play\'s satirical purpose?', a:"Shaw structures the opening of the play around two deliberately contrasting accounts of the exact same event — the cavalry charge at Slivnitza — designed to expose the gap between romantic legend and messy reality.\n\nCatherine's account, delivered first, is entirely admiring and stylised: she describes \"gallant splendid Bulgarians with their swords and eyes flashing, scattering the wretched Servian dandies like chaff,\" language that turns the charge into a glorious, almost mythical spectacle, with Sergius at its dashing centre. This is the civilian, secondhand version of events — proud, patriotic, and untouched by any real experience of battle.\n\nThe fugitive's account, delivered only pages later without either character realising its connection to Catherine's story, could not be more different. He describes the charge as \"like slinging a handful of peas against a window pane\" — clumsy and almost comic — and reveals that it only succeeded because the defending artillery had mistakenly been sent the wrong cartridges, not because of any real skill or bravery. He goes further, mocking the charge's leader as a reckless \"Don Quixote\" who ought to be court-martialled rather than celebrated.\n\nBy placing these two accounts so close together, and only then revealing that the fugitive has unknowingly been mocking Raina's own fiancé, Shaw creates both dramatic irony and satirical force in a single stroke. The audience is made to see clearly how quickly heroic legend can diverge from lived reality, and how easily glory can depend on luck rather than genuine skill or courage. This contrast, established right at the start of the play, sets up the anti-romantic argument that the rest of 'Arms and the Man' will continue to develop.", structure:"Introduction (two contrasting accounts of one event, deliberately juxtaposed) → Catherine's romanticised, secondhand account (evidence) → The fugitive's blunt, firsthand account (evidence) → The dramatic irony created once the portrait reveals the connection → Conclusion on how this sets up the play's satirical purpose.", points:["Clearly contrast Catherine's and the fugitive's accounts with specific quotations","Explain how each account reflects a different relationship to the battle (secondhand/romantic vs firsthand/practical)","Explain the dramatic irony created by the portrait reveal","Conclude by connecting this contrast to the play's wider anti-romantic, satirical aims"]}
  ]

  undumbify:{
    plain:"Months later, the war is over and Major Petkoff is home — greeted with a comic argument with Catherine about what counts as 'civilised' (electric bells versus shouting for servants, and whether washing should be hung out to dry). Then Sergius arrives and casually announces he's resigning from the army, because his celebrated cavalry charge only worked by accident, and 'proper' military science would have gotten him killed instead of promoted. Once Raina joins them, he and Petkoff start swapping war stories — including one about a Swiss soldier who escaped after Slivnitza by hiding in a young lady's bedroom. Sergius tells it as a joke, mocking the soldier's charm on the two women who sheltered him, with absolutely no idea he's describing Raina and Catherine's own secret. Raina, furious and terrified, accuses him of being made 'coarse' by army life. Once the parents leave them alone, though, the couple slides straight back into performing an intensely romantic, idealised love for each other — all while the maid Louka quietly listens in.",
    analogy:"It's like your partner cheerfully retelling an embarrassing rumour at the dinner table, not realising it's actually about you and your best friend — and after you shut it down, the two of you smooth it over with over-the-top declarations of how perfect and pure your relationship is, while someone else in the room has clearly clocked exactly what just happened.",
    example:"Sergius's line that soldiering is 'the coward's art of attacking mercilessly when you are strong, and keeping out of harm's way when you are weak' is Shaw handing his own anti-war argument to the play's most 'heroic'-seeming character — right after that same man has just resigned in disgust at how war actually works."
    ,examDef:"'Back from War' covers the opening of Act II of George Bernard Shaw's 'Arms and the Man', set in the garden of Major Petkoff's house on the morning of 6 March 1886, in which Petkoff returns from the front, Sergius reveals he has resigned his commission out of disillusionment with modern 'scientific' warfare, and — while reunited with Raina — unknowingly retells the Petkoffs the very story of the fugitive Swiss soldier that Raina and Catherine have been keeping secret, before he and Raina retreat into an exaggeratedly idealised display of romantic devotion."
  },
  explanation:{
    undumbified:"Act II opens in the garden of Major Petkoff's house on a spring morning, 6 March 1886. The servant Nicola is warning Louka to mend her rude, defiant manners towards their mistress, explaining that his own future (a planned shop in Sofia) depends on staying in the family's good graces; Louka scorns him for having 'the soul of a servant', which he accepts complacently as the secret of his success. Major Petkoff arrives home from the war, delighted to be back. He tells Catherine the war is over and the army is demobilising, and gently deflects her wish that he'd annexed Servia entirely. The two then have a comic domestic argument about what counts as 'civilised' behaviour — Catherine boasting about their new electric bell and insisting 'civilised people' don't shout for servants or hang washing where visitors can see it, while Petkoff defends a more relaxed, unwashed, shouting kind of comfort. Sergius Saranoff arrives, and when Catherine praises his 'magnificent cavalry charge', he responds with heavy irony, calling it 'the cradle and the grave of my military reputation': he won the battle by breaking the rules of 'scientific' warfare that the Russian generals were correctly following (and losing by), so the officers who lost by the book were promoted to major-general, while he remains a simple major. Disillusioned, he has decided to resign his commission once peace is finalised. Raina enters and greets Sergius affectionately; when Catherine asks if he's given up soldiering, Sergius delivers a cynical speech calling soldiering 'the coward's art' of only ever attacking the weak and avoiding the strong. Petkoff compares soldiering to a trade, and Sergius agrees, saying he has no ambition to succeed as a 'tradesman', and so has taken the advice of a 'bagman' — the Swiss captain who arranged a prisoner exchange with them at Peerot — and given up the profession. Petkoff recalls that this same Swiss officer had once cheated them out of fifty able-bodied prisoners in exchange for two hundred worn-out cavalry horses. Petkoff then asks Sergius to retell 'that queer story' the Swiss officer had told them about his own escape after Slivnitza — how he was hidden by two women. Sergius obliges, mockingly recounting how the fugitive took refuge in the bedroom of 'some patriotic young Bulgarian lady', charmed both her and her mother with his persuasive 'commercial traveller's' manners, and was sent off the next morning disguised in the coat of the (absent) master of the house. Raina, recognising the story as her own secret and stung by the mockery, accuses Sergius of having been made 'coarse' by his time in camp and turns away coldly; he immediately apologises. Petkoff, keen to get back to business (arranging the return of three regiments to Phillipopolis), is pulled away by Catherine, who wants to show him the electric bell, deliberately leaving Sergius and Raina alone together. Once alone, Sergius asks if he is forgiven; Raina responds with worshipful admiration, calling him her 'hero' and her 'king', and laments that while he has been out proving himself in the world, she has had to remain at home, 'inactive — dreaming — useless'. Sergius credits her inspiration for his conduct in the war, comparing himself to 'a knight in a tournament with his lady looking on', and Raina declares, very solemnly, that the two of them have found 'the higher love' — a love so pure that thinking of him makes her incapable of a base or ignoble thought. This entire exchange takes place as Louka silently enters to clear the breakfast table, her back turned to them but clearly within earshot. Raina goes to fetch her hat so they can go for a walk before lunch; Sergius, eager for her return, says any absence will feel like 'five hours'.",
    sections:[
      {h:'Setting the Scene', p:"The act opens in the garden of Major Petkoff's house on a beautiful spring morning, 6 March 1886 — the house on the right, the stable yard on the left, and washing hanging out to dry along the fruit bushes, with the remains of breakfast still on a small table."},
      {h:'Nicola and Louka', p:"Nicola warns Louka to 'mend her manners' before the mistress catches her defying orders and dismisses her. Louka scornfully accuses him of taking Catherine's side and having 'the soul of a servant'; Nicola accepts this complacently, explaining that his planned future — starting a shop in Sofia — depends entirely on staying in the family's good graces, since their custom and their good word matter more to him than pride."},
      {h:'Petkoff Returns', p:"A loud knock announces Major Petkoff's return from the war. He sits down to breakfast outdoors and tells Catherine that the treaty was signed three days ago at Bucharest and the army is being demobilised. Catherine wishes he had gone further and annexed Servia entirely, making Prince Alexander 'Emperor of the Balkans'; Petkoff dryly points out that this would have meant first subduing the whole Austrian Empire — which would have kept him away from her even longer."},
      {h:'Civilised Habits', p:"Petkoff and Catherine fall into a comic domestic disagreement about what counts as 'civilised' behaviour: Catherine boasts about their new electric bell (so Nicola needn't be shouted for) and insists refined people don't hang washing where visitors might see it, while Petkoff good-humouredly defends his habit of only bathing once a week and mocks the electric bell as an unnecessary fuss — a small, comic version of the play's larger interest in performed sophistication versus practical comfort."},
      {h:"Sergius's Resignation", p:"Sergius arrives and is warmly praised by Catherine for his 'magnificent cavalry charge' — but he responds 'with grave irony', calling it 'the cradle and the grave of my military reputation'. He explains that he won the battle by breaking the accepted rules of 'scientific' warfare that the Russian generals were correctly following (and losing by); as a result, the two colonels who lost by the book have been promoted to major-general, while he — who actually won — remains a simple major. Disillusioned by this injustice, he reveals he has already decided to resign his commission now that peace has been made, shocking Petkoff into dropping his cup."},
      {h:'Raina and Sergius Reunite', p:"Raina enters and Sergius greets her chivalrously, kissing her hand before she rushes to embrace her father. When Catherine asks whether Sergius is 'no longer a soldier', he delivers a sharply cynical speech: soldiering, he says, is 'the coward's art of attacking mercilessly when you are strong, and keeping out of harm's way when you are weak' — get your enemy at a disadvantage, and never fight on equal terms."},
      {h:'The Bagman and the Swiss Soldier', p:"Petkoff remarks that soldiering, then, is just a trade like any other; Sergius agrees, but says he has no ambition to succeed as a mere 'tradesman', and so has taken the advice of a 'bagman' — a travelling-salesman type — and resigned. This bagman turns out to be the Swiss captain who had arranged a prisoner exchange with them at Peerot; Petkoff recalls, with some resentment, that this same Swiss officer had 'humbugged' them into trading fifty able-bodied prisoners for two hundred broken-down, worn-out cavalry horses."},
      {h:"Sergius Mocks the Fugitive's Story", p:"Petkoff, amused, asks Sergius to retell the 'queer story' this same Swiss soldier had told them about his own escape after Slivnitza, hidden by two women. Sergius obliges mockingly: the fugitive, he says, had 'the good taste' to take refuge in the bedroom of 'some patriotic young Bulgarian lady', charmed both her and her mother with his 'persuasive commercial traveller's manners', and was sent on his way the next morning disguised in an old coat belonging to the (absent) master of the house."},
      {h:"Raina's Rebuke", p:"Raina — recognising this as the very secret she and her mother have been hiding — is deeply unsettled, and rebukes Sergius sharply: 'Your life in the camp has made you coarse, Sergius. I did not think you would have repeated such a story before me,' turning away from him coldly. Sergius, unaware of the real reason for her reaction, immediately apologises: 'I beg your pardon. Forgive me, Raina.'"},
      {h:'Left Alone Together', p:"Petkoff, keen to move on to business — arranging how three regiments will get back to Phillipopolis — is deliberately steered away by Catherine, who takes his arm and suggests they go admire the electric bell, leaving Sergius and Raina alone together in the garden."},
      {h:'The Higher Love', p:"Once alone, Sergius asks 'Am I forgiven?' Raina responds with open worship, calling him 'My hero! My king,' and laments that while he has been out in the world proving himself on the battlefield, she has had to remain at home, 'inactive — dreaming — useless.' Sergius credits her inspiration, saying he went through the war 'like a knight in a tournament with his lady looking on,' and Raina solemnly declares that the two of them have found 'the higher love' — a love pure enough that thinking of him, she says, makes her incapable of a base deed or an ignoble thought. Throughout this exchange, Louka enters to clear the breakfast table, her back turned to the couple but clearly present and listening."},
      {h:'A Walk Is Planned', p:"Raina goes to fetch her hat so the two of them can go for a walk before lunch; Sergius, impatient for her return, tells her that even five minutes away from him will feel like 'five hours' — closing the unit on a note of exaggerated, performed romantic devotion."}

  extracts:[

      text:"NICOLA: I shall always be dependent on the goodwill of the family. When I leave their service and start a shop in Sofia, their custom will be half my capital: their bad word would ruin me.\nLOUKA: (scornfully) You have the soul of a servant, Nicola.\nNICOLA: (complacently) Yes: that's the secret of success in service.",
      qs:[
        {type:'Contextual', q:'Why does Nicola warn Louka to mend her manners at the start of this unit?', a:'Nicola warns Louka because he fears that if the mistress (Catherine) suspects Louka is defying her, she will be dismissed from service — and Nicola, dependent on the family\'s goodwill for his own future plans, wants Louka to avoid causing trouble.', why:'This is the opening context Nicola gives before Louka accuses him of taking the mistress\'s side.'},
        {type:'Meaning', q:'Why does Nicola say the family\'s "custom" will be "half my capital" when he starts his shop?', a:'Nicola means that when he eventually leaves service to open a shop in Sofia, the Petkoff family\'s continued patronage (and their good word about him to others) will be as valuable as half the actual money he needs to succeed — while a bad word from them could ruin his business before it starts.', why:'This explains his entirely practical, unsentimental reason for staying in the family\'s good graces.'},
        {type:'Literary Analysis', q:'What is the effect of Louka\'s remark that Nicola has "the soul of a servant"?', a:'It is a sharp, contemptuous judgement of Nicola\'s character — Louka sees his careful deference to the family not as sensible planning but as a kind of self-erasure, a willingness to think and act like a servant even in his private ambitions. It sets up Louka\'s own contrasting ambition (to rise above her station) for the rest of the play.', why:'The line draws a clear contrast between Nicola\'s pragmatic acceptance of his class position and Louka\'s resistance to it.'},
        {type:'Inference', q:'What does Nicola\'s complacent response reveal about his outlook on life?', a:'It reveals that Nicola is entirely comfortable with, and even proud of, his pragmatic approach — he sees accepting one\'s position and playing by its rules (rather than resisting it) as the sensible path to eventual success, in clear contrast to Louka\'s more rebellious ambition.', why:'His calm, unbothered tone ("complacently") shows he takes no offence at being called servile — he agrees with the label and defends it as wisdom.'}
      ]

    {
      text:"CATHERINE: Civilised people never shout for their servants.\nPETKOFF: Well, I'll tell you something too. Civilised people don't hang out their washing to dry where visitors can see it; so you'd better have all that (indicating the clothes on the bushes) put somewhere else.\nCATHERINE: Oh, that's absurd, Paul: I don't believe really refined people notice such things.",

        {type:'Literary Analysis', q:'What comic technique is Shaw using in this exchange, and what is its effect?', a:'Shaw uses tit-for-tat comic irony: each character accuses the other of being uncivilised over a trivial domestic habit, while both are equally guilty of caring more about appearing sophisticated than about any genuine substance. The effect is gentle satire of a family anxious about social status and appearances.', why:'Neither character actually wins the argument — Catherine\'s closing line dismisses Petkoff\'s point without really answering it, which is itself part of the joke.'},
        {type:'Inference', q:'How does this small domestic argument connect to the play\'s larger themes?', a:'It is a lighter, domestic version of the play\'s larger interest in performance versus reality — just as Sergius\'s heroism and Raina\'s romantic ideals will later be shown as partly performed for appearances, Catherine and Petkoff\'s bickering over "civilised" behaviour shows a family more concerned with how things look to others than with any deeper standard.', why:'Recognising this parallel shows an understanding of how Shaw builds his satirical themes across both major and minor moments in the play.'}
      ]

    {
      text:"SERGIUS: (with grave irony) Madam: it was the cradle and the grave of my military reputation.\nCATHERINE: How so?\nSERGIUS: I won the battle the wrong way when our worthy Russian generals were losing it the right way. Two of their colonels got their regiments driven back on the correct principles of scientific warfare. Two major-generals got killed strictly according to military etiquette. Those two colonels are now major-generals; and I am still a simple major.",
      qs:[
        {type:'Meaning', q:'What does Sergius mean by saying his cavalry charge was "the cradle and the grave" of his military reputation?', a:'He means that the charge simultaneously made him famous (its "cradle," or birth) and ended his career\'s prospects (its "grave"), because although it won the battle, it broke the accepted rules of "scientific" warfare — meaning that, ironically, the officers who lost by following those same rules correctly were the ones who got promoted, not him.', why:'The extract directly explains this irony: the colonels who lost "the right way" are now major-generals, while Sergius, who won, remains a simple major.'},
        {type:'Literary Analysis', q:'What is ironic about the fact that Sergius is punished (in terms of promotion) for winning, while the losing colonels are rewarded?', a:'It is a sharp, situational irony that exposes the absurdity of military systems that reward rule-following over actual success — Shaw uses this to satirise the idea that war is a noble, meritocratic pursuit, showing instead that a rigid, bureaucratic notion of "correctness" can matter more to a military establishment than genuine victory.', why:'This directly supports the play\'s larger anti-romantic argument about the true nature of war and military honour.'},
        {type:'Inference', q:'What does Sergius\'s tone ("with grave irony") suggest about his true feelings towards his own celebrated status as a hero?', a:'It suggests that Sergius is privately bitter and disillusioned rather than proud — despite being publicly celebrated (as seen in Catherine\'s earlier praise), he sees his own fame as a kind of absurd accident that has actually damaged, rather than helped, his real military career.', why:'"Grave irony" signals that his words should not be taken as simple modesty, but as a serious, pointed criticism delivered in a controlled, ironic tone.'}
      ]

    {
      text:"SERGIUS: Soldiering, my dear madam, is the coward's art of attacking mercilessly when you are strong, and keeping out of harm's way when you are weak. Get your enemy at a disadvantage; and never, on any account, fight him on equal terms.",
      qs:[
        {type:'Contextual', q:'What prompts Sergius to make this speech?', a:'Catherine has just asked Sergius, "And so, you\'re no longer a soldier," after learning of his resignation — this speech is his cynical answer, redefining soldiering itself rather than simply confirming his decision.', why:'The extract is Sergius\'s direct response to Catherine\'s question about his changed status.'},
        {type:'Literary Analysis', q:'How does this speech function as one of the clearest statements of the play\'s central theme?', a:'This speech is arguably the most direct anti-war statement in the play so far — spoken not by the unromantic Swiss fugitive from Unit 1, but by Sergius himself, the very character the play has set up as the romantic, idealised hero. Having his disillusionment voiced by this specific character gives Shaw\'s critique of war particular force, since it comes from someone who has genuinely experienced its rewards and its absurdities firsthand.', why:'Recognising who says a line, and why that choice matters, is central to understanding how Shaw builds his satire through characterisation.'},
        {type:'Inference', q:'Does this speech suggest Sergius\'s cynicism is limited to his own military career, or does it reflect something deeper about his character?', a:'It suggests something deeper: Sergius appears to have become broadly cynical about honour, fairness, and merit in the world of war generally, not just bitter about his own promotion being denied. This wider disillusionment helps explain his growing restlessness and hints at deeper contradictions in his character that the play develops further in later units.', why:'The generalised, definitional tone of the speech ("Soldiering... is...") suggests a considered worldview, not just a personal complaint.'}

    {q:'Why does Nicola warn Louka to "mend her manners", and how does Louka respond?', a:'Nicola warns Louka that if their mistress, Catherine, suspects her of defying orders, Louka will be dismissed from service. Louka responds scornfully, accusing Nicola of taking the mistress\'s side and having "the soul of a servant" — a judgement Nicola accepts complacently, since he believes staying in the family\'s good graces is the secret to his own future success (a planned shop in Sofia).', points:['Nicola fears Louka will be dismissed if she keeps defying Catherine','Louka scornfully calls him servile ("soul of a servant")','Nicola accepts this complacently, tying it to his own practical goals'], why:'This opening exchange sets up the contrast between Nicola\'s pragmatic acceptance of his class position and Louka\'s ambition to rise above hers.'},
    {q:'What comic disagreement do Petkoff and Catherine have about "civilised" behaviour?', a:'Catherine insists that "civilised people" use an electric bell instead of shouting for servants and don\'t hang their washing out where visitors can see it; Petkoff retaliates by pointing out the washing hanging on the bushes, while defending his own preference for shouting and a more relaxed approach to bathing. Neither side really wins the argument — Catherine simply dismisses his point, insisting "really refined people" wouldn\'t notice such things.', points:['Catherine: electric bell and hidden washing = civilised','Petkoff: points out their own washing is visible, defends shouting/less frequent bathing','Neither side concedes; Catherine dismisses his point rather than answering it'], why:'This comic exchange satirises the family\'s concern with appearing sophisticated rather than any genuine standard of behaviour.'},
    {q:'Why does Sergius call his cavalry charge "the cradle and the grave" of his military reputation?', a:'He means the charge made him famous while simultaneously ending his career\'s progress, since it succeeded by breaking the rules of "scientific" warfare that the Russian generals correctly followed (and lost by) — meaning the colonels who lost "the right way" were promoted to major-general, while he, despite winning, remains a simple major.', points:['Charge made him famous ("cradle") but ended his career prospects ("grave")','He won by breaking the rules of "scientific" warfare','Officers who lost by the book were promoted instead of him'], why:'This phrase captures the play\'s central irony about the gap between real success and formal military recognition.'},
    {q:'What does Sergius\'s "coward\'s art" speech reveal about his true feelings on soldiering?', a:'The speech — defining soldiering as attacking only when strong and avoiding danger when weak, and never fighting on equal terms — reveals that Sergius has become deeply cynical about the honour and fairness of military life, despite being publicly celebrated as a hero. It is significant that this critique comes from Sergius himself, the play\'s most obviously "romantic" character, rather than from an outsider.', points:['Defines soldiering as calculated, not honourable, risk-avoidance','Shows Sergius\'s private disillusionment despite his public hero status','Significant because it comes from the play\'s most "heroic"-seeming character'], why:'This is one of the clearest direct statements of Shaw\'s anti-war satire, delivered through an unexpected character.'},
    {q:'How does Sergius unknowingly threaten Raina and Catherine\'s secret in this unit?', a:'When Petkoff asks him to retell the "queer story" the Swiss soldier told about escaping after Slivnitza, Sergius mockingly recounts exactly the events of Unit 1 — the soldier hiding in a young lady\'s bedroom, charming her and her mother, and escaping in the master\'s old coat — without realising that the "young lady" and her mother are Raina and Catherine, sitting right there listening to him.', points:['Sergius retells the Swiss soldier\'s escape story at Petkoff\'s request','The story matches Raina and Catherine\'s own secret exactly','Sergius has no idea the women in the story are his own audience'], why:'This is the unit\'s central moment of dramatic irony, testing whether the family\'s secret will be exposed.'},
    {q:'What does Raina mean by saying she and Sergius have found "the higher love", and why is this ironic given what the audience already knows?', a:'Raina means that their love is so pure and elevated that thinking of Sergius makes her incapable of any base or dishonourable thought or action. This is ironic because the audience has just watched Sergius unknowingly mock the very secret Raina is desperately protecting, and — as the previous unit showed — has already seen Raina herself express private doubts about idealised, storybook heroism; the "higher love" the two now perform for each other rings hollow against what the audience has just witnessed.', points:['"Higher love" = an idealised, elevated, morally pure love','Ironic because Sergius has just unknowingly threatened Raina\'s secret minutes earlier','Echoes Raina\'s own earlier doubts about romantic ideals in Unit 1'], why:'Recognising this irony is key to understanding how Shaw undercuts his characters\' romantic declarations even as they make them.'}
  ],
  longAnswers:[
    {q:'Discuss how Shaw uses Sergius\'s resignation and his "coward\'s art" speech to develop the play\'s satirical view of war.', a:"Shaw uses Sergius — the character introduced in Act I as the very image of a dashing, celebrated war hero — as an unexpected mouthpiece for the play's sharpest anti-war argument, which gives that argument far more force than if it had simply come from an outside critic.\n\nSergius's account of his own cavalry charge reveals a system that punishes real success rather than rewarding it: he explains, \"with grave irony,\" that he won the battle by breaking the accepted rules of \"scientific\" warfare, while the Russian generals correctly followed those same rules and lost. As a result, the officers who lost \"the right way\" were promoted to major-general, while Sergius himself remains a simple major. This is Shaw's central satirical point made concrete: military honour, in this world, has less to do with genuine achievement than with correctly following procedure, even in defeat.\n\nHis \"coward's art\" speech pushes this disillusionment further, redefining soldiering itself as a calculated, self-interested pursuit — attacking only the weak, avoiding the strong, and never fighting on equal terms — stripping away any pretence of nobility or fair contest. Coming from Sergius, whose earlier introduction (via Catherine's admiring description in Unit 1) painted him as a storybook hero, this speech creates a jarring, deliberate contrast that forces the audience to reconsider everything they were told about him before he ever appeared on stage.\n\nBy having his most romantic-seeming character voice this cynicism, Shaw achieves a stronger satirical effect than a simple outsider's critique would allow: even the person the whole town is celebrating privately recognises that the system rewarding him is arbitrary and unjust, undermining the audience's ability to take the earlier heroic framing of him at face value.", structure:"Introduction (Sergius as an unexpected, more powerful mouthpiece for anti-war satire) → His account of the cavalry charge and the irony of his non-promotion (evidence) → The 'coward's art' speech and what it redefines about soldiering (evidence) → Why this is more effective satire coming from Sergius specifically → Conclusion on the cumulative satirical effect.", points:["Explain the irony in how Sergius's charge was treated by the military system","Quote or closely paraphrase the 'coward's art' speech and explain its redefinition of soldiering","Explain why the effect is stronger because it's Sergius (not an outsider) making this critique","Conclude with the broader satirical purpose this serves in the play"]},
    {q:'Examine the dramatic irony surrounding Sergius\'s story of the fugitive Swiss soldier, and discuss its significance for the audience\'s understanding of Raina and Sergius\'s relationship.', a:"One of the most carefully engineered moments in this unit is the dramatic irony surrounding Sergius's retelling of the Swiss soldier's escape — a story the audience already knows intimately from Unit 1, but which Sergius tells entirely without realising its personal significance to his listeners.\n\nAt Petkoff's prompting, Sergius mockingly recounts how the fugitive took refuge in \"the chamber of some patriotic young Bulgarian lady\", charming both her and her mother with his \"persuasive commercial traveller's manners\" before escaping disguised in the master's old coat. The audience recognises immediately that Sergius is describing Raina and Catherine's own secret — a secret he has no idea he is exposing, since he is simply repeating a story told to him secondhand by the fugitive himself.\n\nThis irony does real work for the play beyond its comic tension. Raina's response — sharply accusing Sergius of being made \"coarse\" by camp life, and turning away coldly — reveals a defensiveness that is really about self-protection rather than genuine moral outrage at his manners, though she frames it that way. Sergius, misreading the true cause of her anger, immediately apologises, unaware of what he has actually stumbled near.\n\nThe scene that follows makes the irony even sharper: within moments of this close call, Raina and Sergius retreat into an intensely idealised, performed declaration of a \"higher love\", each praising the other in exaggerated, almost theatrical language, even as Louka silently clears the table nearby, seemingly picking up on tensions neither of them fully acknowledges aloud. Given that Raina confessed her own doubts about romantic ideals back in Unit 1, and that the fugitive she sheltered directly mocked Sergius's celebrated heroism, the audience is left watching two characters perform an idealised love story while sitting on secrets and contradictions that threaten to undo it — a technique Shaw uses throughout the play to expose the gap between romantic performance and messier reality.", structure:"Introduction (the dramatic irony of Sergius unknowingly retelling Raina and Catherine's secret) → What Sergius actually says, and why the audience recognises it → Raina's reaction and its real (unstated) motivation → How this irony deepens the following 'higher love' scene → Conclusion on what this reveals about performance versus reality in Raina and Sergius's relationship.", points:["Explain clearly what the dramatic irony is and why the audience (but not Sergius) understands it","Analyse Raina's reaction as concealing a different motive than the one she states","Connect this moment to the following 'higher love' scene between Raina and Sergius","Conclude by linking this to the play's wider theme of performed vs genuine romance"]}
  ]

  undumbify:{
    plain:"The moment Raina goes inside to change, Sergius starts flirting with Louka — even while insisting he's devoted to the exhausting 'higher love' he shares with Raina. Louka bluntly tells him gentlefolk are all the same: he's secretly courting her while Raina, she implies, has feelings for someone else entirely. Furious, Sergius grabs her arm hard enough to hurt her, then immediately feels guilty, though he still refuses her tearful request for a kiss to make it better. Raina returns none the wiser, and soon after, Captain Bluntschli turns up to return the borrowed coat and leave quietly — except everyone keeps stopping him. In the chaos, Raina blurts out 'the chocolate cream soldier!' in front of her father and fiancé, nearly exposing the whole secret, before improvising a cover story about a ruined dessert decoration. By the end, despite three separate near-disasters, Bluntschli — dragged in to help solve a logistics problem — ends up agreeing to stay for lunch.",
    analogy:"It's like your partner swearing you're 'the only one' right before hitting on someone else the second you leave the room — and then, later that same day, you nearly blurt out a secret nickname for your ex in front of your whole family, and have to invent a wildly unconvincing cover story on the spot while everyone stares at you.",
    example:"When Louka says 'Gentlefolk are all alike—you declaring love to me behind Miss Raina's back, and she doing the same behind yours,' she isn't just being cheeky — she's telling the audience, in one line, that both halves of the play's 'perfect' romantic couple are already quietly betraying it."
    ,examDef:"'A Guest at Lunch' completes Act II of George Bernard Shaw's 'Arms and the Man', in which Sergius flirts with the maid Louka even as he claims devotion to his 'higher love' for Raina, gripping her arm in anger when she needles him about his hypocrisy; shortly afterwards, Captain Bluntschli arrives to return the coat he escaped in, and a chain of near-exposures — including Raina's own slip of the tongue — nearly reveals to Petkoff and Sergius that Bluntschli is the fugitive Raina and Catherine sheltered, before he is persuaded to stay for lunch."
  },
  explanation:{
    undumbified:"As Raina goes inside to change for their walk, Sergius, left alone with Louka, asks whether she knows what 'the higher love' is; he admits it is 'very fatiguing' to keep up and that he feels the need for 'some relief' from it. When Louka offers him coffee and he takes her hand instead, she warns him to let go before she is 'disgraced' — Miss Raina, she says, is sure to be watching. Stung, Sergius warns her not to insult 'the higher love', even as he admits he himself might be 'worthless enough' to betray it. Louka sharply observes that 'gentlefolk are all alike' — he is secretly courting her behind Raina's back, just as, she implies, Raina has feelings for another man behind his. Shocked and coldly formal, Sergius reminds her that a gentleman doesn't discuss his fiancée's conduct with her maid; Louka, unbothered, goes further, predicting that if 'that gentleman' (the fugitive from Act I) ever returns, Raina will marry him instead, since she knows the difference between the performed manner Raina and Sergius put on for each other and their real feelings. Sergius, genuinely shocked, grips her arm tightly enough to hurt her; when she winces and asks him to stop, he immediately feels sorry and apologises, but firmly refuses when she tearfully asks for her hurt to be 'made well' with a kiss. Louka leaves with quiet dignity just as Raina re-enters, ready for their walk; Raina teasingly asks if he's been flirting with Louka, and Sergius denies it hastily, while Raina laughs it off as 'only a jest'. Catherine then interrupts to ask Sergius to help Petkoff work out how to move three regiments to Phillipopolis, since Petkoff is objecting to all her suggestions; Raina is disappointed but lets him go, extracting a promise he won't be long. Once alone, Raina paces restlessly, and Catherine scolds her for the mess she's caused by helping the Swiss fugitive, since Petkoff had immediately asked after the very coat they'd sent him off in. Raina, half-serious, threatens to 'stuff him with chocolate creams' if she ever sees him again for telling on them — then admits, 'capriciously', that she often feels a reckless urge to shock Sergius's propriety, and that she half hopes he does find out about the chocolate cream soldier. At that moment, Louka announces that a Servian officer, Captain Bluntschli, has called and asked for 'the lady of the house', without seeming to know who Catherine actually is; he has brought a large carpet bag. Catherine, realising in a panic that he has come to return the coat, first considers turning him away, then decides to have him brought quietly through the garden — avoiding the library, where Petkoff and Sergius are working — so she can handle the situation privately. Bluntschli arrives, now clean, groomed, and smartly uniformed, and insists he has only come to return the coat and leave at once; but before Catherine can finish taking down his address, Petkoff and Sergius burst out of the house to greet him warmly, delighted to find a competent military man on hand, since they are stuck on a logistics problem about moving three cavalry regiments to Phillipopolis. Bluntschli immediately identifies the real issue — forage — and confidently offers to help sort it out; as he prepares to leave with them, Raina comes out of the house and, completely losing her composure, blurts out 'Oh, the chocolate cream soldier!' in front of everyone. Bluntschli freezes, Sergius looks on in astonishment, and Petkoff and Catherine exchange alarmed glances, before Catherine smoothly steps in to introduce Bluntschli properly as a guest and one of their 'new Servian friends'. Raina quickly improvises an explanation: she claims she made a decorative ornament for the morning's ice pudding, which the clumsy Nicola ruined by stacking plates on top of it, and that she was simply thinking aloud about it — hoping Bluntschli hadn't thought she meant him. Bluntschli, playing along, assures her (with visible relief) that he had indeed thought so, and that her explanation was a welcome relief. Just then, Nicola appears with Bluntschli's carpet bag, following instructions Louka had given him earlier (before the cover story was invented), and nearly exposes the situation again; Catherine sharply denies giving any such order, and a flustered Nicola takes the blame himself to smooth things over. Petkoff, irritated at Nicola's apparent overstepping, insists that Bluntschli stay with them until his business is done, and Raina eagerly seconds the invitation. Petkoff jokes to Catherine that Bluntschli is really waiting on her approval to stay, and Catherine, though visibly uneasy, dutifully presses him to remain. Bluntschli responds in his 'driest military manner' that he is entirely at 'madame's orders,' then smiles and agrees to stay, closing the act on Catherine's silent gesture of despair.",
    sections:[
      {h:'Sergius Tests Louka', p:"With Raina indoors changing, Sergius turns to Louka and asks if she knows what 'the higher love' is, then admits — before she can answer — that it is 'very fatiguing' to sustain and that he feels the need for 'some relief.' The remark instantly undercuts the idealised declarations he and Raina made to each other only moments earlier in Unit 2."},
      {h:"Louka's Warning", p:"When Sergius takes Louka's hand instead of the coffee she offers, she warns him to let go before she is 'disgraced', since Raina is sure to be watching. Stung, Sergius warns her not to insult 'the higher love' — even while all but admitting he might be 'worthless enough' to betray it himself."},
      {h:'Gentlefolk Are All Alike', p:"Louka delivers the unit's sharpest line: 'Gentlefolk are all alike—you declaring love to me behind Miss Raina's back, and she doing the same behind yours.' She goes further, predicting that Raina will marry 'that gentleman' (the Act I fugitive) if he ever returns, since she — as a servant who observes both of them closely — can tell the difference between Raina and Sergius's performed affection and their real feelings."},
      {h:"Sergius Grips Louka's Arm", p:"Genuinely shocked by Louka's accusation, Sergius strides to her and grips her arm tightly enough to hurt, demanding she 'listen' to him; when she winces and protests, he lets go and apologises immediately, insisting 'a gentleman has no right to hurt a woman under any circumstances.' When Louka tearfully asks for her hurt to be 'made well' with a kiss, however, Sergius firmly refuses ('Never!') and puts as much distance between them as possible — showing the limits of his sudden remorse."},
      {h:'Raina Returns', p:"Louka leaves with quiet dignity just as Raina comes out ready for their walk. Raina teasingly asks if Sergius has been flirting with Louka; he denies it 'hastily', and Raina, sensing nothing serious, laughs the moment off as 'only a jest' — an example of dramatic irony, since the audience has just watched something far more serious unfold."},
      {h:"Raina's Private Exasperation", p:"Called away to help Petkoff with military logistics, Sergius leaves Raina and Catherine alone. Catherine scolds Raina for the trouble caused by sheltering the Swiss fugitive, since Petkoff had immediately asked after the very coat they'd sent him off in. Raina, half-joking, threatens to 'stuff him with chocolate creams' if she ever catches him — then admits, more seriously, that she often feels a reckless urge to shock Sergius's sense of propriety, and even half hopes he discovers the truth about 'the chocolate cream soldier.'"},
      {h:'Bluntschli Returns the Coat', p:"Louka announces the arrival of a Servian officer, 'Captain Bluntschli', who has asked for 'the lady of the house' without appearing to know who Catherine is, and has brought a large carpet bag. Catherine immediately guesses he has come to return the coat, and — after briefly considering turning him away — decides to have him brought quietly through the garden, deliberately avoiding the library where Petkoff and Sergius are working, so she can manage the situation privately."},
      {h:"Catherine's Cover-Up Attempt", p:"Bluntschli arrives, now clean, well brushed and smartly uniformed, and insists he has only come to return the coat and leave immediately. Catherine, hurrying to keep things contained, begins taking down his address so the coat can simply be sent on — trying to end the visit before her husband or Sergius can appear."},
      {h:'Petkoff and Sergius Interrupt', p:"Before Catherine can finish, Petkoff and Sergius burst out of the house, delighted to find Bluntschli — a competent, experienced officer — on hand to help with a logistics problem: moving three cavalry regiments to Phillipopolis. Bluntschli instantly identifies the real issue as forage, and confidently offers to help solve it, completely derailing Catherine's plan to send him away quietly."},
      {h:'The Chocolate Cream Soldier Slip', p:"As Bluntschli prepares to leave with Petkoff and Sergius, Raina comes out of the house and, 'completely losing her presence of mind,' blurts out: 'Oh, the chocolate cream soldier!' Bluntschli freezes, Sergius looks on in bewilderment, and Petkoff and Catherine exchange alarmed glances — the family's secret is one sentence away from total exposure."},
      {h:"Raina's Quick Cover Story", p:"Catherine steps in smoothly to introduce Bluntschli as a guest, giving Raina a moment to recover. Raina then improvises an explanation on the spot: she claims she had decorated the morning's ice pudding, which the clumsy Nicola then ruined by stacking plates on top of it, and that she was simply thinking aloud, hoping Bluntschli hadn't imagined she meant him. Bluntschli, playing along with visible relief, assures her that he had indeed thought so — and that her explanation was a relief."},
      {h:"Nicola's Blunder and the Invitation to Stay", p:"Just as the danger seems to have passed, Nicola appears with Bluntschli's carpet bag, following an order Louka had given him earlier (before Raina's cover story existed) — nearly reopening the secret. Catherine sharply denies giving any such order; a bewildered Nicola quickly takes the blame himself to smooth things over. An irritated Petkoff, assuming Nicola has simply overstepped, insists that Bluntschli stay with the family until his business is finished; Raina eagerly seconds the invitation, and Bluntschli — in his 'driest military manner' — finally agrees to stay, closing the act on Catherine's silent gesture of despair."}

    revision:"Sergius flirts with Louka the moment Raina leaves, admitting the 'higher love' is 'fatiguing' • Louka warns she'll be 'disgraced'; Sergius warns her not to insult the higher love • Louka: 'Gentlefolk are all alike' — predicts Raina will marry 'that gentleman' (the Act I fugitive) if he returns • Sergius grips Louka's arm in shock/anger, hurting her; apologises but refuses her request for a kiss • Raina returns, teasingly asks if he's been flirting, laughs it off as 'only a jest' • Sergius leaves to help Petkoff with troop logistics • Raina, alone with Catherine, admits she half-hopes Sergius finds out about the chocolate cream soldier • Louka announces 'Captain Bluntschli' has arrived to return the coat; Catherine tries to intercept him quietly, avoiding the library • Bluntschli arrives, smart and clean, insists he'll leave at once • Petkoff and Sergius burst out, rope him into helping move regiments to Phillipopolis (forage problem) • Raina blurts 'Oh, the chocolate cream soldier!' in front of everyone — near-total exposure • Catherine covers; Raina invents a story about a ruined ice-pudding decoration; Bluntschli plays along • Nicola nearly re-exposes the secret by bringing Bluntschli's bag on Louka's earlier orders; Catherine denies it, Nicola takes the blame • Petkoff insists Bluntschli stay; he agrees in his 'driest military manner', act ends with Catherine's gesture of despair."

  extracts:[
    {
      text:"SERGIUS: Louka, do you know what the higher love is?\nLOUKA: No, sir.\nSERGIUS: Very fatiguing thing to keep up for any length of time, Louka. One feels the need of some relief after it.\n...\nSERGIUS: (taking her hand) Thank you, Louka.\nLOUKA: Let me go, sir. I shall be disgraced. Miss Raina is sure to be spying about after you.\nSERGIUS: (stung—letting her go) Take care, Louka. I may be worthless enough to betray the higher love; but do not you insult it.",
      qs:[
        {type:'Contextual', q:'What prompts Sergius to speak to Louka about "the higher love" the moment Raina leaves?', a:'With Raina gone indoors to change, Sergius is left alone with Louka, and rather than simply waiting quietly, he almost immediately begins flirting with her, taking her hand when she offers him coffee — this opening remark about the "higher love" being "fatiguing" is his way of excusing this behaviour to himself.', why:'The extract opens the scene, immediately following Raina\'s exit from the garden.'},
        {type:'Meaning', q:'What does Sergius mean when he calls the "higher love" "a very fatiguing thing to keep up"?', a:'He means that maintaining the idealised, elevated, performed devotion he expressed to Raina in the previous unit is exhausting to sustain constantly, and that he feels a need for "relief" from it — which, in this scene, takes the form of flirting with Louka.', why:'This directly undercuts his own romantic declaration to Raina only a short time earlier, revealing the "higher love" as performance rather than lived reality.'},
        {type:'Literary Analysis', q:'What is ironic about Sergius warning Louka not to "insult" the higher love, given his own behaviour in this scene?', a:'It is deeply ironic, since Sergius is actively betraying the "higher love" himself by flirting with Louka at that very moment — he demands respect for an ideal he is personally undermining, exposing a gap between his stated values and his real conduct that is central to Shaw\'s satire of Sergius\'s character.', why:'Recognising this contradiction (he defends the ideal while breaking it) is key to understanding how Shaw builds Sergius as a hypocritical, rather than simply romantic, figure.'}
      ]
    },
    {
      text:"LOUKA: Gentlefolk are all alike—you declaring love to me behind Miss Raina's back, and she doing the same behind yours. I know the difference between the sort of manner you and she put on before one another and the real manner. (Sergius looks shocked. He strides grimly to her, and grips her above the elbows with both hands.)\nSERGIUS: Now listen you to me!\nLOUKA: (wincing) Not so tight: you're hurting me!",
      qs:[
        {type:'Meaning', q:'What accusation does Louka make against both Sergius and Raina in this extract?', a:'Louka accuses both of them of hypocrisy: she claims Sergius is secretly courting her behind Raina\'s back, while — she implies — Raina has feelings for another man that she hides from Sergius, and that both of them "put on" a performed, idealised manner in front of each other that differs from their real feelings and behaviour.', why:'The extract directly states Louka\'s claim that "gentlefolk are all alike," using both Sergius and Raina as examples of this hypocrisy.'},
        {type:'Literary Analysis', q:'Why is this one of the most important lines in the unit for understanding the play\'s wider themes?', a:'This line names, out loud, the exact gap between performance and reality that Shaw has been building throughout the play — the difference between the "sort of manner" characters "put on before one another" and their "real manner." Coming from a servant who observes both Raina and Sergius closely, it functions almost as the play\'s own thesis statement about romantic self-deception, spoken by someone with nothing to lose by saying it plainly.', why:'Louka\'s outsider, servant-class perspective allows her to state a truth that the upper-class characters are too invested in appearances to admit themselves.'},
        {type:'Inference', q:'Why does Sergius react to Louka\'s words with physical force rather than simply denying them?', a:'His violent reaction suggests that Louka\'s words strike uncomfortably close to a truth he does not want to confront — rather than calmly refuting an accusation he believed to be false, his shocked, forceful response hints that some part of him recognises the accuracy of what she has just said.', why:'A calm, confident denial would suggest the accusation was baseless; his physical, emotional reaction instead suggests it has hit a nerve.'}
      ]
    },
    {
      text:"RAINA: (capriciously—half to herself) I always feel a longing to do or say something dreadful to him—to shock his propriety—to scandalise the five senses out of him! (to Catherine perversely) I don't care whether he finds out about the chocolate cream soldier or not. I half hope he may.",
      qs:[
        {type:'Contextual', q:'What has just happened before Raina makes this admission to Catherine?', a:'Catherine has just scolded Raina for the trouble caused by hiding the Swiss fugitive, reminding her that Petkoff had immediately asked for the very coat they had sent him off in — Raina\'s admission comes as a defiant, half-joking response to her mother\'s anxiety about the secret being discovered.', why:'The extract directly follows Catherine\'s warning that "if Sergius finds out, it is all over between you."'},
        {type:'Literary Analysis', q:'What does this admission reveal about Raina\'s true feelings towards her performed relationship with Sergius?', a:'It reveals a genuine, restless dissatisfaction beneath Raina\'s idealised devotion to Sergius — a real, if only half-acknowledged, urge to disrupt the "propriety" and performance that defines their relationship, suggesting that Raina, like Sergius in the previous extract, is not as fully committed to the "higher love" as her earlier declarations suggested.', why:'This connects directly to Louka\'s accusation in the previous extract that Raina, too, "puts on" a manner that differs from her real feelings.'},
        {type:'Inference', q:'How does this extract prepare the audience for the "chocolate cream soldier" slip that follows shortly afterward?', a:'By having Raina openly admit she "half hopes" Sergius discovers the secret, Shaw makes her subsequent, apparently accidental slip of the tongue feel less like pure coincidence and more like the surfacing of a genuine, half-conscious wish — foreshadowing the near-disastrous exposure that follows only a short time later in the same unit.', why:'This is a clear example of Shaw planting a character\'s stated desire just before the plot delivers (nearly) exactly that outcome.'}
      ]
