      qs:[
        {type:'Contextual', q:'What causes Raina to blurt out "the chocolate cream soldier" at this exact moment?', a:'Bluntschli, having been recruited by Petkoff and Sergius to help with the regiment logistics, is about to leave with them just as Raina comes out of the house — catching sight of him unexpectedly and without warning causes her to react instinctively, using the private nickname she gave him back in Unit 1, before she can stop herself.', why:'The stage direction notes she is "completely losing her presence of mind," showing this is an involuntary, unplanned outburst.'},
        {type:'Literary Analysis', q:'How does Shaw use staging (the characters\' reactions) to heighten the tension of this moment, rather than relying only on dialogue?', a:'Shaw uses a tense, wordless chain of reactions — Bluntschli standing "rigid," Sergius looking at Raina in amazement, then at Petkoff, who looks back at him and then at his wife — to build suspense purely through physical staging before any character actually speaks again. This lets the audience register the danger of exposure through silence and glances, which is often more tense than dialogue would be.', why:'This moment of near-silent, cascading reactions is a deliberate theatrical technique to maximise dramatic tension at the play\'s most dangerous point of potential exposure.'},
        {type:'Inference', q:'What does Catherine\'s quick recovery in this extract reveal about her character?', a:'Catherine\'s ability to step in immediately with a "commanding presence of mind," smoothly redirecting attention by formally introducing Bluntschli, shows her to be quick-thinking, socially skilled, and highly capable under pressure — reinforcing her established character as someone deeply invested in managing appearances and controlling how her family is perceived by others.', why:'This mirrors her earlier concern (in Unit 2) with "civilised" appearances, now put to urgent, practical use in an actual crisis.'}

    {
      text:"RAINA: (to Bluntschli) I hope you didn't think that you were the chocolate cream soldier, Captain Bluntschli.\nBLUNTSCHLI: (laughing) I assure you, I did. Your explanation was a relief.",
      qs:[
        {type:'Meaning', q:'What "explanation" is Raina referring to in this extract?', a:'Raina is referring to the cover story she has just invented: that she made a decorative ornament for the morning\'s ice pudding, which the clumsy Nicola ruined by stacking plates on top of it, and that her earlier exclamation was simply her thinking aloud about that — not about Bluntschli himself.', why:'This follows directly from Raina\'s improvised explanation about the ice pudding ornament, given moments earlier to the whole group.'},
        {type:'Literary Analysis', q:'What is the comic and dramatic effect of Bluntschli\'s reply, "Your explanation was a relief"?', a:'The line is a double-edged piece of dramatic irony: on the surface, Bluntschli seems to be politely accepting Raina\'s (false) cover story, but his genuine relief is really about the secret itself nearly being exposed — the audience, who knows the truth, hears both meanings at once, while the other characters on stage hear only the innocent, surface-level one.', why:'This is a clear example of dialogue functioning on two levels simultaneously for different audiences — the other characters versus the theatre audience.'},
        {type:'Inference', q:'What does this exchange suggest about how well Raina and Bluntschli are able to communicate without giving anything away?', a:'It suggests real quick-thinking complicity between them — despite having no time to plan, both manage to publicly perform an entirely false, innocent version of events convincingly, and both immediately understand the other\'s hidden meaning, hinting at a private understanding between them that neither Sergius nor Raina\'s parents share.', why:'Their ability to instantly, silently cooperate in this cover-up foreshadows a deeper connection between the two characters that the play will go on to develop.'}
      ]

  shortAnswers:[
    {q:'What does Sergius mean by calling the "higher love" "a very fatiguing thing to keep up"?', a:'He means that constantly performing the idealised, elevated devotion he professed to Raina is exhausting to sustain, and that he feels a need for "relief" from it — a need he immediately acts on by flirting with Louka the moment Raina leaves the garden.', points:['"Higher love" = idealised, performed devotion','Sergius admits it is tiring to maintain constantly','He seeks "relief" by flirting with Louka right after Raina leaves'], why:'This line is central to Shaw\'s satire of the "higher love" as performance rather than genuine, sustainable feeling.'},
    {q:'How does Louka respond when Sergius takes her hand, and what does this reveal about her character?', a:'Louka asks him to let her go, warning that she will be "disgraced" if Raina catches them — showing that she is aware of the real danger to her own position, but she is also bold enough to needle Sergius further about his hypocrisy rather than simply staying silent, revealing both her practical caution and her sharp, unafraid honesty.', points:['Louka warns she\'ll be "disgraced" if caught','Shows awareness of her own vulnerable position as a servant','Still speaks boldly/honestly to Sergius despite the risk'], why:'This combination of caution and boldness is consistent with Louka\'s character throughout the play.'},
    {q:'What does Louka mean by saying "Gentlefolk are all alike"?', a:'She means that upper-class people like Sergius and Raina are hypocrites who perform an idealised, respectable manner in front of each other while secretly acting quite differently — in this case, Sergius flirting with Louka behind Raina\'s back, while (Louka implies) Raina has feelings for another man behind Sergius\'s.', points:['Accuses "gentlefolk" of general hypocrisy','Sergius: courting Louka secretly','Raina (implied): has feelings for someone else (the Act I fugitive)'], why:'This line names the gap between performance and reality that runs through the whole play.'},
    {q:'Why does Sergius grip Louka\'s arm, and how does he react afterward?', a:'He grips her arm because he is genuinely shocked and stung by her accusation that Raina has feelings for another man, and grabs her — hurting her in the process — while demanding she "listen" to him. When she winces and protests, he immediately lets go, apologises, and insists a gentleman has no right to hurt a woman, but then firmly refuses her tearful request to kiss her hurt better.', points:['Grips her out of shock/anger at her accusation','Lets go and apologises once she winces','Refuses her request for a kiss despite his apology'], why:'This shows the limits of Sergius\'s remorse — sincere enough to apologise, but not enough to offer real tenderness.'},
    {q:'Why is Raina "capriciously" tempted to shock Sergius\'s propriety, and what does this reveal about her feelings at this point?', a:'Raina admits she often feels a reckless urge to do or say something dreadful to Sergius, "to scandalise the five senses out of him," and even says she half hopes he discovers the chocolate cream soldier secret. This reveals a real, restless dissatisfaction beneath her idealised devotion to him — echoing Louka\'s earlier accusation that Raina, like Sergius, is not as genuinely committed to the "higher love" as she performs.', points:['Raina admits an urge to shock/scandalise Sergius','Says she half hopes he discovers the secret','Reveals restlessness/dissatisfaction beneath her idealised devotion'], why:'This is a key moment showing that Raina\'s doubts (first seen in Unit 1) have not disappeared, despite her romantic declarations in Unit 2.'},
    {q:'Why does Raina\'s "chocolate cream soldier" slip nearly expose the family\'s secret, and how does she cover for it?', a:'Raina blurts out the private nickname in front of Petkoff, Sergius, and Bluntschli himself just as he is about to leave, causing Bluntschli to freeze and Sergius to react with amazement — an outburst that could immediately connect Bluntschli to the story Sergius mockingly told earlier in Unit 2. Catherine steps in to smoothly introduce Bluntschli as a guest, buying Raina time to invent an explanation: that she was thinking aloud about a chocolate decoration for the morning\'s ice pudding, ruined by Nicola.', points:['Slip happens right as Bluntschli is about to leave with Petkoff/Sergius','Bluntschli freezes; Sergius reacts with amazement','Catherine buys time; Raina invents the ice-pudding cover story'], why:'This is the unit\'s central crisis point, testing whether the secret from Unit 1 and 2 will finally be exposed.'}
  ],
  longAnswers:[
    {q:'Discuss how Shaw uses the Sergius-Louka scene to undermine the idealised "higher love" established between Sergius and Raina in Unit 2.', a:"Shaw places the Sergius-Louka scene immediately after Sergius and Raina's rapturous declarations of a \"higher love\" in Unit 2, using the timing itself to devastating satirical effect: the audience has barely finished watching Sergius call Raina his inspiration before he is flirting with the maid the moment she is out of sight.\n\nSergius's opening line to Louka — admitting the \"higher love\" is \"very fatiguing\" and that he needs \"some relief\" — is a direct, almost confessional undercutting of everything he told Raina only minutes earlier. Rather than framing his behaviour as a total betrayal of his stated ideals, Shaw has Sergius openly acknowledge, in the moment, that performing this idealised devotion is a strain he is actively seeking relief from — turning his hypocrisy into something closer to self-aware exhaustion than simple deceit.\n\nLouka's role in this scene is crucial: rather than simply being a passive object of Sergius's attention, she directly names the hypocrisy at play, telling him plainly that \"gentlefolk are all alike\" and that she can tell the difference between the performed manner he and Raina put on for each other and their real feelings. This line does more than criticise Sergius specifically — it extends the accusation to Raina too, suggesting that the entire \"higher love\" relationship, on both sides, is a kind of mutual performance rather than a genuine, sustainable connection.\n\nSergius's violent, defensive reaction to this accusation — gripping Louka's arm hard enough to hurt her — suggests that her words have struck a nerve rather than being easily dismissed as baseless. His immediate remorse, followed by his refusal to offer Louka any real tenderness afterward, shows a character caught between competing impulses: guilt at his own behaviour, but not enough genuine feeling to follow through on making amends.\n\nTaken together, this scene systematically dismantles the idealised picture built in Unit 2, revealing the \"higher love\" between Sergius and Raina as a performance under real strain — one that both partners, in their own ways, are already quietly stepping outside of, exactly as Louka accuses.", structure:"Introduction (the scene's placement immediately after Unit 2's declarations is itself satirical) → Sergius's opening admission that the higher love is 'fatiguing' → Louka's direct accusation of mutual hypocrisy → Sergius's violent reaction and its significance → Conclusion on how this dismantles the idealised picture from Unit 2.", points:["Note the deliberate contrast/timing with Unit 2's romantic declarations","Explain Sergius's own admission that the higher love is exhausting","Explain Louka's accusation and its implication for Raina as well as Sergius","Analyse Sergius's physical reaction as revealing discomfort with an uncomfortable truth","Conclude by tying this to the play's wider theme of performance vs reality in romance"]},
    {q:'Examine how dramatic irony and near-misses are used to build tension in the scene of Bluntschli\'s return, and discuss what this reveals about the different characters\' attitudes toward the secret.', a:"The second half of this unit is structured almost entirely around a sequence of escalating near-misses, each threatening to expose the secret Raina and Catherine have kept since Act I — a technique that builds tension through repeated, controlled dramatic irony rather than a single climactic reveal.\n\nThe first near-miss comes with Catherine's own attempt at damage control: recognising immediately why Bluntschli has come (to return the coat), she tries to intercept him quietly through the garden, deliberately avoiding the library where Petkoff and Sergius are working. This shows Catherine's priority throughout the unit: containing the secret through careful management rather than confronting it directly, consistent with her established character as someone deeply concerned with appearances.\n\nThe second, larger near-miss comes when Petkoff and Sergius unexpectedly burst out of the house before Catherine can finish sending Bluntschli away, roping him into help with the regiment logistics — undoing her careful plan entirely through sheer coincidence, and placing Bluntschli directly in the path of exposure.\n\nThe most dangerous moment, however, comes from Raina herself: her involuntary exclamation, \"Oh, the chocolate cream soldier!\", is the unit's true crisis point, and Shaw builds tension around it not through dialogue but through a wordless chain of physical reactions — Bluntschli standing rigid, Sergius looking from Raina to Petkoff in confusion, Petkoff and Catherine exchanging alarmed glances. This staging choice lets the audience feel the danger of exposure through silence, arguably more effectively than any line of dialogue could.\n\nWhat follows is a display of quick, cooperative improvisation between Raina, Catherine, and Bluntschli — three characters who, crucially, all understand exactly what is at stake, working together instinctively to protect the secret, in contrast to Sergius and Petkoff, who remain entirely unaware even as the truth passes within a sentence of exposure right in front of them. The final near-miss, Nicola's arrival with Bluntschli's carpet bag on Louka's earlier (now outdated) instructions, threatens to reopen the danger just as it seems to have passed, requiring Catherine to improvise once again.\n\nTaken as a whole, this sequence reveals a clear divide in the play's characters: Raina, Catherine, and (now) Bluntschli form a small, complicit group actively managing a shared secret, while Petkoff and Sergius remain comic outsiders to the truth — and the tension of the scene comes precisely from how narrowly, and how many times, that divide almost collapses.", structure:"Introduction (a sequence of escalating near-misses, not a single climax) → Catherine's attempted quiet interception (first near-miss) → Petkoff and Sergius's unexpected interruption (second near-miss) → Raina's slip and the staged, wordless reaction (central crisis) → The cooperative cover-up between Raina, Catherine, and Bluntschli → Nicola's bag as a final near-miss → Conclusion on the divide this reveals between characters who know the secret and those who don't.", points:["Identify and explain at least three distinct near-misses in order","Discuss Shaw's use of staging/physical reaction (not just dialogue) to build tension","Analyse the cooperative, instinctive complicity between Raina, Catherine, and Bluntschli","Contrast this with Petkoff and Sergius's total unawareness","Conclude by connecting this structure to the play's wider interest in secrecy and appearances"]}
  ]

  undumbify:{
    plain:"That afternoon in the library, Bluntschli is quietly doing all the real work of the war paperwork while Sergius just signs it and Petkoff lounges around missing his old house-coat. When Petkoff bets everyone that the coat isn't in the closet, Bluntschli calmly refuses to bet against Catherine — and he's suspiciously right to be confident, since he's the one who personally returned that exact coat only a scene ago. Once the men leave to dispatch orders, Raina corners Bluntschli about the story he told a 'particular friend' — the same story Sergius mocked in Unit 2 — and admits, half-thrilled and half-furious, that she's lied twice in her life, both times to protect him. Bluntschli calmly tells her he doesn't believe a word of it when she talks like that, which stuns her into dropping the act entirely. Then she remembers the real danger: the portrait she hid in the coat pocket, inscribed 'to my chocolate crème soldier,' is still in there — and the coat is now back in the house. Before they can fix it, news arrives that Bluntschli's father has died, leaving him a chain of hotels, and he rushes off, leaving Louka and Raina to spar bitterly about soldiers and grief, and Nicola and Louka to have their sharpest fight yet about class, money, and ambition.",
    analogy:"It's like confidently betting your friend that a secret text thread definitely isn't still on someone's phone — when you're the one who actually sent the phone back yourself and just didn't check every folder.",
    example:"Bluntschli's line 'Instinct, dear young lady. Instinct, and experience of the world' is Shaw's central theme landing directly on Raina this time — up to now, Bluntschli has been the one deflating other people's romantic performances; here, he calmly does it to her, mid-performance, without even raising his voice."
    ,examDef:"'The Missing Coat' covers the first half of Act III of George Bernard Shaw's 'Arms and the Man', set in the Petkoff library, in which Bluntschli does the real work of drafting military orders while Petkoff searches for his old coat (which Bluntschli, unknown to Petkoff, personally returned in the previous unit); once alone with Raina, Bluntschli sees through her dramatic self-presentation, and the two realise that Raina's portrait — inscribed to her 'chocolate cream soldier' — is still hidden in that very coat's pocket, before news of his father's death sends Bluntschli rushing away."
  },
  explanation:{
    undumbified:"Act III opens in the library that afternoon: Petkoff reclines on the ottoman with a newspaper and hookah, Bluntschli and Sergius work at the writing table (Bluntschli genuinely writing, Sergius merely gnawing his pen), Catherine embroiders by the stove with her back to them, and Raina reclines on the divan with a neglected novel, gazing out at the Balkan landscape. Petkoff offers to help, but Bluntschli declines; Sergius drily notes the 'division of labour' — Bluntschli works out what to do and drafts the orders, while Sergius merely signs them. Petkoff, comfortable but restless, complains that he misses his old braided house-coat, insisting he already checked the blue closet and it wasn't there. Catherine is certain it must be, and Petkoff proposes a wager: a piece of jewellery against a week's housekeeping money that the coat is not there, and offers Bluntschli generous six-to-one odds to bet against him too — a sign of just how confident Petkoff is that he is right. Bluntschli calmly declines, saying it 'would be robbing' Petkoff, since 'Madame is sure to be right' — an answer that sounds like simple courtesy, but is in fact quiet certainty, since Bluntschli himself personally returned that very coat to Catherine only a short time earlier, and knows perfectly well it must be back in the house. Nicola returns with the coat exactly as Catherine predicted, leaving Petkoff astonished. Soon after, Bluntschli finishes the last of the orders; Sergius, pointedly excluded even from signing this one ('not necessary — his signature will do'), is sent off to dispatch them, and Petkoff, feeling useless, decides to go along too, taking Catherine with him since the soldiers, he says, will be 'far more frightened' of her. This finally leaves Bluntschli alone with Raina, who mischievously asks whether he got back safely that morning, then needles him about the story he must have told 'them' about her and her room. Bluntschli admits he told it, but only to 'one of them — a particular friend' whose discretion he trusts absolutely; Raina reveals that this friend told her father and Sergius the very day of the prisoner exchange (explaining how Sergius came to know and mockingly retell the story in Unit 2) — though they don't know it happened in this house, or Sergius would challenge Bluntschli to a duel. When Bluntschli reacts with amused unconcern ('Bless me! Then, don't tell him'), Raina, hurt by his flippancy, insists she lied about the ice pudding purely to save his life, and that this — along with her earlier lie to the searching officer in Act I — makes up the only two lies she has ever told in her whole life. Bluntschli, unmoved by her dramatic, 'noble' tone, calmly tells her that he finds it 'impossible to believe a single word' she says when she talks that way — a remark that stuns Raina into abandoning her performance entirely and asking, with sudden, genuine curiosity, how he saw through her. He credits 'instinct, and experience of the world', and Raina realises, half-delighted, that he is the first man who has ever taken her seriously rather than simply admiring her performance. Emboldened, she asks what he thought of the portrait she secretly slipped into the coat pocket before he escaped — only for Bluntschli to reveal, astonished, that he never found it. Raina, horrified, remembers it is inscribed 'to my chocolate crème soldier' and is now sitting, undiscovered, in the very coat that has just been returned to the house, waiting for her father to put his hand in the pocket. Before they can decide what to do, Raina, feeling that her earlier sacrifice now seems to mean nothing to him, flounces off to the window in frustration. Louka enters with a stack of letters and telegrams for Bluntschli — her sleeve now looped up with a brooch and a gilt bracelet, concealing the bruise Sergius left on her arm in Unit 3. Among the telegrams is news that Bluntschli's father has died, leaving him 'a lot of big hotels' to look after; he rushes out with the documents to prepare to leave within the hour. Louka mocks his apparent lack of grief, prompting Raina to respond bitterly that soldiers, having spent years killing people, care about nothing — a generalisation Louka pointedly undercuts by noting that Sergius, also a soldier, 'has plenty of heart left'. Raina exits haughtily, and Nicola enters with firewood, revealing that he has been paid off by both Sergius (twenty leva, 'out of pure swagger') and by Bluntschli (ten leva, for backing up 'the mistress's lies' during the earlier cover-up). He offers Louka the ten leva to simply talk to him and remind him he is human, since he grows tired of being treated as merely a servant — but Louka scornfully refuses, accusing him of selling his own dignity for money and insisting she was never born to be a servant the way he was; when he eventually opens his shop, she predicts, he will simply trade being 'somebody's servant' for being 'everybody's servant'. Nicola, unbothered, reminds her that it was he who taught her to abandon a servant's rough manners — to give up false hair and cheap cosmetics and instead be 'dainty', like a refined Russian lady — and warns her that both servants and ladies succeed the same way: by knowing their place. Louka, impatient and stifled by his 'cold-blooded wisdom', rises just as Sergius enters; he checks himself briefly on seeing her, and Nicola smoothly explains away her presence as an old habit of running up to the library above her proper station, before instructing her to tidy the table and leaving the two of them alone together.",
    sections:[
      {h:'Setting the Scene', p:"Act III opens in the Petkoff library that afternoon: Petkoff reclines comfortably on the ottoman with a newspaper and hookah, Bluntschli and Sergius sit at the writing table (Bluntschli genuinely working, Sergius merely gnawing his pen), Catherine embroiders by the stove with her back to the room, and Raina reclines on the divan with a neglected novel, gazing out at the Balkan landscape — a tableau of leisure that immediately sets up the unit's central joke about who is actually doing any work."},
      {h:'Division of Labour', p:"Petkoff offers to help with the paperwork, but Bluntschli politely declines. Sergius, with grim self-awareness, describes their actual 'division of labour': Bluntschli works out what needs doing and drafts the orders, while Sergius merely signs them — a small, honest admission that continues Sergius's growing disillusionment with his own military competence from Unit 2."},
      {h:"Petkoff's Missing Coat", p:"Restless despite his comfort, Petkoff complains that he misses his old braided house-coat, insisting he has already checked the blue closet and it isn't there. Catherine is certain it must be, since it was last hanging where he left it."},
      {h:'The Wager', p:"Petkoff proposes a bet — a piece of jewellery against a week's housekeeping money — that the coat isn't in the closet, and offers Bluntschli very generous six-to-one odds to bet against him too, a detail that (per the play's own annotation) signals just how confident Petkoff is that he is right. Bluntschli calmly declines, saying it 'would be robbing' the Major since 'Madame is sure to be right' — an answer that sounds like polite deference, but is really quiet, informed certainty: Bluntschli himself personally returned that exact coat to Catherine at the end of Unit 3, so he alone actually knows for certain where it is."},
      {h:'The Coat Reappears', p:"Nicola returns with the coat exactly as Catherine predicted, leaving Petkoff genuinely astonished — the audience, unlike Petkoff, understands precisely why Catherine's confidence was justified."},
      {h:'Orders Dispatched, Bluntschli and Raina Alone', p:"Bluntschli finishes the last of the orders; Sergius, notably excluded even from co-signing this final batch ('not necessary — his signature will do'), is sent off to dispatch them at once. Petkoff, feeling useless and unneeded, decides to follow, taking Catherine along too, since he judges the soldiers will be 'far more frightened' of her than of him — finally leaving Bluntschli and Raina alone together for the first time since Unit 1."},
      {h:'The Story Bluntschli Told', p:"Raina mischievously asks whether Bluntschli got back safely, then needles him about the story he must have told 'them' about her and her room. Bluntschli admits he told it, but only to 'one of them — a particular friend' whose discretion he trusts absolutely; Raina reveals this friend told her father and Sergius on the very day of the prisoner exchange — explaining exactly how Sergius came to know and mockingly retell the story in Unit 2 — though they don't yet know it happened in this house, or Sergius would challenge Bluntschli to a duel."},
      {h:"Raina's Two Lies", p:"Stung by Bluntschli's amused unconcern ('Bless me! Then, don't tell him'), Raina insists she lied about the ice pudding purely to save his life, and that this — together with her earlier lie to the searching officer in Act I — makes up the only two lies she has ever told in her whole life, delivered in a deliberately noble, 'thrilling' tone."},
      {h:'"I Find It Impossible to Believe a Single Word"', p:"Bluntschli, entirely unmoved by her performance, calmly replies that when she speaks in that 'noble attitude' and 'thrilling voice', he admires her but finds it 'impossible to believe a single word' she says — a line that stuns Raina into dropping the act completely and asking, with genuine curiosity rather than offence, how he saw through her. He credits 'instinct, and experience of the world', and Raina, half-delighted, realises he is the first man who has ever taken her seriously rather than simply admiring her performances."},
      {h:'The Forgotten Portrait', p:"Emboldened by this new honesty between them, Raina asks what Bluntschli thought of the portrait she secretly slipped into the coat pocket before his escape — only to learn, to her horror, that he never found it. The photograph, inscribed 'to my chocolate crème soldier', is therefore still hidden in the very coat that has just been triumphantly returned to the closet, waiting for her father to put his hand in the pocket; Bluntschli's dry summary — 'that was rash!' — captures both the humour and the real danger of the situation."},
      {h:"News of Bluntschli's Father", p:"Feeling that her earlier sacrifice now seems to mean nothing to him, Raina flounces to the window in frustration just as Louka enters with letters and telegrams — her sleeve now looped up with a brooch and gilt bracelet, concealing the bruise from Sergius's grip in Unit 3. Among the telegrams is news that Bluntschli's father has died, leaving behind 'a lot of big hotels' to look after; Bluntschli rushes out at once to prepare to leave within the hour, cutting off any chance to resolve the portrait problem in this unit."},
      {h:'Louka and Raina on Grief and Soldiers', p:"Louka mocks Bluntschli's apparent lack of visible grief despite his fondness for the Servians, prompting Raina to respond bitterly that soldiers, having spent years killing people, care about nothing — a broad, defensive generalisation that Louka pointedly undercuts by observing that Sergius, also a soldier, 'has plenty of heart left'. Raina exits haughtily rather than engage further."},
      {h:"Nicola's Money and Louka's Refusal", p:"Nicola reveals he has been paid off by both Sergius (twenty leva, 'out of pure swagger') and Bluntschli (ten leva, for backing up 'the mistress's lies' during Unit 3's cover-up), and offers Louka the ten leva simply to talk to him and remind him he's human — he grows tired, he admits, of being treated as merely a servant. Louka scornfully refuses, accusing him of selling his own dignity for money, insisting she was never born to be a servant as he was, and predicting that when he opens his shop, he will simply trade being 'somebody's servant' for being 'everybody's servant'."},
      {h:"Nicola's Lecture on Knowing One's Place", p:"Unbothered by her scorn, Nicola reminds Louka that it was he who taught her to abandon rougher servant habits — false hair, cheap cosmetics — for a more refined, 'dainty' manner modelled on a 'fine Russian lady' (echoing the play's recurring hierarchy in which Russian and Viennese sophistication is prized above Bulgarian rural custom), and warns her that both servants and ladies succeed the same way: by knowing their place. Louka, impatient and stifled by his 'cold-blooded wisdom', rises just as Sergius enters; he checks himself briefly on seeing her, and Nicola smoothly explains her presence away as an old habit above her station, before instructing her to tidy the table and leaving the room, deliberately allowing Sergius and Louka to be alone together."}
    ],

  longAnswers:[
    {q:'Discuss how Shaw uses dramatic irony in the wager over Petkoff\'s coat to develop humour and characterize Bluntschli.', a:"Shaw builds the coat-wager scene almost entirely on a single piece of dramatic irony: the audience, unlike Petkoff, already knows exactly why Bluntschli is so calmly confident that the coat will be found — because Bluntschli himself personally returned it to Catherine at the very end of the previous unit.\n\nWhen Petkoff excitedly offers Bluntschli generous six-to-one odds to bet against him, Bluntschli's refusal — 'it would be robbing you, Major. Madame is sure to be right' — reads, to Petkoff and to any first-time audience member who has forgotten the earlier scene, as simple modesty or deference towards Catherine's judgement. To an attentive audience, however, the line carries a completely different meaning: Bluntschli isn't being polite at all, he is stating something he knows to be certain, phrased just carefully enough not to give away the secret he and the Petkoff women are still protecting.\n\nThis technique does real work for Bluntschli's characterisation. Rather than needing a speech to establish his intelligence or his self-control, Shaw lets a single understated line, delivered 'imperturbably,' demonstrate both at once: Bluntschli consistently knows more than the other characters, and consistently chooses restraint over showing off that knowledge. This is entirely consistent with his behaviour throughout the play — quietly competent (as seen in the earlier orders scene, where he does the real military work while Sergius merely signs), and quietly amused by situations others find urgent or dramatic (as seen again moments later, when he reacts to the news about the hidden portrait with a mild 'that was rash!' rather than alarm).\n\nThe comic payoff — Nicola returning with the coat exactly as predicted, leaving Petkoff 'stunned' — lands with extra force precisely because the audience has been let in on the joke the whole time, while Petkoff remains genuinely baffled by his own memory. In this way, Shaw uses dramatic irony not just for a single laugh, but as an ongoing tool for building Bluntschli's character as the one figure in the play who consistently sees the full picture while everyone around him only sees part of it.", structure:"Introduction (the wager scene is built on a single, sustained piece of dramatic irony) → What the audience knows that Petkoff doesn't, and why → How Bluntschli's careful, restrained phrasing reflects his character → Connection to his broader characterisation elsewhere in the unit → Conclusion on how this technique serves both comedy and characterisation simultaneously.", points:["Explain clearly what the audience knows that Petkoff does not","Analyse Bluntschli's specific wording and what it reveals despite sounding like simple politeness","Connect this moment to Bluntschli's broader characterisation (the orders scene, the portrait reveal)","Conclude on how dramatic irony serves both comic and characterising purposes here"]},
    {q:'Examine how Raina\'s confrontation with Bluntschli in this unit continues to develop the play\'s theme of performance versus reality, with reference to at least two specific moments.', a:"This unit brings the play's ongoing theme of performance versus reality to a head, as Bluntschli becomes the first character to directly, calmly name Raina's habit of theatrical self-presentation — and, remarkably, the first to do so without provoking her anger.\n\nThe clearest example comes when Raina insists, in an elevated, deliberately 'noble' tone, that she has told only two lies in her entire life, both in order to protect him. Rather than accepting this at face value, or reacting with shock as the Act I fugitive might have, Bluntschli responds with calm, almost clinical honesty: 'When you get into that noble attitude and speak in that thrilling voice, I admire you; but I find it impossible to believe a single word you say.' This is a direct escalation of a pattern the play has built since Unit 1 — Raina's private doubts about performed heroism, Louka's accusation in Unit 3 that 'gentlefolk are all alike,' and Raina's own admission that she longs to shock Sergius's sense of propriety — but this time, the observation is made to Raina's face, by someone she cannot simply dismiss or overpower with performance.\n\nCrucially, Raina's reaction marks a turning point rather than a repetition of earlier patterns. Instead of anger or wounded pride, she responds with genuine curiosity — 'How did you find me out?' — and, remarkably, 'a complete change of manner from the heroic to the familiar.' This shift suggests that what Raina actually wants, beneath her performances, is to be truly seen rather than simply admired, something neither her family nor Sergius has offered her up to this point.\n\nThe second key moment — the revelation about the forgotten portrait — extends this theme from words into action. Raina's earlier, dramatic gesture of hiding a photograph inscribed 'to my chocolate crème soldier' was itself a piece of performance: a secret, romantic act intended to be discovered and cherished. Its resurfacing now, as a real and immediate practical danger rather than a romantic keepsake, shows the cost of performed gestures colliding with real consequences — an object created for drama now threatens actual exposure.\n\nTaken together, these two moments show the play moving Raina from being merely an observer or victim of others' performances (Sergius's idealism, her own family's concern with appearances) to becoming, for the first time, a character actively confronted with — and beginning to reckon with — her own contribution to the very pattern the play has been satirising all along.", structure:"Introduction (this unit brings the performance-vs-reality theme directly to Raina herself) → Bluntschli's direct confrontation about her 'noble attitude' and its significance → Raina's unusual reaction (curiosity, not anger) and what it reveals → The portrait reveal as performance colliding with real consequence → Conclusion on how this develops Raina's arc within the play's wider theme.", points:["Discuss the 'noble attitude' exchange and quote Bluntschli's key line","Explain why Raina's reaction (curiosity rather than anger) is significant and different from her past reactions","Discuss the portrait reveal as a second, connected example of performance meeting real consequence","Conclude by linking both moments to the play's wider theme, tracing Raina's development across units"]}
  ]

  undumbify:{
    plain:"Everything comes to a head at once. Louka needles Sergius until he swears that if he ever touches her again, she becomes his fiancée — then immediately challenges Bluntschli to a duel over Raina, only for Bluntschli to calmly agree while making it clear he has no intention of actually hurting anyone. Raina, stung that Bluntschli seems totally unbothered about never seeing her again, accidentally reveals how much she cares; Sergius, meanwhile, gets caught out for secretly courting Louka. While everyone's arguing, Raina secretly swipes the incriminating portrait out of Petkoff's coat pocket — but not fast enough: Petkoff had already spotted it, and the whole secret comes out anyway, with Bluntschli finally admitting, in front of everyone, that he was the fugitive. Sergius, freed from his engagement to Raina, ends up bound by his own earlier oath to marry Louka instead. Bluntschli, dismissed by Raina as just a soldier she saved out of pity, proves his devotion isn't so unequal after all by casually listing an almost absurd fortune — and once Raina drops her performance and admits the truth, he proposes on the spot, then briskly leaves to get back to work.",
    analogy:"It's like a season finale where every subplot collides in one afternoon: the secret admirer challenges the fiancé to a duel and shrugs it off, the cheating gets exposed at the worst possible moment, the 'wrong' couple ends up together because of a promise made in anger, and the guy everyone dismissed as 'just the help' turns out to have more money than anyone in the room — then calmly checks his watch and leaves for his next appointment.",
    example:"When Bluntschli lists his 200 horses, 70 carriages, and 4,000 tablecloths in the same flat, businesslike tone he's used for troop logistics all play, Shaw is making his final point: real substance (competence, honesty, even real wealth) has been hiding in plain sight the whole time, while the 'grand,' theatrical romance everyone was chasing turns out to be worth far less."
    ,examDef:"'Love Triumphs' completes George Bernard Shaw's 'Arms and the Man', in which Sergius, provoked by Louka, swears an oath that later binds him to marry her instead of Raina; Bluntschli is exposed to Petkoff and Sergius as the fugitive 'chocolate cream soldier' from Act I when Raina's hidden portrait is discovered; and Bluntschli, after being dismissed as a practical, unromantic match for Raina, wins both her and her family's approval by revealing his considerable wealth, before proposing and departing on business — resolving the play's romantic and satirical threads together."

  explanation:{
    undumbified:"Picking up directly from the end of the previous unit, Sergius studies the bruise his grip left on Louka's arm and asks if it hurts, though he insists he is 'never sorry'. Louka needles him further, questioning whether he is truly brave, and contrasts her own powerlessness as a servant with what she would do if she were 'the empress of Russia': marry the man she loved, regardless of rank, and dares Sergius to do the same rather than marry 'a rich man's daughter' out of fear of gossip. Sergius insists he already loves another woman (Raina) and accuses Louka of jealousy; Louka retorts that she has no reason to be jealous, since 'the man I told you of' — the fugitive from Act I — has returned, and Raina will marry him instead. Enraged, Sergius declares he will kill 'the Swiss'; Louka calmly warns that the Swiss might kill him instead, having already 'beaten him in love' and possibly able to 'beat him in war' too. Despairing at being mocked on all sides, Sergius makes Louka a serious promise before she can leave: if his hands ever touch her again, they will touch his 'affianced bride' — a binding oath Louka warns him she intends to hold him to. Bluntschli enters as Louka exits, and Sergius immediately challenges him to a duel at six o'clock, alone, with sabres, believing Bluntschli has been courting Raina. Bluntschli, sitting quite at ease, calmly accepts but insists on fighting on foot rather than horseback, saying he doesn't want to kill Sergius if he can help it, and mentions he has often worked as a sword instructor — implying the 'duel' poses little real danger. When Raina asks why they are fighting, Bluntschli casually predicts that once he leaves for home the next morning and is out of the picture for good, Raina and Sergius will simply reconcile and live happily ever after. Raina, hurt by how easily he imagines leaving, snaps that she never said she wanted to see him again — a reaction Sergius immediately seizes on as proof that she loves Bluntschli. Raina collapses onto the ottoman and, flustered, asks Bluntschli directly whether he is married, accusing him of being the source of 'this horrible story' about her being spread around; Bluntschli replies simply, 'No, he's dead' — referring to Stolz, the friend he had confided in, who has since died. Sergius confirms Stolz was not his own informant either, prompting Raina to suddenly realise the truth: it was Louka, who had been alone with her that morning and clearly knows about Sergius's feelings. Sergius, caught out, admits grimly that Raina saw him with Louka; declaring their romance 'shattered' and 'life's a farce,' he sinks into cynicism. Bluntschli persuades them not to quarrel, and Raina, unable to keep up her wounded dignity, gives in to her sense of humour, joking that Bluntschli must think them 'a couple of grown-up babies' — which Sergius, grinning, half-agrees with, describing it as 'Swiss civilisation nurse-tending Bulgarian barbarism.' When Bluntschli suggests bringing Louka in to talk things over 'in a friendly way,' Raina guesses she's listening at the door; Sergius, determined to prove this a slander, opens the door and drags in Louka, who stands her ground proudly and silently. Bluntschli refuses to judge her for eavesdropping, admitting he once listened outside a tent during a brewing mutiny when his own life was at stake; Louka, unashamed, replies that her love was at stake. At this moment, Petkoff enters wearing only a shirt, complaining that someone with bigger shoulders than his has been wearing — and bursting the back of — his coat, which Catherine is now mending. Everyone hastily denies that anything is wrong. When Nicola brings the mended coat in, Raina quickly takes it herself, helps her father put it on, and — while his back is turned — dexterously slips the hidden photograph out of the pocket and throws it onto the table, where Bluntschli covers it with a sheet of paper just in time, all unnoticed by Petkoff. Once dressed, however, Petkoff recalls having noticed something odd in that very pocket earlier, reaches for it again, finds it empty, and — assuming Catherine must have removed it while mending — asks where it's gone; a flash of memory reveals the truth to him, and he accuses Catherine of taking it. Confronted, he reveals he already knows exactly what the photograph was: Raina's portrait, inscribed 'to her Chocolate Cream Soldier — a souvenir.' Assuming his future son-in-law is the one being described, Petkoff jokingly accuses Sergius, who indignantly denies it — at which point Bluntschli calmly steps forward and admits that he himself is the chocolate cream soldier, explaining that Raina saved his life with chocolates while he was a starving fugitive, and that his late friend Stolz had told Petkoff and Sergius this very story (without names) back at the Peerot prisoner exchange. Petkoff, astonished, turns pointedly to Raina; she bitterly explains that she wrote the inscription believing (mistakenly, she claims) that Bluntschli was married — a claim Bluntschli firmly denies, insisting he has never been married in his life, though the confusion over where this idea came from is never fully cleared up. Exasperated by the tangle of hints and accusations, Petkoff demands to know plainly which man Raina is actually engaged to; she answers 'neither' — announcing instead that Louka is now 'the object of Major Saranoff's affections.' This shocks Petkoff, who points out that Louka is supposedly engaged to Nicola — until Nicola himself steps in to clarify that this engagement was never real: it was simply a cover story to give Louka, whom he calls a woman with 'a soul above her station,' social protection, while he served only as her 'confidential servant.' Louka, furious at having been insulted by everyone present, demands an apology from Sergius, who set the example for how she'd been treated; he obliges dramatically, kneeling to beg forgiveness, and when Louka forgives him and offers her hand to be kissed, she reminds him that this touch, by his own earlier oath, now makes her his 'affianced wife' — a promise Sergius, momentarily forgetting, now finds himself bound to keep. Catherine, entering to find Sergius embracing Louka, is scandalised, and though she protests that Sergius is bound by his word to marry Raina instead, Sergius insists that 'nothing binds' him beyond his more recent oath to Louka. Bluntschli, delighted, congratulates Sergius, remarking that his romantic 'heroics' have turned out to have a 'practical side after all,' and — to Raina's visible disgust — kisses Louka's hand as, in his own words, 'a good Republican.' Catherine, still suspicious, accuses Louka of 'telling stories'; Louka defends herself, admitting only that she told Sergius Raina would never marry him if 'the Swiss gentleman' returned — a claim Bluntschli finds surprising, and one Louka reinforces by turning directly to Raina and suggesting she was always fonder of Bluntschli than of Sergius. Bluntschli immediately, almost too insistently, denies any such thing, launching into a long, self-deprecating comparison between himself — a 'common-place Swiss soldier' of thirty-four, worn down by fifteen years of barracks and battles — and Raina, a rich, imaginative seventeen-year-old (as he assumes) whose fairy-tale ideas of 'fairy princes' and 'cavalry charges' made their whole adventure feel, to her, like nothing more than a schoolgirl's game of 'chocolate creams and hide and seek.' As proof, he produces the photograph and its 'souvenir' inscription — the very thing Petkoff had just been searching for. Raina, deeply stung by being dismissed this way, corrects him sharply: she is not seventeen, but twenty-three, and — to prove she is no longer playing games — snatches the photograph from his hand, tears it up, and throws the pieces at his feet. Startled and visibly reconsidering, Bluntschli repeats 'Twenty-three!!' to himself, then — in the same brisk, decisive manner he uses for military logistics — formally proposes to become Raina's suitor in Sergius's place, provoking an outraged 'You dare!' from Raina. When Petkoff objects that Raina is used to a very comfortable lifestyle (noting that Sergius alone keeps twenty horses), Bluntschli responds by seizing the papers from his own blue-enveloped file and rattling off, in exhaustive, almost comic detail, his own considerably greater fortune: two hundred horses, seventy carriages, four thousand tablecloths, over nine thousand pairs of sheets and blankets, ten thousand each of knives, forks, and dessert spoons, six hundred servants, six palatial establishments (plus two livery stables, a tea garden, and a private house), four medals for distinguished service, officer's rank, a gentleman's standing, and fluency in three native languages — leaving Petkoff to ask, with 'childish awe,' whether Bluntschli is 'Emperor of Switzerland.' Bluntschli clarifies that his true rank is even higher: he is a free citizen of a republic, with no king or aristocrat above him. Won over by this display of wealth and status, Catherine promptly declares she will not stand in the way of her daughter's happiness, presuming (before he can speak for himself) that this is Petkoff's feeling too. Raina, still performing indignation, pretends to sulk, insisting she is 'not here to be sold to the highest bidder' and that Bluntschli can keep his 'tablecloths and omnibuses'; Bluntschli refuses to accept this answer, reminding her that she already gave him her hand to kiss and her roof to shelter him — not, he points out, as gifts to 'the Emperor of Switzerland,' but to someone else entirely. Catching her hand, he asks her, plainly, who she really gave them to; with a shy smile, Raina finally answers honestly: 'To my chocolate cream soldier!' Delighted, Bluntschli accepts this as answer enough — then, almost immediately, checks his watch and snaps back into brisk military efficiency, praising Petkoff's handling of the regiments, giving Sergius fresh logistical instructions, and instructing Sergius not to marry Louka until he himself returns in a fortnight. With a final military bow to the ladies, he departs, leaving Sergius to exclaim, in open admiration, 'What a man! What a man!' — closing the play.",
    sections:[
      {h:"Louka Questions Sergius's Courage", p:"Continuing directly from the previous scene, Sergius examines the mark left on Louka's arm, but insists he is 'never sorry.' Louka challenges whether he is truly brave, contrasting her own lack of freedom as a servant with what she would do 'if I were the empress of Russia' — marry the man she loved, regardless of rank — and dares Sergius to show the same courage rather than marrying 'a rich man's daughter' purely out of fear of gossip."},
      {h:'"I Will Kill the Swiss!"', p:"Sergius insists he loves Raina and accuses Louka of jealousy; Louka calmly replies she has no reason to be jealous, since 'the man I told you of' — the Act I fugitive — has returned, and Raina will marry him instead. Enraged, Sergius vows to kill 'the Swiss'; Louka warns, unbothered, that the Swiss might kill him first, having already 'beaten him in love' and perhaps able to 'beat him in war' too."},
      {h:"Sergius's Binding Oath", p:"Despairing at being mocked from every side, Sergius makes Louka a serious promise as she turns to leave: if his hands ever touch her again, they shall touch his 'affianced bride.' Louka warns him she intends to hold him to this — a promise that becomes crucial later in the unit."},
      {h:'The Duel Is Set', p:"Bluntschli enters as Louka exits, and Sergius immediately challenges him to a duel at six o'clock, alone, on the drilling-ground, with sabres, believing Bluntschli has been courting Raina."},
      {h:"Bluntschli's Unbothered Response", p:"Bluntschli, sitting quite at ease, calmly accepts the challenge but insists on fighting on foot rather than horseback, explaining he doesn't want to risk killing Sergius, and mentioning he has often worked as a sword instructor — quietly implying the 'duel' is far less dangerous than Sergius intends. He casually predicts that once he leaves for home the next morning, Raina and Sergius will simply reconcile and 'live happily ever after.'"},
      {h:"Raina's Slip and Sergius's Accusation", p:"Hurt by how easily Bluntschli imagines leaving her behind, Raina snaps that she never said she wanted to see him again — a reaction Sergius immediately seizes on as proof that she is in love with Bluntschli, provoking her scandalised denial."},
      {h:'Who Really Told the Story?', p:"Raina, flustered, accuses Bluntschli of spreading 'this horrible story' about her; he replies simply that his informant is dead — referring to his late friend Stolz. Sergius confirms Stolz was not his own source either, and Raina suddenly realises the truth: it must have been Louka, who was alone with her all that morning and clearly knows about Sergius's feelings."},
      {h:'"Life\'s a Farce" and a Truce', p:"Caught out, Sergius grimly admits Raina saw him with Louka, and declares their romance 'shattered' and 'life a farce.' Bluntschli persuades them not to quarrel, and Raina — unable to sustain her wounded dignity — gives in to her sense of humour, joking that Bluntschli must think them 'a couple of grown-up babies'; Sergius half-agrees, describing it wryly as 'Swiss civilisation nurse-tending Bulgarian barbarism.'"},

      {h:'Bluntschli Revealed as the Chocolate Cream Soldier', p:"Once dressed, Petkoff recalls noticing something in the pocket earlier, finds it now empty, and — realising Catherine must have taken it while mending — demands to know where it's gone. He reveals he already knows what it was: Raina's portrait, inscribed 'to her Chocolate Cream Soldier — a souvenir.' Assuming Sergius is meant, Petkoff jokingly accuses him; Sergius indignantly denies it, and Bluntschli calmly steps forward to admit he himself is the chocolate cream soldier, explaining how Raina saved his life with chocolates, and that his late friend Stolz had told this very story (without names) at the Peerot prisoner exchange."},
      {h:'Untangling the Engagements', p:"Astonished, Petkoff turns to Raina, who bitterly explains she wrote the inscription believing Bluntschli was married — a claim he firmly denies, though the source of her belief is never fully explained. Exasperated, Petkoff demands to know which man Raina is actually engaged to; she answers 'neither,' revealing instead that Louka is now the 'object of Major Saranoff's affections.' Nicola then reveals that his engagement to Louka was never real — only a cover story to give her, a woman with 'a soul above her station,' social protection, while he served merely as her 'confidential servant.'"},
      {h:"Sergius and Louka's Engagement, Louka's Confession", p:"Louka, furious at having been insulted by everyone present, demands an apology from Sergius, who set the example; he kneels dramatically and asks forgiveness, and when Louka gives him her hand to kiss, she reminds him this touch — by his own earlier oath — now makes her his 'affianced wife.' Catherine, scandalised, protests that Sergius is bound to Raina by his word, but Sergius insists 'nothing binds' him beyond this newer promise. Bluntschli congratulates him and, to Raina's visible disgust, kisses Louka's hand as 'a good Republican.' Under questioning from Catherine, Louka admits only to telling Sergius that Raina would never marry him if 'the Swiss gentleman' returned, and suggests to Raina that she was always fonder of Bluntschli than of Sergius."},
      {h:"Raina's True Age and the Torn Photograph", p:"Bluntschli, almost too quickly, denies any real feeling from Raina, launching into a self-deprecating comparison between himself — a 'common-place' thirty-four-year-old soldier — and Raina, whom he assumes to be a romantic seventeen-year-old for whom their whole adventure was just a 'schoolgirl's game.' He offers the photograph's inscription as proof. Stung, Raina corrects him: she is twenty-three, not seventeen, and — to prove her seriousness — tears the photograph up and throws the pieces at his feet."},
      {h:"The 'Establishment' Contest and Bluntschli's Proposal", p:"Reconsidering, Bluntschli formally proposes to become Raina's suitor in Sergius's place. When Petkoff objects that Raina is used to comfort (noting Sergius keeps twenty horses), Bluntschli rattles off his own vastly greater fortune — two hundred horses, seventy carriages, four thousand tablecloths, thousands of pieces of linen and cutlery, six hundred servants, six palatial establishments, four medals, and fluency in three languages — leaving Petkoff to ask in 'childish awe' whether he is 'Emperor of Switzerland.' Bluntschli clarifies he holds an even higher status: a free citizen of a republic. Won over, Catherine gives her blessing (presuming Petkoff agrees); Raina, still performing reluctance, insists she won't be 'sold to the highest bidder' — until Bluntschli, catching her hand, asks plainly who she really gave her hand and hospitality to. With a shy smile, she finally answers honestly: 'To my chocolate cream soldier!' Satisfied, Bluntschli instantly snaps back into brisk military efficiency, gives Sergius fresh instructions, tells him not to marry Louka until he returns, bows to the ladies, and departs — leaving Sergius to exclaim admiringly, 'What a man! What a man!'"}
