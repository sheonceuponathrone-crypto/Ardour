    {q:'To what extent do you think the title of the story and its plot are connected?', a:'The title "Dusk" is closely tied to both the setting and the central theme of the story. Literally, the entire plot unfolds during the half-light of dusk near Hyde Park Corner, a time the narrator explicitly calls "the hour of the defeated" — when people who have "fought and lost" can move about without being clearly recognised.\n\nThis half-light is not just atmospheric; it is thematically essential. Dusk represents a state of uncertainty and blurred vision, mirroring how Gortsby, throughout the story, can never quite clearly "see" the truth about the people he judges — whether the old man\'s real circumstances, or whether the young man\'s story (and the soap "evidence") is genuinely true. Just as figures are "scarcely to be distinguished" in the fading light, the truth about people\'s characters proves impossible for Gortsby to distinguish with any real certainty.\n\nThe ending reinforces this connection: Gortsby\'s confident judgement, made in this same half-light of both literal dusk and figurative uncertainty, turns out to be based on a complete coincidence. The title, therefore, is not just a setting but a metaphor for the story\'s central idea — that judging people and situations in "half-light," with incomplete information, is unreliable and can lead to being badly mistaken.', structure:'Introduction (title connects to both setting and theme) → Evidence: dusk as "the hour of the defeated," literal setting → Evidence: dusk as a metaphor for uncertain/blurred judgement → Evidence: the twist ending reinforces this metaphor → Conclusion on the title\'s deeper significance.', points:['Explain the literal setting connection (time of day, location)','Explain "hour of the defeated" and its thematic significance','Connect the half-light/blurred vision to Gortsby\'s flawed judgement','Tie the twist ending back to the title\'s metaphorical meaning']},
    {q:'Which character do you sympathise more with — Gortsby or the young man — and why?', a:'I sympathise slightly more with Gortsby, though both characters have understandable, flawed motivations.\n\nGortsby is not a cruel or dishonest man — he is simply cautious, and his caution is initially well-founded: he correctly identifies the weak point in the young man\'s story (the missing soap) using reasonable logic, not malice. When he believes he has found proof he was wrong, he acts with real generosity and humility, chasing the young man down, apologising sincerely, and giving both money and the soap without expecting anything in return. His only real fault is being slightly too confident that circumstantial evidence (a stray cake of soap) settles the matter completely, and this overconfidence, rather than any bad intention, is what the story gently mocks.\n\nThe young man, meanwhile, is more ambiguous. His story remains genuinely uncertain by the end — we never learn if he was truly lying — but his very convenient collapse under scrutiny, and his eagerness to accept money that likely wasn\'t rightfully "proven" to be his either, makes him harder to fully sympathise with. If his story was fabricated, then he knowingly benefited from an innocent old man\'s lost soap.\n\nUltimately, Gortsby\'s honest mistake, made in good faith and corrected with genuine kindness, feels more sympathetic than a young man whose true honesty is left permanently unresolved.', structure:'Introduction (state position: slightly more sympathy for Gortsby) → Evidence: Gortsby\'s reasonable initial caution and later generosity → Evidence: his only flaw is overconfidence in circumstantial "proof" → Evidence: the young man\'s honesty remains genuinely ambiguous/uncertain → Evidence: the young man arguably benefits either way, deserved or not → Conclusion restating the position.', points:['State a clear position (either character is acceptable)','Use Gortsby\'s reasonable caution and later generosity as evidence','Note that the young man\'s honesty is deliberately left unresolved by the story','Conclude by weighing which flaw is more sympathetic (mistake vs. possible deceit)']}

  id:'rani-gaidinliu', title:'Rani Gaidinliu', author:'—', type:'prose', status:'complete',
  undumbify:{
    plain:"A 13-year-old girl from a Naga village in Manipur joined a movement to protect her tribe's culture from British interference. When her older cousin (the movement's leader) was executed by the British, she took over the whole rebellion herself — at just 16. She fought, hid, and inspired her people for years before finally being captured, imprisoned for around 15 years, and eventually honoured with the title 'Rani' (Queen) by Jawaharlal Nehru.",
    analogy:"Picture a school where the head prefect gets expelled for standing up to an unfair rule — and instead of the movement dying, a first-year student steps up, keeps the whole thing going, and ends up more famous than the prefect ever was. That's basically what a teenage Gaidinliu did, except the 'unfair rule' was colonial rule and the stakes were her life.",

    ,examDef:"Rani Gaidinliu (1915–1993) was a Naga spiritual and political leader from Manipur who, from the age of 13, was part of the Heraka movement founded by her cousin Haipou Jadonang, and who led armed resistance against British colonial rule in North-East India after Jadonang's execution in 1931. She was imprisoned by the British, given the title 'Rani' by Jawaharlal Nehru, and later honoured with the Tamra Patra and the Padma Bhushan for her contribution to India's freedom struggle."},
  explanation:{
    undumbified:"The chapter tells the true story of Rani Gaidinliu, born in 1915 in a Naga village in Manipur, who joined a religious-and-cultural movement called Heraka at just 13 to help her people resist British interference in their traditions. When the movement's founder, her cousin Haipou Jadonang, was executed by the British, 16-year-old Gaidinliu took over — leading a rebellion, refusing to pay taxes, evading capture for years, and eventually being caught and imprisoned. Nehru met her in jail, promised to help free her, and gave her the title 'Rani'. After Independence, she continued working as a social reformer and was honoured with major national awards before her death in 1993.",
    sections:[
      {h:'Setting the scene: nature and identity in North-East India', p:"The chapter opens by explaining that in North-East India, an all-pervading respect for nature shaped the region's tribal cultures, and that this natural environment was not just a source of sustenance but the very crux (core) of their religion. It was to protect these cultural beliefs — challenged under British colonial rule — that Rani Gaidinliu dedicated her life."},
      {h:'Early life', p:"Gaidinliu was born on 26th January 1915 in the verdant village of Nungkao, in present-day Tamenglong district, Manipur. She was the fifth of eight children, born into the Rongmei Naga tribe, one of the Zeliangrong group of tribes (a cognate of communities like the Liangmai, Zeme, Inpui and Rongmei, spread across Manipur, Nagaland and Assam). Her family held a superior, administratively active position in their village, though she received no formal education, since there were no schools in her area."},
      {h:'The Heraka movement', p:"The tribal culture of North-East India involved worship of multiple gods and goddesses tied to nature. British rulers, who considered their own religion and customs superior, forcefully tried to convert people to Christianity — a major threat to the region's culture. Gaidinliu's cousin, Haipou Jadonang, responded by encouraging the worship of one Supreme Being (a form of monotheism) to unite the Zeliangrong tribes against this manipulation and reduce hostility between them. Gaidinliu joined this Heraka movement ('heraka' meaning 'pure' in Zemei) at just 13, abolishing violent rituals like animal sacrifice alongside Jadonang, and motivating people through passionate speeches."},
      {h:'From religious to political movement', p:"Jadonang built a temple, Kao Kai, for Heraka worshippers, and the movement is believed to have taken shape after he and Gaidinliu rediscovered the ancient Bhubon Caves. What began as a religious reform movement gradually turned into a political rebellion against British rule."},
      {h:'Taking over the movement', p:"Haipou Jadonang was captured and hanged by British officials for protesting and conspiring against British rule. From that point, Gaidinliu — only 16 — took over the movement, assisted by guerrilla forces trained to take up arms, motivating them through bold speeches and self-composed inspirational songs. This happened against the backdrop of national unrest in the 1920s, following events like the 1919 Jallianwala Bagh massacre and Gandhi's 1920 Non-Cooperation Movement."},
      {h:'Open rebellion (1931–1932)', p:"In 1931, Gaidinliu launched her own non-cooperation movement in the hills, declaring open rebellion and inspiring people to stop paying taxes to the British — tax money was redirected to fund her movement instead. Within the Heraka faith, she came to be worshipped as an incarnation of the Goddess Cherachamdinliu (daughter of the God Bhubon). The British issued an arrest warrant for her; she evaded capture across villages in present-day Assam, Manipur and Nagaland, protected by her people, while the British offered a monetary reward for her capture."},
      {h:'Capture and imprisonment', p:"In 1932, Gaidinliu began building a wooden fortress with her followers in Pulomi village. She was betrayed by community members who were tempted by the reward money and unwilling to risk British brutality. The Assam Rifles, led by Captain MacDonald, launched a surprise attack on the unfinished fortress and arrested her on 17th October 1932. She was sentenced to life imprisonment."},
      {h:'Nehru and the title \"Rani\"', p:"Jawaharlal Nehru met Gaidinliu in 1937 at Shillong jail and promised to pursue her release. He also bestowed on her the title 'Rani' (queen), and since then she has been popularly known as Rani Gaidinliu or Rani Maa."},

  longAnswers:[
    {q:'Rani Gaidinliu was betrayed by members of her own village who had converted to Christianity, for whom peace and stability were more important than resisting British brutality. Considering their point of view, would you agree that Gaidinliu was a national hero?', a:'Yes, Gaidinliu can still be considered a national hero, even while acknowledging why some villagers chose differently.\n\nThe villagers who betrayed her were not necessarily acting out of malice — the chapter explains they were "unwilling to risk British brutality" and, in some cases, tempted by reward money. Their choice reflects a very human desire for safety and survival under an oppressive colonial system that punished resistance harshly. This does not make them villains; it shows how colonial rule forced impossible choices onto ordinary people.\n\nHowever, this does not diminish Gaidinliu\'s own heroism. From the age of 13, she committed herself to protecting her people\'s culture and identity, and by 16 she had taken on enormous personal risk — evading capture, building resistance networks, and openly defying colonial authority — despite knowing the potential cost. Unlike the villagers who prioritised their own safety, Gaidinliu accepted danger, years of imprisonment, and the constant risk of betrayal in pursuit of a cause bigger than her own comfort.\n\nA "national hero" is not someone whose choices were easy or without personal cost to others — it is someone who sacrifices personal safety for a collective cause. By that standard, Gaidinliu\'s willingness to keep resisting even after betrayal, imprisonment, and the execution of her mentor firmly supports the view that she deserves to be remembered as a national hero, while the villagers\' choice can be understood, without needing to be condemned, as a product of the same unjust system Gaidinliu was fighting against.', structure:'Introduction (state your position clearly) → Acknowledge and explain the villagers\' perspective fairly → Explain what makes Gaidinliu\'s actions heroic in contrast → Conclusion restating your stance with reasoning.', points:['Take a clear position (agree/disagree) and justify it','Fairly represent the villagers\' perspective, not just dismiss it','Use specific details (age, risks taken, consequences) as evidence for Gaidinliu\'s heroism','Conclude by directly answering the question asked']},
    {q:'"History mostly gives us the impression that the most powerful chapters of freedom and progress were written by kings and male leaders who led wars and revolutions." Do you agree or disagree with this statement? Give reasons to justify your stance.', a:'I agree that history, as it is commonly taught and remembered, has largely centred on male leaders — but Rani Gaidinliu\'s story itself is strong evidence of why this needs to change.\n\nFirstly, the chapter\'s own framing supports this view: it explicitly states that "the impact of women seems to be granted little space in the remembrance of history," despite women\'s contributions being "immense." Gaidinliu\'s achievements — leading a rebellion at 16, evading capture for years, and inspiring an entire movement — are historically comparable to many celebrated male freedom fighters, yet she remains far less widely known than figures like Bhagat Singh or Subhas Chandra Bose.\n\nSecondly, this imbalance is not because women\'s contributions were smaller, but because historical records, textbooks, and popular retellings have traditionally focused on formal political and military positions, which were themselves dominated by men due to social structures of the time. Gaidinliu did not hold a formal military rank, yet she led guerrilla forces and inspired mass non-cooperation — actions just as significant as any formally recognised "revolution."\n\nHowever, I would add a note of progress: the very existence of this chapter, along with the postal stamp, commemorative coin, and planned memorial hall dedicated to Gaidinliu, shows that this imbalance is now being actively corrected. Recognising figures like Gaidinliu is not just about celebrating one individual, but about restoring a more complete and honest picture of how independence was actually won — through the combined efforts of countless leaders, many of them women, whose stories deserve equal space in how we remember history.', structure:'Introduction (state your position) → Reason 1: textbook\'s own framing supports the imbalance → Reason 2: explain why the imbalance exists (structural, not because contributions were smaller) → Reason 3: acknowledge positive change/progress → Conclusion.', points:['Clearly agree/disagree with justification','Use Gaidinliu\'s own story as supporting evidence','Explain why the imbalance exists, not just that it exists','Acknowledge any counter-evidence or progress for a balanced answer']}

      {h:'Part I — The barber\'s discovery', p:"On the morning of 25th March in St Petersburg, barber Ivan Jakovlevitch slices open his breakfast loaf and finds a nose inside — one he recognises as belonging to Kovaloff, a Municipal Committee member he regularly shaves. His formidable wife is furious and accuses him of cutting it off, threatening to call the police. Already known for being scruffy and having smelly hands, Ivan panics about being blamed for the theft and tries to dispose of the nose — first attempting to drop it unnoticed on the street (a policeman makes him pick it back up), then throwing it off Isaac Bridge into the River Neva."},

        {type:'Literary Analysis', q:'How does this line use irony to satirise social rank?', a:'The irony is that the Nose is, quite literally, a part of Kovaloff\'s own body — yet it dismisses him based purely on the superficial marker of "uniform buttons" indicating rank, showing how absurdly society judges people by outward status rather than any real or meaningful connection.', why:'The situational irony (a body part outranking and disowning its own owner) makes the satire on rank obsession sharply visible.'},
        {type:'Inference', q:'What does this rejection suggest about how the story treats rank and identity?', a:'It suggests that in this satirised society, rank and appearance are treated as more meaningful than truth, biology, or personal relationships — social status can override even the most fundamental facts, such as a nose belonging to its own face.', why:'The Nose\'s confident, matter-of-fact rejection — based only on a uniform detail — reveals how seriously (and absurdly) rank is taken by everyone in the story, not just Kovaloff.'}
      ]
    },
    {
      text:"\"My God! What have I done to deserve this? If I'd lost an arm or a leg it wouldn't be so lamentable. If my nose had been lopped off during the war, or in a duel, at least I might have had some say in the matter. But to lose it for no reason at all, and with nothing to show for it, not even a kopeck!\"",
      qs:[
        {type:'Contextual', q:'When does Kovaloff say this, and what has just happened to him?', a:'Kovaloff says this after returning to his flat, utterly dejected, having failed to get help from both the newspaper office and the police commissary in his attempts to recover his nose.', why:'This lament directly follows his rejected complaints, showing his mounting despair.'},
        {type:'Meaning', q:'What does Kovaloff seem most upset about — the loss itself, or something else?', a:'Kovaloff seems less upset about the physical loss and more upset that it happened "for no reason at all" and with "nothing to show for it" — he would have preferred losing it in a dignified way (war or duel) that would have given him some story or honour, or even for money.', why:'He explicitly contrasts losing a nose in war/duel (acceptable) with losing it randomly (unacceptable), showing his priority is dignity/status, not the physical injury.'},
        {type:'Literary Analysis', q:'What does the comparison to losing "an arm or a leg" reveal about Kovaloff\'s values, and how does this create satire?', a:'By claiming losing a limb would be "so lamentable" compared to this, Kovaloff reveals he cares far more about social respectability and having a good "story" than about actual physical wellbeing — this exaggerated, misplaced priority is satirical, mocking how vanity can distort a person\'s sense of what truly matters.', why:'The comparison is deliberately absurd — no reasonable person would prefer losing a limb to a nose — highlighting Kovaloff\'s distorted, vanity-driven priorities for comic effect.'},
        {type:'Inference', q:'What does this extract suggest is really being satirised through Kovaloff\'s reaction?', a:'It suggests Gogol is satirising a society where reputation and the appearance of respectability matter more than genuine wellbeing — Kovaloff\'s real anxiety is about how he will be perceived by others, not about the physical or practical loss itself.', why:'His fixation on "some say in the matter" and having "nothing to show for it" reveals his concern is fundamentally about social standing, not physical harm.'}
      ]
    }
  ],
  shortAnswers:[
    {q:'Who is the main character of the story? Justify your answer with evidence from the text.', a:'Kovaloff is the main character, since the majority of the story\'s events — his discovery of the missing nose, his pursuit of it around the city, his failed attempts to get help, and its eventual return — revolve around him and his reactions, while Ivan\'s role is limited mainly to the opening part of the story.', points:['Kovaloff is central to most of the plot','Story follows his discovery, pursuit, and resolution','Ivan\'s role is largely confined to Part I'], why:'A strong answer identifies the character whose journey structures the whole narrative, with specific plot evidence.'},
    {q:'Why do you think Kovaloff did not want to marry Madame Podtotchina\'s daughter?', a:'Although the text does not state his reason directly, it strongly implies Kovaloff is preoccupied with rank and material advantage — he says he is "willing to get married, provided his bride came with a substantial dowry of 200,000 rubles," suggesting his reluctance may relate to insufficient financial or social benefit rather than genuine feeling.', points:['Kovaloff is shown to be materially/status-driven','His stated marriage condition is a large dowry','His refusal likely reflects this priority, not affection'], why:'This is an inference question — a good answer reasons from the character\'s established vanity and stated priorities.'},
    {q:'How would Kovaloff have been affected if the nose had succeeded in escaping to Riga?', a:'If the nose had escaped to Riga, Kovaloff would likely have been left permanently without a nose, unable to fully resume his social and professional life, since he was already deeply anxious about being seen in public and losing respectability without it.', points:['Would remain permanently noseless','Unable to resume public/social life as before','Consistent with his earlier anxiety about appearance and status'], why:'This tests understanding of the stakes established earlier in the story — his fear about appearing without a nose.'}
  ],
  longAnswers:[
    {q:'"Kovaloff is not to be blamed for his vanity, since he is just a product of his environment." Do you agree? Use examples from the text to justify your position.', a:'I largely agree that Kovaloff\'s vanity is shaped by his environment, though this does not mean he bears no responsibility for how he acts on it.\n\nThe story repeatedly shows that Kovaloff\'s society rewards rank and appearance above all else. The Nose itself, once dressed as a state councillor, refuses to acknowledge Kovaloff purely because of his lower rank — demonstrating that this obsession with status is not unique to Kovaloff but built into how everyone in this world judges one another. Similarly, the police officer who rebuffs Ivan\'s bribe reveals that accepting favours from barbers is already normal and expected among officials, showing that corruption and status-consciousness are the norm, not an individual flaw.\n\nKovaloff\'s own specific behaviours — introducing himself as "Major" though he is only a committee-man, hoping for a "vice-governorship," and demanding a 200,000-ruble dowry for marriage — all reflect values that his entire social world seems to share and reward. In this sense, his vanity is less a personal defect than a natural product of a society that has taught him status is everything.\n\nHowever, being shaped by one\'s environment does not fully excuse his specific choices — such as his cruel and unfounded accusation of witchcraft against Madame Podtotchina, purely because he refused to marry her daughter and needed someone to blame. This suggests that while his environment created his vanity, he still exercises personal choice in how selfishly or unfairly he acts on it. Gogol\'s satire works precisely because Kovaloff is both a product of his corrupt, status-obsessed society and an individual who could have responded to his misfortune with more humility or self-reflection.', structure:'Introduction (largely agree, with a caveat) → Evidence: the Nose\'s own rank-based rejection shows a status-obsessed society → Evidence: police officer\'s bribery shows systemic corruption → Evidence: Kovaloff\'s specific vain behaviours reflect these shared social values → Counterpoint: his personal choices (blaming Madame Podtotchina) still show individual responsibility → Conclusion.', points:['Take a position (agree/disagree/partially) with reasoning','Use the Nose\'s rejection and police corruption as evidence of a status-obsessed environment','Connect Kovaloff\'s specific vanities to these shared social values','Acknowledge personal responsibility as a counterpoint for balance']},
    {q:'What changes would you like to see in Kovaloff\'s society so that people are more respectful to each other, irrespective of clothing and social status?', a:'Kovaloff\'s society, as satirised in the story, judges people almost entirely by outward markers of rank — uniforms, titles, and wealth — rather than by their character or actions. Several changes could help address this.\n\nFirst, institutions like the police and newspaper office in the story should be held accountable for treating people fairly regardless of their apparent status, rather than dismissing Kovaloff\'s complaint during a lunch break or refusing help based on assumptions about "disreputable company." Fair, consistent treatment by officials — not influenced by bribes like the free shaves the police officer already receives — would reduce the everyday corruption the story satirises.\n\nSecond, society\'s obsession with titles and uniforms, mocked through the Nose\'s rejection of Kovaloff based purely on "uniform buttons," could be addressed by valuing people\'s actions and character over their rank or appearance. If the Nose (and society generally) judged Kovaloff by how he treated others rather than his job title, the story\'s central absurdity — a body part outranking its own owner — would lose its power entirely.\n\nFinally, individuals like Kovaloff himself would need to examine their own values: his fixation on marrying only for a large dowry, and his willingness to blame an innocent woman out of spite, both stem from the same status-obsessed mindset the story criticises. A society that taught people to value honesty and kindness over rank and appearance — starting with how individuals like Kovaloff treat those around them — would go a long way toward the more respectful, equal community the story implicitly calls for.', structure:'Introduction (identify the core problem: judgement by rank/appearance) → Change 1: institutional accountability and fairness → Change 2: valuing character over titles/uniforms → Change 3: individual self-reflection, using Kovaloff\'s own flaws as the example → Conclusion.', points:['Identify the core social problem the story satirises','Propose institutional changes (accountability, fairness)','Propose a cultural/values change (character over appearance)','Connect back to Kovaloff\'s own specific flaws as a concrete example']}
  ]
});

CURRICULUM.grade8.grammar.push({
  id:'sentences', title:'Types of Sentences & Conversion',
  what:"A sentence can be classified by purpose (declarative, interrogative, imperative, exclamatory) or by structure (simple, compound, complex). 'Conversion' means rewriting a sentence from one type into another while keeping the same meaning.",
  undumbify:{plain:"Sentences come in different 'moods' — telling, asking, ordering, or shouting — and different 'builds' — one idea, two ideas glued together, or one main idea with a helper idea attached.", analogy:"Think of sentence types like camera angles on the same scene: a statement is a plain shot, a question turns the camera on the viewer, an exclamation zooms in dramatically.", example:"'She is happy.' (statement) → 'Is she happy?' (question) → 'How happy she is!' (exclamation) — same idea, different purpose.", examDef:"By purpose: Declarative (states a fact), Interrogative (asks a question), Imperative (gives a command/request), Exclamatory (expresses strong feeling). By structure: Simple (one independent clause), Compound (two independent clauses joined by a coordinating conjunction), Complex (one independent + one or more dependent clauses)."},
  rule:"By purpose — Declarative: ends with a full stop, states a fact. Interrogative: ends with a question mark, asks something. Imperative: gives an order/request, subject 'you' is usually understood. Exclamatory: ends with an exclamation mark, expresses strong emotion.\n\nBy structure — Simple sentence: one subject + one finite verb (one independent clause). Compound sentence: two or more independent clauses joined by 'and', 'but', 'or', 'so', 'for', 'yet'. Complex sentence: one independent clause + one or more dependent clauses joined by a subordinating conjunction (because, although, if, when, since, etc.).\n\nConversion tips: Assertive ↔ Interrogative — invert the auxiliary/subject order, or use question tags. Assertive ↔ Exclamatory — use 'What a...!' or 'How...!' patterns. Simple ↔ Compound — split into two clauses joined by 'and'/'but'. Simple ↔ Complex — expand a phrase into a full dependent clause.",
  examples:[
    {lvl:'easy', text:'The sun rises in the east. (Declarative → Interrogative): Does the sun rise in the east?'},
    {lvl:'easy', text:'Close the door. (Imperative → Declarative): You are requested to close the door.'},
    {lvl:'medium', text:'She is very intelligent. (Declarative → Exclamatory): How intelligent she is!'},
    {lvl:'medium', text:'He is poor but he is honest. (Compound → Complex): Though he is poor, he is honest.'},
    {lvl:'challenge', text:'Nobody can solve this problem. (Assertive with "nobody" → Interrogative): Can anybody solve this problem?'},
    {lvl:'challenge', text:'As soon as the bell rang, the students left. (Complex → Simple): On the ringing of the bell, the students left.'},
    {lvl:'challenge', text:'He is so weak that he cannot walk. (Complex → Simple): He is too weak to walk.'},
    {lvl:'challenge', text:'Rahul said, "I am tired." (Direct/exclamatory feel → plain declarative + reported): Rahul said that he was tired.'}
  ],
  mistakes:[
    {wrong:'What a beautiful flower is this!', right:'What a beautiful flower this is!', why:'In exclamatory sentences beginning with "What a/How", the normal subject-verb order is kept after the exclamatory phrase.'},
    {wrong:'Does the sun rises in the east?', right:'Does the sun rise in the east?', why:'After the auxiliary "does", the main verb must be in its base form ("rise"), not the third-person "-s" form.'},
    {wrong:'He is poor, but he is honest, so he never lies.', right:'Although he is poor and honest, he never lies. (complex form)', why:'Overusing multiple coordinating conjunctions creates a run-on compound sentence; converting one clause to a dependent clause creates a cleaner complex sentence.'},
    {wrong:'Being a compound sentence: "He is intelligent and hardworking and he always helps others."', right:'He is intelligent, hardworking, and always helps others. (simple sentence with a compound predicate)', why:'Stringing several ideas together with repeated "and" is a common run-on error; combining shared subjects into one clause is often cleaner and still grammatically simple.'},
    {wrong:'Close the door please you.', right:'Please close the door.', why:'In imperative sentences, the understood subject "you" is dropped; "please" is placed at the start or end, not mid-sentence before the object.'}
  ],
  practice:{
    fillBlanks:[
      {q:'Convert to interrogative: "He plays football every day." → ______ football every day?', a:'Does he play'},
      {q:'Convert to exclamatory: "It is a very hot day." → What ______ hot day it is!', a:'a'},
      {q:'Convert to imperative: "You should not litter in the park." → ______ litter in the park.', a:'Do not (Don\'t)'},
      {q:'Combine using a subordinating conjunction: "He was tired. He kept working." → ______ he was tired, he kept working.', a:'Although / Though'}
    ],
    mcqs:[
      {q:'Which sentence is Imperative?', options:['She sings well.','Please close the window.','Does she sing well?','What a lovely song!'], answer:1, explain:'Imperative sentences give commands or requests — "Please close the window" is a polite request.'},
      {q:'"Although it was raining, we went out." is an example of:', options:['Simple sentence','Compound sentence','Complex sentence','Exclamatory sentence'], answer:2, explain:'It has one independent clause ("we went out") and one dependent clause introduced by the subordinating conjunction "Although" — making it complex.'},
      {q:'Which is the correctly converted interrogative of "Everybody loves a winner."?', options:['Does everybody love a winner?','Who does not love a winner?','Loves everybody a winner?','Is everybody loves a winner?'], answer:1, explain:'A common exam-style conversion for assertive sentences with "everybody" uses a rhetorical negative question: "Who does not love a winner?"'}
    ],
    identify:[
      {sentence:'He is not only intelligent but also hardworking.', ask:'Identify the sentence type by structure.', answer:'Compound sentence (joined by the correlative conjunction "not only...but also").'},
      {sentence:'The boy who won the race is my brother.', ask:'Identify the sentence type by structure and name the dependent clause.', answer:'Complex sentence — the dependent (relative) clause is "who won the race", describing "the boy".'}
    ],
    correct:[
      {wrong:'How the movie was interesting!', right:'How interesting the movie was!'},
      {wrong:'What a she is talented singer!', right:'What a talented singer she is!'}
    ],
    convert:[
      {from:'Simple', to:'Complex', sentence:'On hearing the news, she started crying.', answer:'When she heard the news, she started crying.'},
      {from:'Compound', to:'Simple', sentence:'He was tired, but he kept working.', answer:'In spite of being tired, he kept working.'}
    ]
  },
  quickRevision:"Purpose: Declarative (.), Interrogative (?), Imperative (order), Exclamatory (!). Structure: Simple = 1 clause. Compound = 2+ independent clauses + coordinating conjunction. Complex = independent + dependent clause + subordinating conjunction. Conversion keeps meaning the same while changing form."
});

CURRICULUM.grade8.grammar.push({
  id:'non-finite-verbs', title:'Non-finite Verbs',
  what:"Non-finite verbs are verb forms that do not show tense, number, or person on their own, and cannot act as the main verb of a sentence by themselves. They include infinitives, gerunds, and participles.",
  undumbify:{plain:"A 'finite' verb is a verb doing its full job — showing who's doing it and when. A 'non-finite' verb is a verb form on a break — it doesn't tell you the tense or match the subject; it just acts more like a noun, adjective, or describing word.", analogy:"Finite verbs are like an employee actively clocked-in and working a shift (tense, person all active). Non-finite verbs are like that same employee on a coffee break — still recognisably them, but not currently 'doing the job' of showing tense.", example:"'To swim is fun.' — 'to swim' (infinitive) is acting like a noun (the subject), not telling us when someone swims.", examDef:"Non-finite verbs = infinitives (to + base verb), gerunds (verb+ing used as a noun), and participles (present participle verb+ing, or past participle verb+ed/en, used as adjectives or in perfect/continuous tenses). They do not change according to subject or express tense independently."},
  rule:"1) Infinitive: 'to' + base verb (to run, to eat). Can act as noun, adjective, or adverb. E.g., 'I want to sleep' (noun-like, object of 'want').\n2) Gerund: verb + '-ing' used as a noun. E.g., 'Swimming is good exercise' (subject of the sentence).\n3) Participle: Present participle (verb+ing) used as an adjective ('the barking dog') or in continuous tenses ('is barking'). Past participle (verb+ed/en/irregular form) used as an adjective ('a broken vase') or in perfect tenses ('has broken').\n4) Finite vs non-finite: A finite verb changes with subject/tense ('runs', 'ran', 'will run'). A non-finite verb form stays the same regardless of subject/tense ('to run', 'running', 'run' as a participle).",
  examples:[
    {lvl:'easy', text:'Infinitive: She wants to learn French.'},
    {lvl:'easy', text:'Gerund: Reading is her favourite hobby.'},
    {lvl:'medium', text:'Present participle (adjective): The crying baby needed attention.'},
    {lvl:'medium', text:'Past participle (adjective): The broken window let the rain in.'},
    {lvl:'challenge', text:'Infinitive of purpose: He ran quickly to catch the bus.'},
    {lvl:'challenge', text:'Gerund as object of preposition: She is good at singing.'},
    {lvl:'challenge', text:'Perfect participle: Having finished dinner, we went for a walk.'},
    {lvl:'challenge', text:'Gerund phrase as subject: Eating too much junk food can cause health problems.'}
  ],
  mistakes:[
    {wrong:'I enjoy to swim.', right:'I enjoy swimming.', why:'The verb "enjoy" must be followed by a gerund, not an infinitive.'},
    {wrong:'She decided going home.', right:'She decided to go home.', why:'The verb "decided" must be followed by an infinitive, not a gerund.'},
    {wrong:'The interesting movie (meaning the movie feels bored) confused me.', right:'The confusing movie confused me. / I was confused by the interesting movie.', why:'Present participles like "interesting" describe something that causes a feeling; past participles like "confused" describe something/someone experiencing the feeling.'},
    {wrong:'Walking to the station, the bag was heavy.', right:'Walking to the station, I found the bag heavy. / As I walked to the station, the bag was heavy.', why:'A participle phrase at the start of a sentence must describe the subject of the main clause ("I"), not an unrelated noun ("the bag") — this is a "dangling participle".'},
    {wrong:'Finish to read this book by Friday.', right:'Finish reading this book by Friday.', why:'"Finish" is always followed by a gerund, never an infinitive.'}
  ],
  practice:{
    fillBlanks:[
      {q:'She loves ______ (dance) in the rain.', a:'dancing'},
      {q:'He wants ______ (become) a doctor.', a:'to become'},
      {q:'______ (finish) his lunch, he went back to work. (perfect participle)', a:'Having finished'},
      {q:'They avoid ______ (eat) junk food.', a:'eating'}
    ],
    mcqs:[
      {q:'Identify the non-finite verb: "To err is human."', options:['is','human','To err','err'], answer:2, explain:'"To err" is an infinitive functioning as the subject of the sentence.'},
      {q:'Which sentence correctly uses a gerund?', options:['I look forward to meet you.','I look forward to meeting you.','I look forward meeting you.','I look forward met you.'], answer:1, explain:'The phrase "look forward to" is followed by a gerund (verb+ing), not a base infinitive.'},
      {q:'"Seen from the hill, the town looked tiny." — what type of non-finite verb is "Seen"?', options:['Gerund','Present participle','Past participle','Infinitive'], answer:2, explain:'"Seen" is a past participle used to form a participle phrase describing "the town" as viewed from a vantage point.'}
    ],
    identify:[
      {sentence:'Having finished his homework, he went out to play.', ask:'Identify the non-finite verb forms and their type.', answer:'"Having finished" (perfect participle) and "to play" (infinitive of purpose).'},
      {sentence:'Smoking is injurious to health.', ask:'Identify the non-finite verb and its function in the sentence.', answer:'"Smoking" is a gerund functioning as the subject of the sentence.'}
    ],
    correct:[
      {wrong:'I am looking forward to see you.', right:'I am looking forward to seeing you.'},
      {wrong:'Break, the vase fell off the table.', right:'Broken, the vase lay on the floor. / The vase, which was broken, fell off the table.'}
    ],
    convert:[
      {from:'Two simple sentences', to:'One sentence using a participle', sentence:'He finished his work. He went home.', answer:'Having finished his work, he went home.'},
      {from:'Two simple sentences', to:'One sentence using an infinitive', sentence:'She went to the market. She wanted to buy vegetables.', answer:'She went to the market to buy vegetables.'}
    ]
  },
  quickRevision:"Infinitive = to + base verb. Gerund = verb+ing (noun role). Present participle = verb+ing (adjective/continuous tense). Past participle = verb+ed/irregular (adjective/perfect tense). None of these change with subject or tense on their own — that's what makes them 'non-finite'."
});

CURRICULUM.grade8.grammar.push({
  id:'modals', title:'Modals',
  what:"Modals are auxiliary (helping) verbs — can, could, may, might, must, shall, should, will, would, ought to — that express ability, possibility, permission, obligation, or necessity, rather than an action itself.",
  undumbify:{plain:"Modals are the 'attitude' verbs — they don't describe an action, they describe how sure, how allowed, or how necessary that action is.", analogy:"If the main verb is the car, the modal is the dashboard light telling you whether you CAN drive (ability), MAY drive (permission), MUST drive (obligation), or MIGHT drive later (possibility).", example:"'I can swim' (ability) vs 'I must swim' (obligation) vs 'I might swim' (possibility) — same verb 'swim', totally different meanings depending on the modal.", examDef:"Modal verbs are followed directly by the base form of the main verb (no 'to', no '-s', no '-ing'), do not change form for person/number, and express ability, permission, possibility, probability, obligation, or necessity."},
  rule:"Can/Could: ability or informal permission (can = present, could = past/polite). May/Might: formal permission or possibility (might = more uncertain than may). Must: strong obligation or logical certainty ('He must be tired'). Have to: external obligation (often interchangeable with must, but 'must' implies the speaker's own judgement while 'have to' implies an outside rule). Shall/Will: future actions, offers, promises (shall is more formal/British, often for 'I/we'). Should/Ought to: advice or mild obligation. Would: past habits, polite requests, hypothetical situations.\n\nGrammar rule: Modal + base verb (no 'to', no -s, no -ing). Example: 'She can swims' is WRONG → 'She can swim' is correct.",
  examples:[
    {lvl:'easy', text:'Ability: I can ride a bicycle.'},
    {lvl:'easy', text:'Permission: May I leave the room?'},
    {lvl:'medium', text:'Obligation: Students must submit homework on time.'},
    {lvl:'medium', text:'Advice: You should drink more water.'},
    {lvl:'challenge', text:'Logical deduction: She must be at home — the lights are on.'},
    {lvl:'challenge', text:'Polite hypothetical: Would you mind closing the door?'},
    {lvl:'challenge', text:'Past ability: When I was young, I could run very fast.'},
    {lvl:'challenge', text:'Prohibition: Visitors must not feed the animals.'}
  ],
  mistakes:[
    {wrong:'She can plays the piano.', right:'She can play the piano.', why:'Modals are always followed by the base form of the verb — never add "-s".'},
    {wrong:'He musts finish the work.', right:'He must finish the work.', why:'Modals never take an "-s" ending, even in the third person singular.'},
    {wrong:'I am able to can swim.', right:'I am able to swim. / I can swim.', why:'Two modal-like structures cannot be stacked directly; choose one.'},
    {wrong:'You must to submit the form today.', right:'You must submit the form today.', why:'Modals are never followed by "to" before the main verb.'},
    {wrong:'He can\'t to come to the party.', right:'He can\'t come to the party.', why:'The negative form of a modal is still directly followed by the base verb, with no "to".'}
  ],
  practice:{
    fillBlanks:[
      {q:'You ______ wear a seatbelt while driving. (strong obligation)', a:'must'},
      {q:'______ I borrow your pen, please? (polite permission)', a:'May'},
      {q:'When she was a child, she ______ speak three languages. (past ability)', a:'could'},
      {q:'You ______ smoke here — it is strictly forbidden. (prohibition)', a:'must not (mustn\'t)'}
    ],
    mcqs:[
      {q:'Which modal best expresses a logical near-certainty?', options:['can','might','must','shall'], answer:2, explain:'"Must" is used for strong logical deduction, e.g., "He must be tired after that long run."'},
      {q:'Choose the correct sentence:', options:['She should to attend class.','She should attends class.','She should attend class.','She shoulds attend class.'], answer:2, explain:'Modals are followed directly by the base verb with no "to" and no added "-s".'},
      {q:'"You needn\'t come to the meeting." means:', options:['You are forbidden to come.','It is not necessary for you to come, but you may.','You must come.','You are unable to come.'], answer:1, explain:'"Needn\'t" expresses absence of obligation, not prohibition — coming is optional, not forbidden.'}
    ],
    identify:[
      {sentence:'You ought to apologise to her.', ask:'Identify the modal and the type of meaning it expresses.', answer:'"Ought to" expresses moral obligation/advice.'},
      {sentence:'It might rain later, so carry an umbrella.', ask:'Identify the modal and the type of meaning it expresses.', answer:'"Might" expresses a weak/uncertain possibility.'}
    ],
    correct:[
      {wrong:'He can to speak three languages.', right:'He can speak three languages.'},
      {wrong:'She musts be very tired.', right:'She must be very tired.'}
    ],
    convert:[
      {from:'Statement', to:'Question with modal', sentence:'You should call her.', answer:'Should you call her?'},
      {from:'Statement', to:'Negative with modal', sentence:'He must attend the meeting.', answer:'He must not (mustn\'t) attend the meeting.'}
    ]
  },
  quickRevision:"Can/Could = ability. May/Might = permission/possibility. Must = obligation/certainty. Should/Ought to = advice. Will/Shall = future/offer. Would = habit/politeness. Rule: Modal + base verb, no '-s', no 'to'."
});

CURRICULUM.grade8.grammar.push({
  id:'tenses', title:'Tenses',
  what:"Tense shows when an action happens — present, past, or future — and whether it is simple, continuous (ongoing), perfect (completed), or perfect continuous (ongoing up to a point).",
  undumbify:{plain:"Tenses are just verb 'timestamps' — they tell you exactly when something happened and whether it's finished, still going, or was going on for a while.", analogy:"Think of the 12 tenses like 12 camera settings: Simple = a plain photo. Continuous = a video clip (still happening). Perfect = a photo with a caption saying 'already done'. Perfect Continuous = a video clip with a caption saying 'still going, and has been for a while'.", example:"'I eat' (simple) vs 'I am eating' (continuous) vs 'I have eaten' (perfect) vs 'I have been eating' (perfect continuous) — same verb, four different senses of time/completion.", examDef:"12 main tense forms across Present, Past and Future, each split into Simple, Continuous, Perfect and Perfect Continuous — formed using base verb changes, 'be' + -ing, 'have/has/had' + past participle, and combinations of these."},
  rule:"PRESENT — Simple: base verb (+s for he/she/it) — 'She writes.' Continuous: am/is/are + verb-ing — 'She is writing.' Perfect: has/have + past participle — 'She has written.' Perfect Continuous: has/have been + verb-ing — 'She has been writing for an hour.'\n\nPAST — Simple: past form of verb — 'She wrote.' Continuous: was/were + verb-ing — 'She was writing.' Perfect: had + past participle — 'She had written.' Perfect Continuous: had been + verb-ing — 'She had been writing.'\n\nFUTURE — Simple: will/shall + base verb — 'She will write.' Continuous: will be + verb-ing — 'She will be writing.' Perfect: will have + past participle — 'She will have written.' Perfect Continuous: will have been + verb-ing — 'She will have been writing.'\n\nNegatives are formed by inserting 'not' after the auxiliary (is not, has not, will not). Questions are formed by inverting subject and auxiliary (Is she writing? Has she written?).",
  examples:[
    {lvl:'easy', text:'Present Simple: He plays cricket every Sunday.'},
    {lvl:'easy', text:'Past Continuous: They were watching a movie at 8 pm.'},
    {lvl:'medium', text:'Present Perfect: I have finished my homework.'},
    {lvl:'medium', text:'Future Perfect: By next year, she will have graduated.'},
    {lvl:'challenge', text:'Past Perfect Continuous: He had been working there for ten years before he resigned.'},
    {lvl:'challenge', text:'Negative Present Perfect Continuous: She has not been feeling well lately.'},
    {lvl:'challenge', text:'Future Continuous: This time tomorrow, we will be flying to Delhi.'},
    {lvl:'challenge', text:'Present Perfect Continuous (question): How long have you been learning the guitar?'}
  ],
  mistakes:[
    {wrong:'I am knowing the answer.', right:'I know the answer.', why:'Stative verbs (know, believe, love, want) are usually not used in continuous forms.'},
    {wrong:'She has went to school.', right:'She has gone to school.', why:'Present perfect requires the past participle ("gone"), not the simple past form ("went").'},
    {wrong:'He is live in Delhi.', right:'He lives in Delhi.', why:'Habitual facts use present simple, not present continuous.'},
    {wrong:'I have seen him yesterday.', right:'I saw him yesterday.', why:'A definite past time word like "yesterday" requires simple past, not present perfect.'},
    {wrong:'She is since studying for two hours.', right:'She has been studying for two hours.', why:'Ongoing actions continuing "for" a duration use present perfect continuous, not present continuous with "since".'}
  ],
  practice:{
    fillBlanks:[
      {q:'By the time we arrived, the movie ______ (already start).', a:'had already started'},
      {q:'She ______ (study) English for five years now.', a:'has been studying'},
      {q:'Look at those clouds! It ______ (rain) soon.', a:'is going to rain'},
      {q:'This time next week, I ______ (sit) on a beach in Goa.', a:'will be sitting'}
    ],
    mcqs:[
      {q:'"They will have completed the project by Friday." — which tense is this?', options:['Future Simple','Future Continuous','Future Perfect','Future Perfect Continuous'], answer:2, explain:'"Will have + past participle" is the structure of Future Perfect, showing an action completed before a future point.'},
      {q:'Choose the correctly formed Past Perfect sentence:', options:['She had eat lunch before I arrived.','She had eaten lunch before I arrived.','She has eaten lunch before I arrived.','She was eaten lunch before I arrived.'], answer:1, explain:'Past Perfect = had + past participle ("eaten").'},
      {q:'Which sentence correctly uses the Present Perfect Continuous?', options:['I am living here since 2015.','I have lived here since 2015 and still do.','I have been living here since 2015.','I live here since 2015.'], answer:2, explain:'An action that started in the past and is still continuing, especially with "since"/"for", typically uses present perfect continuous: "have/has been + verb-ing".'}
    ],
    identify:[
      {sentence:'We had been waiting for two hours when the train finally arrived.', ask:'Identify the tense of the underlined verb phrase "had been waiting".', answer:'Past Perfect Continuous — shows an ongoing action that continued up until another past action (the train arriving).'},
      {sentence:'By 2030, scientists will have developed even better vaccines.', ask:'Identify the tense of "will have developed".', answer:'Future Perfect — an action expected to be completed before a specific future point (2030).'}
    ],
    correct:[
      {wrong:'He is knowing the truth.', right:'He knows the truth.'},
      {wrong:'I am living in this city since 2010.', right:'I have been living in this city since 2010.'}
    ],
    convert:[
      {from:'Present Simple', to:'Present Perfect Continuous', sentence:'She works here.', answer:'She has been working here (for/since...).'},
      {from:'Past Simple', to:'Past Perfect', sentence:'He left before she arrived.', answer:'He had left before she arrived.'}
    ]
  },
  quickRevision:"Simple = fact/habit. Continuous = ongoing (be + -ing). Perfect = completed before another point (have/has/had + V3). Perfect Continuous = ongoing up to a point (have/has/had been + -ing). Apply the same 4-way split to Present, Past and Future."
});

CURRICULUM.grade8.grammar.push({
  id:'voice', title:'Voice: Active & Passive',
  what:"Voice shows whether the subject of a sentence performs the action (Active Voice) or receives the action (Passive Voice). Both describe the same event, just from a different focus.",
  undumbify:{plain:"Active voice puts the 'doer' first ('The dog bit the man'). Passive voice puts the 'receiver' first and pushes the doer to the end or drops it entirely ('The man was bitten by the dog' / 'The man was bitten').", analogy:"Active voice is like a news headline: 'Team wins championship!' — action-first, doer-first. Passive voice is like a police report: 'The championship was won...' — focused on the result, with the doer sometimes mentioned almost as an afterthought, or left out entirely if unknown or unimportant.", example:"'Shakespeare wrote Hamlet.' (active, focus on Shakespeare) vs 'Hamlet was written by Shakespeare.' (passive, focus on Hamlet) — same fact, different emphasis.", examDef:"Active voice: Subject + verb + object, where the subject performs the action. Passive voice: Object of the active sentence becomes the new subject + a form of 'be' + past participle + (by + original subject, optional)."},
  rule:"To convert Active → Passive:\n1) The object of the active sentence becomes the subject of the passive sentence.\n2) The verb changes to the correct form of 'be' + past participle (matching the tense of the original sentence).\n3) The original subject becomes the agent, introduced by 'by' (often optional, especially if unknown/unimportant/obvious).\n\nExamples across tenses:\nPresent Simple: 'She writes a letter.' → 'A letter is written by her.'\nPast Simple: 'She wrote a letter.' → 'A letter was written by her.'\nPresent Continuous: 'She is writing a letter.' → 'A letter is being written by her.'\nPresent Perfect: 'She has written a letter.' → 'A letter has been written by her.'\nModals: 'She can write a letter.' → 'A letter can be written by her.'\n\nNote: Only transitive verbs (verbs that take a direct object) can be made passive — intransitive verbs like 'sleep' or 'arrive' cannot.\nImperatives: 'Close the door.' → 'Let the door be closed.'\nQuestions: 'Did she write the letter?' → 'Was the letter written by her?'",
  examples:[
    {lvl:'easy', text:'Active: The chef cooks the meal. → Passive: The meal is cooked by the chef.'},
    {lvl:'easy', text:'Active: Someone stole my bicycle. → Passive: My bicycle was stolen (by someone).'},
    {lvl:'medium', text:'Active: They are building a new bridge. → Passive: A new bridge is being built (by them).'},
    {lvl:'medium', text:'Active: The teacher will explain the topic. → Passive: The topic will be explained by the teacher.'},
    {lvl:'challenge', text:'Active: They have already finished the project. → Passive: The project has already been finished (by them).'},
    {lvl:'challenge', text:'Active: Open the window. (imperative) → Passive: Let the window be opened.'},
    {lvl:'challenge', text:'Active: People say that honesty is the best policy. → Passive: It is said that honesty is the best policy.'},
    {lvl:'challenge', text:'Active: Did she invite you to the party? → Passive: Were you invited to the party (by her)?'}
  ],
  mistakes:[
    {wrong:'The letter was wrote by her.', right:'The letter was written by her.', why:'Passive voice needs the past PARTICIPLE ("written"), not the simple past form ("wrote").'},
    {wrong:'A new bridge is build by them.', right:'A new bridge is being built by them.', why:'Continuous-tense passives need "being" before the past participle to show the action is ongoing.'},
    {wrong:'She slept by him. (from "He slept.")', right:'He slept. (cannot be made passive)', why:'"Sleep" is intransitive — it has no direct object, so it cannot be converted into the passive voice.'},
    {wrong:'The cake was eating by the children.', right:'The cake was being eaten by the children. / The cake was eaten by the children.', why:'"Eating" is the wrong form after "was" in a passive sentence; use either the past participle ("eaten") for a completed action, or "being eaten" for an ongoing one.'}
  ],
  practice:{
    fillBlanks:[
      {q:'Active: The manager signs the cheque. → Passive: The cheque ______ by the manager.', a:'is signed'},
      {q:'Active: They will announce the results tomorrow. → Passive: The results ______ tomorrow.', a:'will be announced'},
      {q:'Active: Someone has broken the window. → Passive: The window ______.', a:'has been broken'},
      {q:'Active: Please submit the form by Friday. → Passive: Let the form ______ by Friday.', a:'be submitted'}
    ],
    mcqs:[
      {q:'Choose the correct passive form of "She is painting a picture."', options:['A picture is painted by her.','A picture is being painted by her.','A picture was being painted by her.','A picture has been painted by her.'], answer:1, explain:'Present Continuous passive = is/am/are + being + past participle.'},
      {q:'Which verb CANNOT normally be made passive?', options:['eat','write','arrive','build'], answer:2, explain:'"Arrive" is intransitive (no direct object), so it has no passive form.'},
      {q:'Passive of "Who wrote this novel?" is:', options:['By whom was this novel written?','Who was this novel written?','This novel was written by who?','Whom wrote this novel?'], answer:0, explain:'When the active question begins with "Who" (asking about the doer), the passive form typically becomes "By whom was..."'}
    ],
    identify:[
      {sentence:'The award was given to her by the committee.', ask:'Identify the voice and the original active-voice subject.', answer:'Passive voice — the original active subject (the doer) was "the committee".'},
      {sentence:'Rice is grown in many parts of India.', ask:'Identify the voice, and explain why "by" is not used.', answer:'Passive voice; "by" is omitted because the doer (farmers/people in general) is unknown, unimportant, or too obvious to state.'}
    ],
    correct:[
      {wrong:'The song was sang by her beautifully.', right:'The song was sung by her beautifully.'},
      {wrong:'A mistake was did by him.', right:'A mistake was made by him.'}
    ],
    convert:[
      {from:'Active', to:'Passive', sentence:'The librarian issued the book to me.', answer:'The book was issued to me by the librarian.'},
      {from:'Passive', to:'Active', sentence:'The match was won by our team.', answer:'Our team won the match.'}
    ]
  },
  quickRevision:"Active = subject does the action. Passive = subject receives the action (object of active sentence becomes new subject + be + past participle + by + agent). Only transitive verbs can be passive. Match the 'be' form to the original tense (is/was/has been/will be/being, etc.)."
});

CURRICULUM.grade8.grammar.push({
  id:'narration', title:'Narration: Direct & Indirect Speech',
  what:"Direct speech reports a person's exact words inside quotation marks ('He said, \"I am tired.\"'). Indirect (reported) speech reports the same meaning in your own words, without quotation marks, usually with changes to tense, pronouns, and time/place expressions ('He said that he was tired.').",
  undumbify:{plain:"Direct speech is hitting 'copy-paste' on exactly what someone said. Indirect speech is retelling it in your own words later — which usually means shifting the tense back a step, since you're now talking about something that was said in the past.", analogy:"Direct speech is like a live quote in a news report: 'The minister said, \"We will build 100 new schools.\"' Indirect speech is you telling a friend about it the next day: 'The minister said that they would build 100 new schools.' — same content, but pronouns and tense shift because time has passed and you're not quoting live anymore.", example:"Direct: She said, \"I am going to the market.\" → Indirect: She said that she was going to the market. (tense shifts back: am → was; 'going to' stays but reported)", examDef:"Rules for converting direct to indirect speech: (1) remove quotation marks and use a connector ('that', 'if/whether', or a question word); (2) shift tense one step back if the reporting verb is in the past ('backshift'); (3) change pronouns to match the perspective of the reporter; (4) change time/place words (today→that day, here→there, tomorrow→the next day, etc.); (5) change the reporting verb for questions/commands ('said'→'asked', 'told to'/'ordered to')."},
  rule:"1) Statements: 'He said, \"I am happy.\"' → 'He said (that) he was happy.' (present → past)\n2) Questions: 'She said, \"Where do you live?\"' → 'She asked where I lived.' (no question mark, no auxiliary inversion, 'said'→'asked')\n3) Yes/No Questions: 'He said, \"Do you like tea?\"' → 'He asked if/whether I liked tea.'\n4) Commands/Requests: 'The teacher said, \"Close the door.\"' → 'The teacher told/ordered him to close the door.' (imperative → to + base verb)\n5) Exclamations: 'She said, \"What a lovely dress!\"' → 'She exclaimed with joy that it was a lovely dress.'\n\nTense backshift (only if reporting verb is PAST):\nPresent Simple → Past Simple | Present Continuous → Past Continuous | Present Perfect → Past Perfect | Past Simple → Past Perfect | will → would | can → could | may → might | must → had to\n\nPronoun changes: I/we → he/she/they (matching the original speaker); you → I/we/he/she (matching the listener, depending on context).\n\nTime/place changes: now→then, today→that day, tomorrow→the next day, yesterday→the previous day, here→there, this→that, these→those.",
  examples:[
    {lvl:'easy', text:'Direct: He said, "I am tired." → Indirect: He said that he was tired.'},
    {lvl:'easy', text:'Direct: She said, "I will help you." → Indirect: She said that she would help me.'},
    {lvl:'medium', text:'Direct: Riya said, "Where is my book?" → Indirect: Riya asked where her book was.'},
    {lvl:'medium', text:'Direct: The officer said, "Show me your ticket." → Indirect: The officer told me to show him my ticket.'},
    {lvl:'challenge', text:'Direct: She said, "What a beautiful sunset!" → Indirect: She exclaimed that it was a beautiful sunset.'},
    {lvl:'challenge', text:'Direct: He said, "I saw her yesterday." → Indirect: He said that he had seen her the previous day.'},
    {lvl:'challenge', text:'Direct: The teacher said, "The earth revolves around the sun." → Indirect: The teacher said that the earth revolves around the sun. (universal truth — no tense change)'},
    {lvl:'challenge', text:'Direct: "Let\'s go for a walk," she said. → Indirect: She suggested going for a walk.'}
  ],
  mistakes:[
    {wrong:'He said that he is tired.', right:'He said that he was tired.', why:'When the reporting verb is in the past ("said"), the tense inside the reported clause must generally shift one step back too.'},
    {wrong:'She asked me where did I live.', right:'She asked me where I lived.', why:'Reported questions use normal statement word order, NOT question (inverted) word order.'},
    {wrong:'He asked me that what my name was.', right:'He asked me what my name was.', why:'"That" is only used for reported statements, never combined with a question word like "what/where/why".'},
    {wrong:'The teacher told to close the door.', right:'The teacher told him/us to close the door.', why:'"Tell" always needs an object (told + someone + to + verb); it cannot be followed directly by "to" without naming who was told.'}
  ],
  practice:{
    fillBlanks:[
      {q:'Direct: She said, "I can swim." → Indirect: She said that she ______ swim.', a:'could'},
      {q:'Direct: He said, "I am going home now." → Indirect: He said that he ______ home then.', a:'was going'},
      {q:'Direct: "Don\'t touch that wire!" the electrician said. → Indirect: The electrician warned me not ______ that wire.', a:'to touch'},
      {q:'Direct: They said, "We saw the movie yesterday." → Indirect: They said that they ______ the movie the previous day.', a:'had seen'}
    ],
    mcqs:[
      {q:'Convert to indirect speech: She said, "I am busy today."', options:['She said that she was busy today.','She said that she is busy today.','She said that she was busy that day.','She said she is busy that day.'], answer:2, explain:'Present Simple "am" backshifts to "was", and "today" changes to "that day" since the reporting happens later.'},
      {q:'Convert to indirect speech: He said, "Where are you going?"', options:['He asked where I was going.','He asked where was I going.','He asked that where I was going.','He asked where am I going.'], answer:0, explain:'Reported questions drop the question mark and inverted word order, and use a plain statement structure after the question word.'},
      {q:'Convert to indirect speech: The doctor said, "Take this medicine twice a day."', options:['The doctor said take this medicine twice a day.','The doctor told me to take that medicine twice a day.','The doctor asked to take this medicine twice a day.','The doctor ordered this medicine twice a day.'], answer:1, explain:'Reported commands/instructions use "told + object + to + base verb"; "this" typically shifts to "that" in reported speech.'}
    ],
    identify:[
      {sentence:'He asked if I had finished my homework.', ask:'What was the likely original direct-speech sentence?', answer:'He said, "Have you finished your homework?" — a yes/no question reported using "if", with the tense backshifted to past perfect.'},
      {sentence:'She exclaimed that the fireworks were amazing.', ask:'What was the likely original direct-speech sentence, and what type of sentence was it?', answer:'She said, "What amazing fireworks!" — an exclamatory sentence, converted using "exclaimed that" and reworded into a plain statement.'}
    ],
    correct:[
      {wrong:'He said that he will come tomorrow.', right:'He said that he would come the next day.'},
      {wrong:'She asked me did I like the movie.', right:'She asked me if I liked the movie.'}
    ],
    convert:[
      {from:'Direct', to:'Indirect', sentence:'The manager said, "I will finish the report by tomorrow."', answer:'The manager said that he would finish the report by the next day.'},
      {from:'Indirect', to:'Direct', sentence:'She told him that she had already submitted the assignment.', answer:'She said to him, "I have already submitted the assignment."'}
    ]
  },
  quickRevision:"Direct = exact quoted words in quotation marks. Indirect = reworded, no quotation marks, connector added ('that'/'if'/question word). If reporting verb is past, backshift tense one step, and shift pronouns + time/place words (today→that day, here→there). Questions use statement word order; commands use 'told/asked + object + to + verb'."
});

CURRICULUM.grade8.grammar.push({
  id:'subject-verb-agreement', title:'Subject-Verb Agreement',
  what:"Subject-verb agreement means the verb in a sentence must match its subject in number (singular/plural) and person (I/you/he-she-it/we/they).",
  undumbify:{plain:"If the 'doer' of the sentence is one thing, the verb needs its singular form; if the doer is more than one thing, the verb needs its plural form — they always have to match, like a matching pair of shoes.", analogy:"Think of subject and verb like dance partners — if one takes a 'singular' step, the other has to match with a singular step too; if one goes 'plural', so does the other. A mismatched pair looks (and sounds) instantly off.", example:"'The list of items is long.' (subject = 'list', singular, despite 'items' being plural right next to the verb) vs 'The items on the list are expensive.' (subject = 'items', plural).", examDef:"A singular subject takes a singular verb (is/was/has/goes); a plural subject takes a plural verb (are/were/have/go). Special rules apply for collective nouns, indefinite pronouns, phrases joined by 'and'/'or', and subjects separated from their verb by a phrase or clause."},
  rule:"1) Basic rule: Singular subject + singular verb ('He runs'). Plural subject + plural verb ('They run').\n2) Words joined by 'and' usually take a plural verb ('Rahul and Simran are here'), UNLESS they refer to a single unit ('Bread and butter is my favourite breakfast').\n3) Words joined by 'or'/'nor'/'either...or'/'neither...nor': the verb agrees with the subject CLOSEST to it ('Neither the teacher nor the students were late').\n4) Collective nouns (team, family, class, committee) usually take a SINGULAR verb when acting as one unit ('The team is playing well'), but can take a plural verb when members are acting individually ('The team are arguing among themselves').\n5) Indefinite pronouns: each, everyone, everybody, someone, nobody, anything → always singular ('Everyone is welcome'). Both, few, many, several → always plural.\n6) A phrase between subject and verb does NOT change the verb's agreement — ignore it and match the real subject ('The bouquet of flowers smells wonderful' — subject is 'bouquet', not 'flowers').\n7) Subjects like 'a number of' → plural verb ('A number of students were absent'); 'the number of' → singular verb ('The number of students was surprising').",
  examples:[
    {lvl:'easy', text:'Correct: My sister likes chocolate. (singular subject, singular verb)'},
    {lvl:'easy', text:'Correct: The dogs bark at strangers. (plural subject, plural verb)'},
    {lvl:'medium', text:'Correct: Neither of the boys was ready on time. ("Neither" is always singular)'},
    {lvl:'medium', text:'Correct: The bouquet of roses smells lovely. (ignore "roses"; the real subject is "bouquet")'},
    {lvl:'challenge', text:'Correct: The committee has decided to postpone the event. (acting as one unit → singular)'},
    {lvl:'challenge', text:'Correct: Neither the manager nor the employees were informed. (verb agrees with "employees", the nearer subject)'},
    {lvl:'challenge', text:'Correct: A number of complaints have been received. ("a number of" → plural)'},
    {lvl:'challenge', text:'Correct: Mathematics is my favourite subject. (subjects ending in "-ics" that name a single field of study take a singular verb)'}
  ],
  mistakes:[
    {wrong:'The list of items are on the table.', right:'The list of items is on the table.', why:'The subject is "list" (singular), not "items"; the prepositional phrase "of items" does not affect agreement.'},
    {wrong:'Each of the students have submitted the assignment.', right:'Each of the students has submitted the assignment.', why:'"Each" is always treated as singular, regardless of the plural noun that follows it.'},
    {wrong:'The team are winning every match this season. (when referring to the team as a single unit)', right:'The team is winning every match this season.', why:'When a collective noun acts as one single unit, it takes a singular verb; use a plural verb only when emphasising individual members acting separately.'},
    {wrong:'Neither the teacher nor the students was informed.', right:'Neither the teacher nor the students were informed.', why:'With "neither...nor", the verb must agree with the subject closest to it — here, the plural "students".'},
    {wrong:'The number of accidents have increased.', right:'The number of accidents has increased.', why:'"The number of" (a specific count) takes a singular verb; only "a number of" (meaning "several") takes a plural verb.'}
  ],
  practice:{
    fillBlanks:[
      {q:'Everybody in the class ______ (be) excited about the trip.', a:'is'},
      {q:'The scissors ______ (be) on the table. (a "pair" noun, always plural)', a:'are'},
      {q:'Either the manager or his assistants ______ (handle) the complaints.', a:'handle'},
      {q:'A number of students ______ (have) already registered for the event.', a:'have'}
    ],
    mcqs:[
      {q:'Choose the correct sentence:', options:['The news are very shocking.','The news is very shocking.','The news were very shocking.','The news being shocking.'], answer:1, explain:'"News" looks plural but is grammatically treated as an uncountable singular noun, so it takes a singular verb.'},
      {q:'Choose the correct sentence:', options:['Each of the answers are correct.','Each of the answers is correct.','Each of the answer is correct.','Each of the answers were correct.'], answer:1, explain:'"Each" is always singular, regardless of the plural noun phrase that follows it ("of the answers").'},
      {q:'Choose the correct sentence:', options:['My family are very supportive of me. (as one unit)','My family is very supportive of me.','My family be very supportive of me.','My family were very supportive of me. (as one unit)'], answer:1, explain:'When "family" acts as a single unit sharing one attitude, it takes a singular verb.'}
    ],
    identify:[
      {sentence:'Either of these two options works for me.', ask:'Identify the subject and explain why the verb "works" is correct.', answer:'The subject is "Either" (singular indefinite pronoun); "of these two options" is a prepositional phrase that does not affect agreement, so the singular verb "works" is correct.'},
      {sentence:'The jury have differing opinions on the verdict.', ask:'Identify the subject, and explain why a plural verb is used here.', answer:'The subject is "jury" (a collective noun); a plural verb ("have") is used here because the sentence emphasises the jury members\' individual, differing opinions rather than the jury acting as one unit.'}
    ],
    correct:[
      {wrong:'One of the students have lost their bag.', right:'One of the students has lost their bag.'},
      {wrong:'The information on these topics are useful.', right:'The information on these topics is useful.'}
    ],
    convert:[
      {from:'Singular subject', to:'Plural subject (adjust verb)', sentence:'The child plays in the park every evening.', answer:'The children play in the park every evening.'},
      {from:'"Neither...nor" — verb agreeing with nearer noun', to:'Rewritten with subjects swapped', sentence:'Neither the players nor the coach was happy with the result.', answer:'Neither the coach nor the players were happy with the result.'}
    ]
  },
  quickRevision:"Singular subject → singular verb; plural subject → plural verb. Ignore phrases between subject and verb. 'Each/every/either/neither/everyone/somebody' = always singular. Collective nouns (team, family, jury) = singular when acting as one unit, plural when members act individually. With 'or/nor', the verb agrees with the nearer subject. 'The number of' = singular; 'a number of' = plural."
});
CURRICULUM.grade8.writing.push({
  id:'article', title:'Article Writing',
  purpose:"To present facts, opinions, or ideas on a given topic for a wider audience — usually for a school magazine, newspaper, or newsletter — in an organised, engaging way.",
  undumbify:{plain:"An article is basically you explaining or arguing something to a whole crowd of strangers, not to one specific person — so it needs a catchy title, your name (by-line), and clear, organised paragraphs, but no 'Dear so-and-so' greeting.", analogy:"Think of it like writing a blog post that could be printed in a school magazine: you need a headline that makes someone stop scrolling, an opening that hooks them, a few organised points, and a strong closing thought — not a private note to one friend.", example:"A title like 'The Hidden Cost of Convenience: Our Plastic Problem', followed by a by-line, then 3 short paragraphs (problem → evidence → solution/opinion) — that structure alone earns format marks before an examiner even reads the content closely.", examDef:"An article is a piece of organised, informative or persuasive writing addressed to a general readership (not a named individual), comprising a title, an optional by-line, an introduction, a structured body of 2–3 paragraphs, and a conclusion offering a summary, opinion, or call to action."},
  format:['Title (catchy, relevant, centred, no full stop)','By-line ("By [Name]", right-aligned under the title)','Introduction (hook the reader, introduce the topic)','Body (2–3 well-organised paragraphs with main points, examples, evidence)','Conclusion (summary, opinion, or call to action)'],
  tone:"Depends on the topic — can be informative, persuasive, or reflective, but should always be clear and reader-friendly; avoid overly casual slang in formal topics.",
  usefulPhrases:['In today\'s world, ...','It is widely believed that...','One cannot deny the fact that...','To conclude / In conclusion...','This clearly shows that...'],
  mistakes:[
    {wrong:'Writing the article as a personal letter ("Dear friend, ...")', right:'Writing it as a general address to readers, with no salutation.', why:'Articles are meant for a general/public audience, not a single named recipient.'},
    {wrong:'Skipping the title or by-line.', right:'Always include a clear title and by-line at the top.', why:'These are compulsory format elements examiners specifically check for.'},
