  extracts:[
    {
      text:"LOUKA: I would marry the man I loved, which no other queen in Europe has the courage to do. Would you dare as much if you loved me? You dare not: you would marry a rich man's daughter because you would be afraid of what other people would say of you.\nSERGIUS: It is not so, by all the stars! You know that I love another woman. And you are jealous of her.\nLOUKA: I have no reason to be. She will never marry you now. The man I told you of has come back. She will marry the Swiss.\nSERGIUS: (recoiling) The Swiss! I will kill the Swiss!",
      qs:[
        {type:'Contextual', q:'What does Louka mean by "the man I told you of has come back"?', a:'Louka is referring to the fugitive soldier from Act I — Captain Bluntschli — who has now returned to the Petkoff house to return the coat and help with military logistics, and whom Louka believes Raina secretly prefers to Sergius.', why:'This connects directly back to the events and secret established in Unit 1 and referenced throughout Units 2-4.'},
        {type:'Literary Analysis', q:'What does Louka\'s hypothetical about being "the empress of Russia" reveal about her character and the play\'s themes?', a:'It reveals Louka\'s clear-eyed understanding that social rank, not personal courage, determines who is free to marry for love — the highest-ranking woman in Europe, she argues, could marry anyone she chose, while Sergius, despite his supposed heroism, would never risk his reputation to marry beneath his class. This directly connects the play\'s romantic themes to its interest in class and social hypocrisy.', why:'Louka uses a hypothetical extreme (an empress) to expose a real limitation in Sergius\'s courage that his soldierly reputation obscures.'},
        {type:'Inference', q:'Why does Sergius react so violently ("I will kill the Swiss!") to news that has nothing directly to do with him yet?', a:'His extreme reaction suggests wounded pride and possessiveness rather than genuine heartbreak — despite having just been flirting with Louka himself and expressing disillusionment with his engagement to Raina, the idea of losing her to another man triggers an immediate, almost theatrical response, consistent with his earlier established tendency toward dramatic, performed emotion.', why:'This reaction fits the pattern established throughout the play of Sergius performing intense feeling that doesn\'t always match his actual, more complicated behaviour.'}
      ]
    },
    {
      text:"SERGIUS: (despairingly) Oh, damnation! Mockery, mockery everywhere. (Louka again turns to go.) Louka! (She stops near the door.) Remember, you belong to me. If these hands ever touch you again, they shall touch my affianced bride.\nLOUKA: We shall see whether you dare keep your word. But take care. I will not wait long.",
      qs:[
        {type:'Meaning', q:'What exact promise does Sergius make to Louka in this extract?', a:'He promises that if he ever touches her again, that touch will make her his fiancée — effectively binding himself, in advance, to marry her should any future physical contact between them occur.', why:'This is stated directly and unambiguously in the extract.'},
        {type:'Literary Analysis', q:'Why is this oath significant for the play\'s plot structure, and how does Shaw later make use of it?', a:'This oath functions as a kind of dramatic time-bomb: Shaw plants a specific, almost legalistic condition early in the unit, then later has Sergius unknowingly trigger it himself by kissing Louka\'s offered hand during his apology, forcing him into an engagement he never consciously chose. This is a classic example of Shaw using a character\'s own impulsive words against them for both comic and thematic effect.', why:'Recognising planted conditions like this oath is key to understanding how Shaw builds his plot resolutions out of earlier, seemingly minor character choices.'},
        {type:'Inference', q:'What does Louka\'s calm response ("We shall see whether you dare keep your word") suggest about her intentions?', a:'It suggests that Louka has been strategically working toward exactly this outcome — rather than being swept up emotionally, she calmly notes the oath as something to be tested and held him to, revealing her as a shrewd, patient operator rather than simply a passive victim of Sergius\'s attention.', why:'Her measured, almost businesslike tone contrasts sharply with Sergius\'s emotional despair, hinting at her greater self-control and long-term ambition.'}
      ]
    },
    {
      text:"PETKOFF: Your photograph, with the inscription: \"Raina, to her Chocolate Cream Soldier—a souvenir.\" Come, do you think I don't see it all? (goes to Sergius, and slaps him on the shoulder) Sergius, you're the chocolate cream soldier, aren't you?\nSERGIUS: (starting up) I! A chocolate cream soldier! Certainly not.\nBLUNTSCHLI: (rising) It's all right, Major. I'm the chocolate cream soldier. (Petkoff and Sergius are equally astonished.) The gracious young lady saved my life by giving me chocolate creams when I was starving—shall I ever forget their flavour! My late friend Stolz told you the story at Peerot. I was the fugitive.",
      qs:[
        {type:'Contextual', q:'How does Petkoff come to know about the inscribed photograph in this extract?', a:'Petkoff had noticed something in his coat pocket earlier and, upon finding it now empty (because Raina had secretly removed it), assumes Catherine took it while mending the coat — but he had already glimpsed the photograph and its inscription before it went missing, which is why he already knows exactly what to accuse Sergius of.', why:'The extract follows Petkoff discovering the pocket is empty and immediately, confidently describing what had been in it.'},
        {type:'Literary Analysis', q:'What is the dramatic and comic effect of Bluntschli calmly volunteering the truth in this moment?', a:'After several units of careful, anxious secrecy from Raina and Catherine, Bluntschli\'s calm, matter-of-fact confession — offered without shame or hesitation, in the same tone he might report a military fact — creates a striking contrast with all the earlier tension around exposure, and produces comic relief precisely because the "disaster" everyone feared is defused not by more scheming, but by simple honesty.', why:'This moment resolves the dramatic tension built up since Unit 1 through Bluntschli\'s characteristic directness, reinforcing his role throughout the play as the voice of plain, unromantic truth.'},
        {type:'Inference', q:'What does the detail about "my late friend Stolz" reveal about how the secret nearly reached Sergius earlier in the play?', a:'It reveals that Sergius had, in fact, already heard a version of this exact story secondhand from Stolz back in Unit 2 — he simply had no idea the "patriotic young Bulgarian lady" in that story was Raina, since Stolz apparently never named her. This means the secret had already technically been told to Sergius once before, without him realising its significance.', why:'This connects back to the dramatic irony established in Unit 2, when Sergius mockingly retold this very story without knowing its personal significance.'}
      ]
    },
    {
      text:"BLUNTSCHLI: ...Why, look at the young lady and look at me. She, rich, young, beautiful, with her imagination full of fairy princes and noble natures and cavalry charges and goodness knows what! And I, a common-place Swiss soldier who hardly knows what a decent life is after fifteen years of barracks and battles. I'm thirty-four: I don't suppose the young lady is much over seventeen. All that adventure which was life or death to me, was only a schoolgirl's game to her—chocolate creams and hide and seek.\nRAINA: (deeply vexed) Next time, I hope you will know the difference between a schoolgirl of seventeen and a woman of twenty-three. (She snaps the photograph contemptuously from his hand; tears it across; and throws the pieces at his feet.)",
      qs:[
        {type:'Meaning', q:'What assumption does Bluntschli make about Raina in this extract, and how is he proven wrong?', a:'Bluntschli assumes Raina is a naive, romantic seventeen-year-old for whom their dangerous encounter was just a game — but Raina corrects him sharply, revealing she is actually twenty-three, and underlines her seriousness by destroying the photograph rather than letting it stand as evidence of a girlish crush.', why:'The extract directly shows both the false assumption and Raina\'s immediate correction and dramatic response.'},
        {type:'Literary Analysis', q:'What is the significance of Raina physically tearing up the photograph at this moment?', a:'Tearing the photograph is a symbolic act as much as a practical one: it destroys the last physical "evidence" of her earlier, more naive infatuation (the note calling him her "chocolate cream soldier"), signalling a decisive shift from performed, storybook romance towards a more grounded, adult assertion of her real feelings and age.', why:'This physical action mirrors the emotional development Raina has undergone across the whole play, moving away from idealised fantasy towards honest self-assertion.'},
        {type:'Inference', q:'Why might Bluntschli be so quick to insist Raina never took their "adventure" seriously, given his own evident interest in her?', a:'His insistence may function partly as self-protection: by convincing himself (and everyone else) that Raina\'s feelings were shallow, he avoids the vulnerability of openly admitting his own attachment to a much younger, wealthier woman who might reasonably reject a "common-place" soldier — a possibility that becomes far less certain once he learns her true age.', why:'His almost immediate reversal after learning she is twenty-three ("Twenty-three!! ... Hm!") suggests his earlier dismissiveness was not entirely sincere.'}
      ]
    },
    {
      text:"BLUNTSCHLI: (catching her hand quickly) Now, tell us who you did give them to.\nRAINA: (with a shy smile) To my chocolate cream soldier!\nBLUNTSCHLI: (with a boyish laugh of delight) That'll do. Thank you. (Looks at his watch and suddenly becomes businesslike.) Time's up, Major. ... Gracious ladies—good evening. (He makes them a military bow, and goes.)\nSERGIUS: What a man! What a man!",
      qs:[
        {type:'Contextual', q:'What question is Bluntschli pressing Raina to answer honestly in this extract?', a:'He is asking her to admit, without performance or pretence, who she truly gave her hand to kiss and her roof to shelter — pushing past her earlier claim that she was "not here to be sold to the highest bidder" to get a genuine answer about her real feelings.', why:'This follows Raina\'s attempt to deflect his proposal by pretending indifference to his wealth.'},
        {type:'Literary Analysis', q:'How does Bluntschli\'s abrupt shift from romantic delight to brisk military efficiency reflect the play\'s overall tone and message?', a:'This sudden shift — from a tender, "boyish laugh of delight" to immediately checking his watch and issuing military instructions — captures Shaw\'s consistent point throughout the play: genuine feeling and practical competence are not opposites. Bluntschli can be sincerely moved by Raina\'s honest answer and immediately return to efficient, unromantic business, showing that real character doesn\'t require constant theatrical performance.', why:'This final moment crystallises the contrast Shaw has built throughout the play between performed, theatrical "heroism" (Sergius) and quiet, practical competence (Bluntschli).'},
        {type:'Inference', q:'What does Sergius\'s closing exclamation, "What a man! What a man!", suggest about how his own values have shifted by the end of the play?', a:'Coming from a character who began the play associated with dramatic, romantic ideals of heroism, this admiring exclamation directed at the plain-spoken, practical Bluntschli suggests that Sergius, too, has come to recognise and respect a different, less theatrical kind of admirable character — reinforcing the play\'s final judgement in favour of Bluntschli\'s realism over Sergius\'s earlier romantic posturing.', why:'This final line gives the play\'s last word to a character effectively endorsing the anti-romantic values Bluntschli has represented since Act I.'}
      ]
    }
  ],
  shortAnswers:[
    {q:'Why does Sergius challenge Bluntschli to a duel, and how does Bluntschli respond to the challenge?', a:'Sergius challenges Bluntschli because he believes Bluntschli has been courting Raina. Bluntschli calmly accepts, but insists on fighting on foot rather than horseback and mentions he has often worked as a sword instructor, making clear — without directly saying so — that he has no real intention of hurting Sergius and sees little actual danger in the encounter.', points:['Sergius challenges Bluntschli, believing he is courting Raina','Bluntschli calmly accepts but chooses foot combat over horseback','His mention of sword-instructor experience implies the "duel" is low-risk'], why:'This shows Bluntschli\'s characteristic calm, practical approach to a situation Sergius treats with high drama.'},
    {q:'What oath does Sergius make to Louka, and what makes it significant later in the unit?', a:'Sergius swears that if his hands ever touch Louka again, they shall touch his "affianced bride." This becomes significant when, apologising to Louka later in the unit, he kisses her offered hand — unknowingly triggering his own earlier oath and binding himself to marry her.', points:['Oath: touching Louka again = she becomes his fiancée','Later, he kisses her hand while apologising, unknowingly triggering it','This binds him to marry Louka rather than Raina'], why:'This shows how Shaw uses an earlier plot detail to engineer the play\'s resolution.'},
    {q:'How is Bluntschli finally exposed as "the chocolate cream soldier", and what does this reveal about how the secret finally comes out?', a:'While helping her father into his mended coat, Raina secretly removes the hidden photograph, but Petkoff had already noticed something in the pocket earlier; when he finds it missing, he reveals he already knows about the photograph\'s inscription and wrongly accuses Sergius. Bluntschli then calmly volunteers the truth himself. This shows that the secret is finally exposed not through scheming or accident alone, but through Bluntschli\'s own straightforward honesty once cornered.', points:['Petkoff had already noticed the photo in the pocket before Raina removed it','He wrongly accuses Sergius of being the "chocolate cream soldier"','Bluntschli calmly admits the truth himself rather than letting the accusation stand'], why:'This is the payoff of the secret established across all five units, resolved through honesty rather than further deception.'},
    {q:'Why does Sergius agree to marry Louka, and how does this resolve the earlier tension between them?', a:'Sergius agrees to marry Louka because his earlier oath — that touching her again would make her his fiancée — is triggered when he kisses her hand while apologising for having insulted her. This resolves the earlier tension from Unit 3, where Louka accused both Sergius and Raina of hypocrisy in their "higher love," since Sergius\'s real feelings (and his own words) are finally held to account rather than dismissed.', points:['His earlier oath is triggered by kissing her hand in apology','This binds him to marry Louka instead of Raina','Resolves Louka\'s Unit 3 accusation that Sergius was being hypocritical'], why:'This ties together plot threads about Sergius\'s hypocrisy that Shaw planted across several earlier units.'},
    {q:'Why does Bluntschli initially claim Raina never took their "adventure" seriously, and how does she prove him wrong?', a:'Bluntschli assumes Raina is a naive seventeen-year-old for whom their dangerous encounter was just an exciting game, using the photograph\'s "souvenir" inscription as proof. Raina proves him wrong by revealing she is actually twenty-three, and by tearing up the photograph — destroying the "evidence" of her earlier, more girlish behaviour and demonstrating she now wants to be taken seriously.', points:['Bluntschli assumes Raina is 17 and was not serious about him','He uses the photograph inscription as "proof"','Raina reveals she is 23 and tears up the photograph to prove her seriousness'], why:'This is a key turning point that shifts Bluntschli from dismissive to genuinely interested in proposing.'},
    {q:'How does Bluntschli win Petkoff\'s approval for marrying Raina, and what does this reveal about Shaw\'s satirical purpose?', a:'When Petkoff objects that Raina is used to comfort (citing Sergius\'s twenty horses), Bluntschli responds by listing his own vastly greater fortune — hundreds of horses and carriages, thousands of tablecloths and cutlery sets, hundreds of servants, and multiple grand properties — winning Petkoff\'s approval through sheer material wealth rather than romantic gestures. This reveals Shaw\'s satirical point that even a supposedly "unromantic," practical marriage proposal ultimately succeeds through the same materialistic, status-conscious reasoning the play has mocked throughout (echoing Catherine and Petkoff\'s earlier obsession with appearing "civilised" and wealthy).', points:['Bluntschli wins approval by listing his own greater wealth/possessions','Contrasts with more romantic or heroic ways to win approval','Reveals Shaw\'s satire of how practical, material concerns actually decide "romantic" outcomes'], why:'This shows Shaw maintaining his satirical tone even in the play\'s happy resolution, rather than abandoning it for pure romance.'}
  ],
  longAnswers:[
    {q:'Discuss how Shaw resolves the play\'s central romantic triangle (Raina, Sergius, Bluntschli, and Louka), and what this resolution suggests about his critique of romantic idealism versus practical realism.', a:"By the end of \"Arms and the Man\", Shaw resolves his central romantic entanglement in a way that consistently favours honesty and practicality over performed, idealised romance — reinforcing the argument the play has built since Act I.\n\nSergius and Louka's pairing is the clearest example of this pattern. Rather than being brought together by any grand romantic gesture, their engagement is the direct, almost accidental result of a specific, binding oath Sergius makes in a moment of despair, which he then unknowingly triggers by kissing Louka's hand during an unrelated apology. Their relationship, in other words, is resolved through a concrete, almost legalistic mechanism rather than idealised destiny — fittingly, since Louka has spent the play exposing exactly this gap between performed devotion and real feeling in both Sergius and Raina.\n\nRaina and Bluntschli's resolution follows a similar logic, though inverted. Where Sergius is bound by his own careless words, Bluntschli is initially reluctant to believe Raina's feelings are genuine at all, dismissing their entire Act I encounter as a \"schoolgirl's game.\" It is only when Raina forces him to reconsider — first by revealing her true age, then by tearing up the photograph that represented her earlier, more naive infatuation — that a more honest, adult connection between them becomes possible. Bluntschli's own proposal, when it comes, is delivered in the same brisk, practical tone he uses for troop logistics, and his eventual approval from Petkoff is won not through romantic gesture but through an exhaustive, almost comic recitation of his real wealth.\n\nTaken together, these two resolutions suggest that Shaw is not simply rejecting romance altogether, but redefining what a genuine, lasting connection actually requires: honesty (Raina finally admitting her age and her real feelings), accountability (Sergius held to his own words), and clear-eyed practicality (Bluntschli's wealth and competence, not performed heroism, winning Petkoff's approval). The play's happy ending is achieved not by rewarding its characters' earlier idealism, but by systematically replacing it with something more grounded — completing the anti-romantic argument Shaw has built since the very first unit.", structure:"Introduction (both pairings resolved through honesty/practicality rather than idealised romance) → Sergius and Louka: resolution via a concrete oath, not romantic destiny → Raina and Bluntschli: resolution via honesty about age and real feeling → Bluntschli's approval from Petkoff won through practical wealth, not romantic gesture → Conclusion on what this suggests about Shaw's overall argument.", points:["Explain how Sergius and Louka's engagement resolves through a specific plot mechanism (the oath), not idealised love","Explain how Raina and Bluntschli's connection becomes possible only once idealism (her performed 'girlishness') is replaced by honesty","Discuss Bluntschli's practical, wealth-based approval from Petkoff as consistent with the play's earlier satire","Conclude with a clear statement of what this resolution suggests about Shaw's overall message"]},
    {q:'Examine the significance of the play\'s final scene — Bluntschli\'s list of possessions and his brisk, business-like exit — for understanding Shaw\'s overall satirical purpose in "Arms and the Man."', a:"The play's closing moments — Bluntschli's exhaustive recitation of his wealth, followed by his brisk, businesslike exit — function as far more than comic flourish; they crystallise the satirical argument Shaw has been building across all five units.\n\nBluntschli's list of possessions (horses, carriages, tablecloths, servants, medals, and more) is deliberately excessive and almost absurd in its detail, delivered in the same flat, efficient tone he has used throughout the play for military logistics. This tonal consistency is the point: Shaw refuses to let even the play's most \"romantic\" moment — a marriage proposal — escape the same practical, unglamorous register that has undercut every performance of heroism or idealism since Act I. Rather than winning Raina and her family through grand romantic gesture, Bluntschli wins them through the same qualities that have defined him from the beginning: competence, honesty, and plain-spoken practicality, now revealed to include considerable, if previously hidden, wealth.\n\nHis final exit reinforces this same point. Having just secured an engagement that would, in a conventional romantic drama, mark the emotional climax of the story, Bluntschli instead immediately checks his watch, issues Sergius fresh military instructions, and departs with a formal bow — treating his own romantic triumph with the same brisk efficiency as any other completed task. This is Shaw's final, clearest statement that genuine competence and quiet integrity do not require theatrical performance to be recognised or rewarded; indeed, the play suggests, they are more reliable and more admirable precisely because they don't need performing.\n\nSergius's closing exclamation — \"What a man! What a man!\" — seals this message. Coming from the character who began the play as the embodiment of romantic, performed heroism, his genuine admiration for Bluntschli's plain, practical exit gives the play's very last word to an endorsement of exactly the anti-romantic, realistic values Bluntschli has represented from his first appearance climbing through Raina's window. In this way, the play's ending is not a departure from its satirical purpose, but its fullest and most concentrated expression.", structure:"Introduction (the ending concentrates the play's satirical argument rather than abandoning it for pure romance) → Bluntschli's list of possessions: excessive, in the same practical tone as his military logistics → His brisk exit: treating romantic triumph with the same efficiency as any other task → Sergius's closing line as an endorsement of Bluntschli's values → Conclusion on how this crystallises Shaw's overall satirical purpose.", points:["Analyse the tonal consistency between Bluntschli's wealth list and his earlier military efficiency","Explain the significance of his brisk, businesslike exit immediately after the proposal succeeds","Discuss Sergius's closing exclamation as an endorsement of Bluntschli's anti-romantic values","Conclude with a clear statement of how the ending completes the play's overall satirical argument"]}
  ]
}

========================================================= */
let currentRoute = {view:'home'};
let quizState = null;

const NAV_ITEMS = [
  {key:'home', label:'Home', icon:'🏠'},
  {key:'literature', label:'Literature', icon:'📖'},
  {key:'grammar', label:'Grammar', icon:'🧠'},
  {key:'writing', label:'Writing', icon:'✍️'},
  {key:'supplementary', label:'Arms and the Man', icon:'📕'},
  {key:'practice', label:'Practice / Quiz', icon:'🎯'},
  {key:'progress', label:'My Progress', icon:'📊'}
];

function renderNav(){
  const nav = document.getElementById('primaryNav');
  nav.innerHTML = NAV_ITEMS.map(it=>`
    <button class="nav-item ${currentRoute.view===it.key?'active':''}" onclick="go('${it.key}')">
      <span class="ic">${it.icon}</span>${it.label}
    </button>`).join('');
}

function go(view, params){
  if(quizState && quizState.timerInterval){ clearInterval(quizState.timerInterval); quizState.timerInterval = null; }
  currentRoute = Object.assign({view}, params||{});
  renderNav();
  render();
  document.getElementById('main').scrollTop = 0;
  window.scrollTo(0,0);
  if(document.getElementById('sidebar').classList.contains('open')) toggleSidebar();
}
function toggleSidebar(){
  document.getElementById('sidebar').classList.toggle('open');
  document.getElementById('overlay').classList.toggle('show');
}
function toggleTheme(){
  const body = document.body;
  const dark = body.getAttribute('data-theme')==='dark';
  body.setAttribute('data-theme', dark ? 'light' : 'dark');
  document.getElementById('themeLabel').textContent = dark ? '🌞 Light mode' : '🌙 Dark mode';
  storeSet('theme', dark ? 'light' : 'dark');
}

function esc(s){ return (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;'); }
function nl(s){ return esc(s).replace(/\n\n/g,'</p><p>').replace(/\n/g,'<br>'); }

function render(){
  const main = document.getElementById('main');
  switch(currentRoute.view){
    case 'home': main.innerHTML = renderHome(); break;
    case 'literature': main.innerHTML = currentRoute.id ? renderLessonPage(currentRoute.id) : renderLiteratureList(); break;
    case 'grammar': main.innerHTML = currentRoute.id ? renderGrammarPage(currentRoute.id) : renderGrammarList(); break;
    case 'writing': main.innerHTML = currentRoute.id ? renderWritingPage(currentRoute.id) : renderWritingList(); break;
    case 'supplementary': main.innerHTML = currentRoute.id ? renderSupplementaryUnitPage(currentRoute.id) : renderSupplementaryList(); break;
    case 'practice': main.innerHTML = renderPracticeHome(); break;
    case 'progress': main.innerHTML = renderProgressPage(); break;
    default: main.innerHTML = renderHome();
  }
  attachAccordionHandlers();
}

function renderLessonPage(id){
  const l = CURRICULUM.grade8.literature.find(x=>x.id===id);
  if(!l) return renderLiteratureList();
  const section = currentRoute.section || 'explanation';
  markViewed(l.id, section);

  const chips = LIT_SECTIONS.map(s=>`<button class="chip ${section===s.key?'active':''}" onclick="go('literature',{id:'${l.id}', section:'${s.key}'})">${s.label}</button>`).join('');

  let body = '';
  if(l.status==='pending'){
    body = `<div class="pending-note"><b>Content needs your textbook to be completed accurately.</b> ${esc(l.note)}</div>
    <div class="card" style="margin-top:16px; cursor:default;" onclick="event.stopPropagation()">
      <h3>What's verified so far</h3>
      <p>${nl(l.overview)}</p>
    </div>`;
  } else {
    if(section==='explanation') body = renderExplanationSection(l);
    else if(section==='wordIndex') body = renderWordIndexSection(l);
    else if(section==='extracts') body = renderExtractsSection(l);
    else if(section==='shortAnswers') body = renderQAListSection(l.shortAnswers, 'Short Answer');
    else if(section==='longAnswers') body = renderLongAnswersSection(l.longAnswers);
  }

  return `
  <div class="page-head">
    <div class="eyebrow"><span class="dot"></span><a onclick="go('literature')" style="cursor:pointer;">Literature</a> / ${esc(l.title)}</div>
    <h1>${esc(l.title)}</h1>
    ${l.author && l.author!=='—' ? `<p style="color:var(--ink-soft); margin:0;">${esc(l.author)}</p>`:''}
    ${l.status==='complete' ? `<button class="btn btn-undumbify" style="margin-top:12px;" onclick="openUndumbify('${l.id}')">⭐ Un-Dumbify This</button>`:''}
  </div>
  ${l.status==='complete' ? `<div class="section-chips">${chips}</div>` : ''}
  <div>${body}</div>`;
}

function renderExplanationSection(l){
  const e = l.explanation;
  let html = `<div class="undumbified-box"><div class="tag">Un-Dumbified</div><p>${nl(e.undumbified)}</p></div>`;
  e.sections.forEach(s=>{ html += `<div class="acc"><div class="acc-head" onclick="toggleAcc(this)"><h4>${esc(s.h)}</h4><span class="chev">▾</span></div><div class="acc-body"><div class="acc-body-inner"><p>${nl(s.p)}</p></div></div></div>`; });

  if(l.type==='poem'){
    // stanza breakdown if present in extracts text via explanation
  }
  if(e.poemMeta){
    const m = e.poemMeta;
    html += `<div class="acc"><div class="acc-head" onclick="toggleAcc(this)"><h4>Central Idea, Tone &amp; Devices</h4><span class="chev">▾</span></div><div class="acc-body"><div class="acc-body-inner">
      <p><b>Central idea:</b> ${esc(m.centralIdea)}</p>
      <p><b>Tone:</b> ${esc(m.tone)} &nbsp; <b>Mood:</b> ${esc(m.mood)}</p>
      <p><b>Rhyme scheme:</b> ${esc(m.rhymeScheme)}</p>
      <p><b>Figures of speech:</b></p>
      ${m.devices.map(d=>`<div class="word-card"><div class="w">${esc(d.name)}</div><div class="meanings">${esc(d.ex)}</div></div>`).join('')}
      <p style="margin-top:10px;"><b>Important phrases:</b></p>
      ${m.phrases.map(p=>`<div class="word-card"><div class="w">"${esc(p.phrase)}"</div><div class="meanings">${esc(p.meaning)}</div></div>`).join('')}
    </div></div></div>`;
  }
  html += `<div class="revision-box"><h4>⚡ 30-Second Revision</h4><p>${esc(e.revision)}</p></div>`;
  return html;
}

          ${i<steps.length-1?`<button class="btn btn-primary" onclick="byaStep('${uid}',${i+1},${steps.length})">Next</button>`:`<button class="btn btn-primary" onclick="byaFinish('${uid}',${steps.length})">Assemble My Answer</button>`}
        </div>
      </div>`).join('')}
    <div id="${uid}_result" style="margin-top:14px;"></div>
  </div>`;

function byaStep(uid, idx, total){
  for(let i=0;i<total;i++){
    document.getElementById(`${uid}_step${i}`).classList.toggle('active', i===idx);
    document.getElementById(`${uid}_dot${i}`).classList.toggle('active', i===idx);
  }
}
function byaFinish(uid, total){
  let combined = '';
  for(let i=0;i<total;i++){
    const val = document.querySelector(`#${uid}_step${i} textarea`).value.trim();
    if(val) combined += val + '\n\n';
  }
  document.getElementById(`${uid}_result`).innerHTML = `<div class="wframe"><b>Your assembled answer:</b><br><br>${nl(combined || 'Fill in the steps above to see your answer here.')}</div>`;
}

const FUN_CORRECT = ["✅ Nailed it!","🎯 Bullseye!","🔥 You're on fire!","💪 Too easy for you!","🌟 Yes — exactly right!","✅ Boom. Correct.","🏆 Nice one!"];

const STREAK_MSGS = {3:'🔥 3 in a row!',5:'🔥🔥 5-streak — unstoppable!',8:'🔥🔥🔥 8-streak?! Incredible.',10:'👑 10-streak legend!',15:'🚀 15 straight?! Are you even human?'};

function escAttr(s){ return esc(s).replace(/"/g,'&quot;'); }

function buildVocabMcq(w, allMeanings){
  let distractors = allMeanings.filter(m=>m!==w.simple);
  for(let i=distractors.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [distractors[i],distractors[j]]=[distractors[j],distractors[i]]; }
  const picks = []; const seen = new Set();
  for(const d of distractors){ if(!seen.has(d)){ seen.add(d); picks.push(d); } if(picks.length===3) break; }
  while(picks.length<3) picks.push('None of the above');
  const options = [w.simple, ...picks];
  const order = options.map((_,i)=>i);
  for(let i=order.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [order[i],order[j]]=[order[j],order[i]]; }
  return { options: order.map(i=>options[i]), answer: order.indexOf(0) };
}

function buildQuizPool(area, difficulty, count, vocabFormat){
  let pool = [];
  const pushMcqFromGrammar = (g)=>{
    g.practice.mcqs.forEach(m=>pool.push({type:'mcq', area:'Grammar: '+g.title, difficulty:'medium', q:m.q, options:m.options, answer:m.answer, explain:m.explain}));
  };
  if(area==='grammar'||area==='mixed'){ CURRICULUM.grade8.grammar.forEach(pushMcqFromGrammar); }
  if(area==='literature'||area==='mixed'){
    CURRICULUM.grade8.literature.filter(l=>l.status==='complete').forEach(l=>{
      l.extracts.forEach(ex=>{
        ex.qs.forEach(q=>{
          pool.push({type:'short', area:'Literature: '+l.title, difficulty: q.type==='Inference'?'challenge':(q.type==='Contextual'?'easy':'medium'), q:q.q, a:q.a, why:q.why});
        });
      });
    });
  }
  if(area==='vocabulary'||area==='mixed'){
    const completeLit = CURRICULUM.grade8.literature.filter(l=>l.status==='complete');
    const allMeanings = [];
    completeLit.forEach(l=>l.wordIndex.forEach(w=>allMeanings.push(w.simple)));
    completeLit.forEach(l=>{
      l.wordIndex.forEach(w=>{
        if(vocabFormat==='type'){
          pool.push({type:'vocab', area:'Vocabulary: '+l.title, difficulty:'easy', word:w.word, simple:w.simple, context:w.context});
        } else {
          const {options, answer} = buildVocabMcq(w, allMeanings);
          pool.push({type:'mcq', area:'Vocabulary: '+l.title, difficulty:'easy', q:`What does "${w.word}" mean here: "${w.context}"`, options, answer, explain:`"${w.word}" means: ${w.simple}`});
        }
      });
    });
  }
  if(difficulty && difficulty!=='all'){ pool = pool.filter(p=>p.difficulty===difficulty); }
  // shuffle
  for(let i=pool.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [pool[i],pool[j]]=[pool[j],pool[i]]; }
  if(count==='all' || !count) return pool;
  return pool.slice(0, Math.min(count, pool.length));
}

function startQuiz(){
  const area = document.getElementById('quizArea').value;
  const difficulty = document.getElementById('quizDifficulty').value;
  const lengthRaw = document.getElementById('quizLength').value;
  const count = lengthRaw==='all' ? 'all' : parseInt(lengthRaw,10);
  const vocabFormat = document.getElementById('quizVocabFormat').value;
  const speedMode = document.getElementById('quizSpeedMode').checked;
  const pool = buildQuizPool(area, difficulty, count, vocabFormat);
  if(pool.length===0){ document.getElementById('quizArea_container').innerHTML = `<div class="pending-note">No questions match that combination yet — try "Mixed Practice" with "All difficulties".</div>`; return; }
  quizState = {pool, idx:0, score:0, wrongTags:[], streak:0, bestStreak:0, results:[], speedMode, fifty:2, timerInterval:null, timeLeft:0};
  renderQuizQuestion();
}

function quizDots(){
  return `<div class="quiz-dots">${quizState.pool.map((_,i)=>{
    let cls='quiz-dot';
    if(i===quizState.idx) cls+=' current';
    else if(quizState.results[i]===true) cls+=' correct';
    else if(quizState.results[i]===false) cls+=' wrong';
    return `<div class="${cls}"></div>`;
  }).join('')}</div>`;
}

function quizHud(){
  const streakClass = quizState.streak>=3 ? 'hud-chip streak hot' : 'hud-chip streak';
  const fire = quizState.streak>=3 ? '🔥'.repeat(Math.min(3, Math.floor(quizState.streak/3))) : '';
  return `<div class="quiz-hud">
    <span class="hud-chip">⭐ ${quizState.score} / ${quizState.pool.length}</span>
    <span class="${streakClass}">${fire?fire+' ':''}Streak: ${quizState.streak}</span>
    <span class="hud-chip">🏅 Best: ${quizState.bestStreak}</span>
  </div>`;
}

function startTimer(){
  if(quizState.timerInterval) clearInterval(quizState.timerInterval);
  quizState.timeLeft = 20;
  const fill = document.getElementById('timerFill');
  if(!fill) return;
  quizState.timerInterval = setInterval(()=>{
    quizState.timeLeft--;
    const f = document.getElementById('timerFill');
    if(!f){ clearInterval(quizState.timerInterval); return; }
    f.style.width = (quizState.timeLeft/20*100)+'%';
    f.style.background = quizState.timeLeft<=5 ? 'var(--coral)' : (quizState.timeLeft<=10 ? 'var(--highlight)' : 'var(--teal)');
    if(quizState.timeLeft<=0){ clearInterval(quizState.timerInterval); quizState.timerInterval=null; timeUp(); }
  }, 1000);
}

function timeUp(){
  const item = quizState.pool[quizState.idx];
  if(item.type==='mcq'){
    document.querySelectorAll('.mcq-opt').forEach(b=>b.onclick=null);
    registerAnswer(false);
    const fb = document.querySelector('.feedback-slot');
    if(fb) fb.innerHTML = `<div class="feedback-box wrong">⏰ Time's up! ${esc(item.explain)}</div><button class="btn btn-primary" style="margin-top:10px;" onclick="nextQuizQ()">Next</button>`;
  } else {
    const btn = document.querySelector('.reveal-btn');
    if(btn) answerReveal(btn);
  }
}

function renderQuizQuestion(){
  if(quizState.timerInterval){ clearInterval(quizState.timerInterval); quizState.timerInterval = null; }
  const c = document.getElementById('quizArea_container');
  if(quizState.idx >= quizState.pool.length){
    PROGRESS.quizAttempts.push({area:'session', score:quizState.score, total:quizState.pool.length, date:new Date().toISOString()});
    quizState.wrongTags.forEach(t=>{ PROGRESS.weakAreas[t] = (PROGRESS.weakAreas[t]||0)+1; });
    saveProgress(); updateMiniProgress();
    const pct = Math.round((quizState.score/quizState.pool.length)*100);
    let rank;
    if(pct>=90) rank = {title:'Un-Dumbifier Legend', emoji:'👑'};
    else if(pct>=75) rank = {title:'Sharp Reader', emoji:'🧠'};
    else if(pct>=60) rank = {title:'Solid Effort', emoji:'📈'};
    else if(pct>=40) rank = {title:'Getting There', emoji:'🌱'};
    else rank = {title:'Keep Practising', emoji:'💪'};
    c.innerHTML = `<div class="quiz-card" style="text-align:center;">
      <div style="font-size:44px;">${rank.emoji}</div>
      <div class="result-rank">${rank.title}</div>
      <p style="color:var(--ink-soft);">Session complete! Here's how it went:</p>
      <div class="result-stats">
        <div class="result-stat"><div class="n">${quizState.score}/${quizState.pool.length}</div><div class="l">Score</div></div>
        <div class="result-stat"><div class="n">${pct}%</div><div class="l">Accuracy</div></div>
        <div class="result-stat"><div class="n">${quizState.bestStreak}🔥</div><div class="l">Best streak</div></div>
      </div>
      <div style="display:flex; gap:10px; justify-content:center; flex-wrap:wrap;">
        <button class="btn btn-primary" onclick="startQuiz()">🔁 Try Again</button>
        <button class="btn btn-ghost" onclick="go('practice')">⚙️ Change Settings</button>
        <button class="btn btn-ghost" onclick="go('progress')">📊 View Progress</button>
      </div>
    </div>`;
    return;
  }
  const item = quizState.pool[quizState.idx];
  const pct = Math.round((quizState.idx/quizState.pool.length)*100);
  const diffClass = 'diff-'+item.difficulty;

  let body = '';
  if(item.type==='mcq'){
    const fiftyDisabled = quizState.fifty<=0 ? 'disabled' : '';
    body = `<p class="q" style="font-size:16px; font-weight:600;">${esc(item.q)}</p>
    <div class="lifeline-row"><button class="lifeline-btn" ${fiftyDisabled} onclick="useFifty(this)">🍀 50/50 (${quizState.fifty} left)</button></div>
    ${item.options.map((o,j)=>`<button class="mcq-opt" data-idx="${j}" data-correct="${j===item.answer?'1':'0'}" data-explain="${escAttr(item.explain)}" onclick="answerMcq(this)">${esc(o)}</button>`).join('')}
    <div class="feedback-slot"></div>`;
  } else if(item.type==='short'){
    body = `<p class="q" style="font-size:16px; font-weight:600;">${esc(item.q)}</p>
    <textarea id="typeAnswerBox" class="type-answer" data-correct="${escAttr(item.a)}" placeholder="Type your answer here (optional) — then check it, or just reveal the model answer below." rows="3"></textarea>
    <div class="lifeline-row"><button class="btn btn-ghost" onclick="checkTyped(this)">✅ Check my answer</button></div>
    <button class="reveal-btn" onclick="answerReveal(this)">Reveal answer &amp; self-check</button>
    <div class="answer-box"><p>${esc(item.a)}</p><div class="why">💡 ${esc(item.why)}</div>
      <div style="margin-top:10px; display:flex; gap:8px;">
        <button class="btn btn-primary" onclick="selfScore(true)">I got it right</button>
        <button class="btn btn-ghost" onclick="selfScore(false)">I got it wrong</button>
      </div>
    </div>`;
  } else if(item.type==='vocab'){
    body = `<p class="q" style="font-size:16px; font-weight:600;">What does "${esc(item.word)}" mean in context?</p>
    <p style="color:var(--ink-soft); font-size:13px; font-style:italic;">"${esc(item.context)}"</p>
    <textarea id="typeAnswerBox" class="type-answer" data-correct="${escAttr(item.simple)}" placeholder="Type your definition..." rows="2"></textarea>
    <div class="lifeline-row"><button class="btn btn-ghost" onclick="checkTyped(this)">✅ Check my answer</button></div>
    <button class="reveal-btn" onclick="answerReveal(this)">Reveal</button>
    <div class="answer-box"><p><b>Simple meaning:</b> ${esc(item.simple)}</p><p><b>In context:</b> ${esc(item.context)}</p>
      <div style="margin-top:10px; display:flex; gap:8px;">
        <button class="btn btn-primary" onclick="selfScore(true)">I knew it</button>
        <button class="btn btn-ghost" onclick="selfScore(false)">I didn't know it</button>
      </div>
    </div>`;
  }

  c.innerHTML = `
  <div class="quiz-card">
    ${quizHud()}
    ${quizDots()}
    <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:8px;">
      <span class="mono" style="font-size:11.5px; color:var(--ink-soft);">${esc(item.area)}</span>
      <span class="diff-tag ${diffClass}">${esc(item.difficulty)}</span>
    </div>
    <div class="quiz-progress-bar"><div class="quiz-progress-fill" style="width:${pct}%"></div></div>
    ${quizState.speedMode ? `<div class="timer-wrap"><div class="timer-fill" id="timerFill" style="width:100%"></div></div>` : ''}
    ${body}
  </div>`;
  if(quizState.speedMode) startTimer();
}

function useFifty(btn){
  if(quizState.fifty<=0) return;
  const item = quizState.pool[quizState.idx];
  const opts = Array.from(document.querySelectorAll('.mcq-opt'));
  const wrongIdxs = opts.map((o,i)=>i).filter(i=>i!==item.answer);
  for(let i=wrongIdxs.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [wrongIdxs[i],wrongIdxs[j]]=[wrongIdxs[j],wrongIdxs[i]]; }
  wrongIdxs.slice(0,2).forEach(i=>{ opts[i].style.visibility='hidden'; });
  quizState.fifty--;
  btn.textContent = `🍀 50/50 (${quizState.fifty} left)`;
  if(quizState.fifty<=0) btn.disabled = true;
}

function registerAnswer(correct){
  quizState.results[quizState.idx] = correct;
  if(correct){
    quizState.score++;
    quizState.streak++;
    if(quizState.streak > quizState.bestStreak) quizState.bestStreak = quizState.streak;
    if(STREAK_MSGS[quizState.streak]) showStreakToast(quizState.streak);
  } else {
    quizState.streak = 0;
    const item = quizState.pool[quizState.idx];
    quizState.wrongTags.push(item.area);
  }
}

function answerMcq(btn){
  const correct = btn.dataset.correct==='1';
  const explain = btn.dataset.explain;
  if(quizState.timerInterval){ clearInterval(quizState.timerInterval); quizState.timerInterval = null; }
  document.querySelectorAll('.mcq-opt').forEach(b=>{ b.onclick=null; b.style.visibility='visible'; });
  btn.classList.add(correct?'correct':'wrong');
  registerAnswer(correct);
  document.querySelector('.feedback-slot').innerHTML = `<div class="feedback-box ${correct?'correct':'wrong'}">${correct?pickFun(FUN_CORRECT):pickFun(FUN_WRONG)} ${esc(explain)}</div><button class="btn btn-primary" style="margin-top:10px;" onclick="nextQuizQ()">Next</button>`;
}
function answerReveal(btn){ btn.nextElementSibling.classList.add('show'); btn.style.display='none'; }
function checkTyped(btn){
  const ta = document.getElementById('typeAnswerBox');
  if(!ta) return;
  const typed = (ta.value||'').toLowerCase();
  const correctText = ta.dataset.correct || '';
  const norm = s => (s||'').toLowerCase().replace(/[^a-z0-9\s]/g,' ').split(/\s+/).filter(w=>w.length>3);
  const typedWords = new Set(norm(typed));
  const correctWords = new Set(norm(correctText));
  let overlap = 0; correctWords.forEach(w=>{ if(typedWords.has(w)) overlap++; });
  const ratio = correctWords.size ? overlap/correctWords.size : 0;
  let msg, cls;
  if(typed.trim().length===0){ msg='✏️ Type an answer first — or just reveal the model answer below.'; cls='wrong'; }
  else if(ratio>=0.35){ msg='👍 Nice — you hit several of the key ideas! Compare with the full answer below.'; cls='correct'; }
  else if(ratio>=0.15){ msg='🤔 Partial match — you\'re in the right area. See the full answer below.'; cls='wrong'; }
  else { msg='💭 Worth comparing closely — check the model answer below.'; cls='wrong'; }
  const old = btn.parentElement.querySelector('.type-check-fb'); if(old) old.remove();
  btn.insertAdjacentHTML('afterend', `<div class="feedback-box type-check-fb ${cls}" style="margin-top:8px;">${msg}</div>`);
  const card = btn.closest('.quiz-card');
  const revealBtn = card ? card.querySelector('.reveal-btn') : null;
  if(revealBtn && revealBtn.style.display!=='none') answerReveal(revealBtn);
}
function selfScore(correct){
  if(quizState.timerInterval){ clearInterval(quizState.timerInterval); quizState.timerInterval = null; }
  registerAnswer(correct);
  nextQuizQ();
}
function nextQuizQ(){ quizState.idx++; renderQuizQuestion(); }

/* ---------- Progress ---------- */
function renderProgressPage(){
  const totalLessons = CURRICULUM.grade8.literature.length;
  const viewedLessons = Object.keys(PROGRESS.lessonsViewed).length;
  const totalGrammar = CURRICULUM.grade8.grammar.length;
  const viewedGrammar = Object.keys(PROGRESS.grammarViewed).length;
  const totalWriting = CURRICULUM.grade8.writing.length;
  const viewedWriting = Object.keys(PROGRESS.writingViewed).length;
  const attempts = PROGRESS.quizAttempts;
  const avgScore = attempts.length ? Math.round(100*attempts.reduce((a,b)=>a+b.score/b.total,0)/attempts.length) : 0;
  const weak = Object.entries(PROGRESS.weakAreas).sort((a,b)=>b[1]-a[1]).slice(0,5);

  function sectionCoverage(id, section){ return PROGRESS.lessonsViewed[id] && PROGRESS.lessonsViewed[id][section]; }
  let sectionTotals = {explanation:0,wordIndex:0,extracts:0,shortAnswers:0,longAnswers:0};
  CURRICULUM.grade8.literature.forEach(l=>{ LIT_SECTIONS.forEach(s=>{ if(sectionCoverage(l.id,s.key)) sectionTotals[s.key]++; }); });

  return `
  <div class="page-head"><div class="eyebrow"><span class="dot"></span>My Progress</div><h1>How exam-ready are you?</h1></div>
  <div class="stat-row">
    <div class="stat-card"><div class="n">${viewedLessons}/${totalLessons}</div><div class="l">Literature chapters opened</div></div>
    <div class="stat-card"><div class="n">${viewedGrammar}/${totalGrammar}</div><div class="l">Grammar topics reviewed</div></div>
    <div class="stat-card"><div class="n">${viewedWriting}/${totalWriting}</div><div class="l">Writing formats reviewed</div></div>
    <div class="stat-card"><div class="n">${avgScore}%</div><div class="l">Average quiz score (${attempts.length} sessions)</div></div>
  </div>

  <h3>Coverage by section (across all Literature chapters)</h3>
  ${LIT_SECTIONS.map(s=>`
    <div class="bar-row"><span class="label">${s.long}</span><div class="bar-track"><div class="bar-fill" style="width:${Math.round(100*sectionTotals[s.key]/totalLessons)}%"></div></div><span>${sectionTotals[s.key]}/${totalLessons}</span></div>
  `).join('')}

  <h3 style="margin-top:24px;">Weak areas (based on quiz misses)</h3>
  ${weak.length ? weak.map(w=>`<div class="bar-row"><span class="label">${esc(w[0])}</span><div class="bar-track"><div class="bar-fill" style="background:var(--coral); width:${Math.min(100,w[1]*20)}%"></div></div><span>${w[1]} miss${w[1]>1?'es':''}</span></div>`).join('') : `<p style="color:var(--ink-soft); font-size:13.5px;">No weak areas yet — take a quiz in Practice mode to start tracking this.</p>`}

  <div style="margin-top:24px;"><button class="btn btn-ghost" onclick="resetProgress()">Reset all progress</button></div>
  `;
}
async function resetProgress(){
  if(!confirm('This will clear all saved progress on this device. Continue?')) return;
  PROGRESS = {lessonsViewed:{}, grammarViewed:{}, writingViewed:{}, quizAttempts:[], weakAreas:{}};
  await saveProgress();
  render();
}

function updateMiniProgress(){
  const totalItems = CURRICULUM.grade8.literature.length + CURRICULUM.grade8.grammar.length + CURRICULUM.grade8.writing.length;
  const done = Object.keys(PROGRESS.lessonsViewed).length + Object.keys(PROGRESS.grammarViewed).length + Object.keys(PROGRESS.writingViewed).length;
  const pct = totalItems ? Math.round(100*done/totalItems) : 0;
  const el = document.getElementById('miniPct'); if(el) el.textContent = pct+'%';
}

/* ---------- Init ---------- */
async function bootApp(){
  const savedTheme = await storeGet('theme');
  if(savedTheme==='dark'){ document.body.setAttribute('data-theme','dark'); document.getElementById('themeLabel').textContent='🌙 Dark mode'; }
  await loadProgress();
  renderNav();
  render();
  updateMiniProgress();
}
(async function init(){
  const authed = await storeGet('auth-v1');
  if(authed===true){
    showApp();
    await bootApp();
  } else {
    showLogin();
    document.getElementById('loginId').focus();
  }
})();
