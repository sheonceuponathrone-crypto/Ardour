<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ardour — Grade 8 English</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0%25' stop-color='%23FFD23F'/%3E%3Cstop offset='100%25' stop-color='%23FF6B5B'/%3E%3C/linearGradient%3E%3C/defs%3E%3Cpath d='M50 5C73 5 93 19 95 42C97 66 82 95 50 95C18 95 3 66 5 42C7 19 27 5 50 5Z' fill='url(%23g)' stroke='%231E2235' stroke-width='3.5'/%3E%3Cellipse cx='33' cy='27' rx='15' ry='8' fill='%23fff' opacity='.38' transform='rotate(-20 33 27)'/%3E%3Ctext x='50' y='67' text-anchor='middle' font-family='Georgia,serif' font-weight='900' font-size='46' fill='%231E2235'%3EAr%3C/text%3E%3Cpath d='M81 18l2.6 6.2L90 27l-6.4 2.8L81 36l-2.6-6.2L72 27l6.4-2.8Z' fill='%231E2235'/%3E%3Ccircle cx='20' cy='76' r='3.2' fill='%231E2235' opacity='.7'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700;9..144,900&family=Sora:wght@400;500;600;700;800&family=Caveat:wght@600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#1E2235;
  --ink-soft:#4A4E63;
  --paper:#FBF7EF;
  --paper-raised:#FFFFFF;
  --line:#E6DFCF;
  --highlight:#FFD23F;
  --highlight-soft:#FFF1BE;
  --coral:#FF6B5B;
  --coral-soft:#FFE1DC;
  --teal:#0E9A8B;
  --teal-soft:#DAF3EE;
  --violet:#7C6CF5;
  --violet-soft:#EAE6FF;
  --radius:18px;
  --radius-sm:12px;
  --shadow:0 1px 2px rgba(30,34,53,0.04), 0 8px 24px rgba(30,34,53,0.06);
  --font-display:'Fraunces', serif;
  --font-body:'Sora', sans-serif;
  --font-note:'Caveat', cursive;
  --font-mono:'IBM Plex Mono', monospace;
}
[data-theme="dark"]{
  --ink:#F2EFE6;
  --ink-soft:#B9B6C9;
  --paper:#14151F;
  --paper-raised:#1D1F2C;
  --line:#31334A;
  --highlight:#FFD23F;
  --highlight-soft:#3A3320;
  --coral:#FF8776;
  --coral-soft:#3A2523;
  --teal:#2FD9C4;
  --teal-soft:#173630;
  --violet:#A79BFF;
  --violet-soft:#28243F;
  --shadow:0 1px 2px rgba(0,0,0,0.3), 0 8px 24px rgba(0,0,0,0.35);
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  background:var(--paper);
  color:var(--ink);
  font-family:var(--font-body);
  -webkit-font-smoothing:antialiased;
  transition:background .25s ease, color .25s ease;
  min-height:100vh;
}
a{color:inherit;}
button{font-family:inherit;}
h1,h2,h3,h4{font-family:var(--font-display); margin:0 0 .4em 0; letter-spacing:-.01em;}
p{line-height:1.65; margin:.4em 0;}
.mono{font-family:var(--font-mono); letter-spacing:.02em;}

/* ---------- App shell ---------- */
#app{display:flex; min-height:100vh;}
.sidebar{
  width:248px; flex-shrink:0; background:var(--paper-raised); border-right:1px solid var(--line);
  padding:22px 16px; position:sticky; top:0; height:100vh; overflow-y:auto;
  display:flex; flex-direction:column; gap:18px;
}
.brand{display:flex; align-items:center; gap:10px; padding:0 6px 6px;}
.brand .mark{
  width:40px;height:40px; display:flex;align-items:center;justify-content:center; flex-shrink:0;
}
.brand .mark svg{width:100%; height:100%; display:block;}
.brand .name{font-family:var(--font-display); font-weight:700; font-size:16.5px; line-height:1.15;}
.brand .name span{display:block; font-family:var(--font-body); font-weight:500; font-size:11px; color:var(--ink-soft); letter-spacing:.06em; text-transform:uppercase; margin-top:2px;}

nav.primary{display:flex; flex-direction:column; gap:2px;}
.nav-item{
  display:flex; align-items:center; gap:10px; padding:10px 12px; border-radius:10px; cursor:pointer;
  font-weight:600; font-size:14.5px; color:var(--ink-soft); border:none; background:none; text-align:left; width:100%;
}
.nav-item:hover{background:var(--violet-soft); color:var(--ink);}
.nav-item.active{background:var(--ink); color:var(--paper);}
[data-theme="dark"] .nav-item.active{background:var(--highlight); color:#14151F;}
.nav-item .ic{font-size:16px; width:18px; text-align:center;}

.side-foot{margin-top:auto; display:flex; flex-direction:column; gap:10px;}
.theme-toggle{
  display:flex; align-items:center; justify-content:space-between; padding:10px 12px; border-radius:10px;
  border:1px solid var(--line); font-size:13px; font-weight:600; cursor:pointer; background:var(--paper);
}
.progress-mini{padding:12px; border-radius:12px; background:var(--teal-soft); font-size:12px;}
.progress-mini b{font-family:var(--font-display); font-size:20px; display:block; color:var(--teal);}
.logout-btn{display:block; width:100%; padding:9px 12px; border-radius:10px; border:1px solid var(--line); background:var(--paper); font-size:13px; font-weight:600; font-family:inherit; color:var(--ink-soft); cursor:pointer; text-align:center;}
.logout-btn:hover{background:var(--coral-soft); color:var(--coral); border-color:var(--coral);}
.credit-line{font-size:11px; color:var(--ink-soft); text-align:center; padding-top:2px;}
.credit-line b{color:var(--ink);}

/* ---------- Login screen ---------- */
.login-screen{
  position:fixed; inset:0; z-index:500; background:var(--paper);
  display:flex; align-items:center; justify-content:center; padding:20px;
}
.login-card{
  width:100%; max-width:360px; background:var(--paper-raised); border:1px solid var(--line); border-radius:var(--radius);
  box-shadow:var(--shadow); padding:32px 28px; text-align:center;
}
.login-mark{
  width:66px; height:66px; margin:0 auto 14px;
}
.login-mark svg{width:100%; height:100%; display:block;}
.login-card h1{font-family:var(--font-display); font-size:26px; margin:0 0 4px;}
.login-sub{color:var(--ink-soft); font-size:13px; margin:0 0 22px;}
.login-label{display:block; text-align:left; font-size:12px; font-weight:700; color:var(--ink-soft); text-transform:uppercase; letter-spacing:.04em; margin:14px 0 6px;}
.login-input{
  width:100%; padding:11px 14px; border-radius:10px; border:1px solid var(--line); background:var(--paper);
  font-family:inherit; font-size:14px; box-sizing:border-box;
}
.login-input:focus{outline:none; border-color:var(--violet);}
.login-error{min-height:18px; color:var(--coral); font-size:12.5px; font-weight:600; margin-top:10px; text-align:left;}
.login-btn{width:100%; margin-top:6px; justify-content:center;}
.login-credit{margin-top:20px; font-size:11.5px; color:var(--ink-soft);}
.login-credit b{color:var(--ink);}
.login-card.shake{animation:loginShake .35s ease;}
@keyframes loginShake{0%,100%{transform:translateX(0);}20%{transform:translateX(-8px);}40%{transform:translateX(8px);}60%{transform:translateX(-5px);}80%{transform:translateX(5px);}}


main{flex:1; min-width:0; padding:28px 34px 80px; max-width:980px;}
.topbar{display:none;}

.page-head{margin-bottom:22px;}
.eyebrow{
  font-family:var(--font-mono); font-size:11.5px; text-transform:uppercase; letter-spacing:.09em; color:var(--ink-soft);
  display:flex; align-items:center; gap:8px; margin-bottom:6px;
}
.eyebrow .dot{width:6px;height:6px;border-radius:50%;background:var(--coral);}

/* ---------- Cards / grids ---------- */
.grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(230px,1fr)); gap:14px;}
.card{
  background:var(--paper-raised); border:1px solid var(--line); border-radius:var(--radius); padding:18px;
  box-shadow:var(--shadow); cursor:pointer; transition:transform .15s ease, border-color .15s ease;
  display:flex; flex-direction:column; gap:8px; position:relative;
}
.card:hover{transform:translateY(-2px); border-color:var(--violet);}
.card .num{font-family:var(--font-mono); font-size:11px; color:var(--ink-soft);}
.card h3{font-size:17px; margin:0;}
.card .sub{font-size:12.5px; color:var(--ink-soft); margin:0;}
.badge{
  display:inline-flex; align-items:center; gap:5px; font-size:10.5px; font-weight:700; padding:3px 9px; border-radius:999px;
  text-transform:uppercase; letter-spacing:.04em; width:fit-content;
}
.badge.done{background:var(--teal-soft); color:var(--teal);}
.badge.pending{background:var(--coral-soft); color:var(--coral);}
.badge.progress{background:var(--highlight-soft); color:#8a6d00;}
[data-theme="dark"] .badge.progress{color:var(--highlight);}

/* ---------- Section chips (5-part literature nav) ---------- */
.section-chips{display:flex; gap:8px; flex-wrap:wrap; margin:18px 0 22px;}
.chip{
  padding:9px 14px; border-radius:999px; border:1px solid var(--line); background:var(--paper-raised);
  font-size:13px; font-weight:700; cursor:pointer; display:flex; align-items:center; gap:6px;
}
.chip.active{background:var(--ink); color:var(--paper); border-color:var(--ink);}
[data-theme="dark"] .chip.active{background:var(--highlight); color:#14151F; border-color:var(--highlight);}

/* ---------- Accordion ---------- */
.acc{border:1px solid var(--line); border-radius:var(--radius-sm); margin-bottom:10px; background:var(--paper-raised); overflow:hidden;}
.acc-head{display:flex; align-items:center; justify-content:space-between; padding:14px 16px; cursor:pointer; gap:10px;}
.acc-head h4{margin:0; font-size:15.5px;}
.acc-head .chev{transition:transform .2s ease; color:var(--ink-soft);}
.acc.open .chev{transform:rotate(180deg);}
.acc-body{max-height:0; overflow:hidden; transition:max-height .25s ease;}
.acc-body-inner{padding:0 16px 16px;}
.acc.open .acc-body{max-height:4000px;}

/* ---------- Lesson explanation content ---------- */
.undumbified-box{
  background:var(--highlight-soft); border:1px dashed var(--highlight); border-radius:var(--radius-sm);
  padding:14px 16px; margin:10px 0 16px; position:relative;
}
.undumbified-box .tag{font-family:var(--font-mono); font-size:11px; text-transform:uppercase; letter-spacing:.06em; color:#8a6d00; font-weight:700;}
[data-theme="dark"] .undumbified-box .tag{color:var(--highlight);}

.margin-note{
  font-family:var(--font-note); font-size:19px; color:var(--coral); line-height:1.3; padding:8px 0 8px 14px;
  border-left:3px solid var(--coral); margin:14px 0;
}

.stanza{background:var(--paper); border:1px solid var(--line); border-radius:var(--radius-sm); padding:14px 16px; margin:10px 0;}
.stanza .verse{font-family:var(--font-display); font-style:italic; font-size:15.5px; white-space:pre-line; line-height:1.7; margin-bottom:8px;}
.stanza .note{font-size:13.5px; color:var(--ink-soft);}

.revision-box{
  background:var(--teal-soft); border-radius:var(--radius-sm); padding:14px 16px; margin-top:16px;
}
.revision-box h4{color:var(--teal); font-size:14px; margin-bottom:6px;}

/* ---------- Word index ---------- */
.word-card{background:var(--paper-raised); border:1px solid var(--line); border-radius:var(--radius-sm); padding:12px 14px; margin-bottom:8px;}
.word-card .w{font-family:var(--font-display); font-weight:700; font-size:16px; color:var(--violet);}
.word-card .meanings{font-size:13.5px; margin-top:4px; color:var(--ink-soft);}
.word-card .meanings b{color:var(--ink);}

/* ---------- Extracts / Q&A ---------- */
.extract-box{background:var(--paper); border-left:4px solid var(--violet); border-radius:0 var(--radius-sm) var(--radius-sm) 0; padding:14px 16px; margin:14px 0 8px;}
.extract-box .verse{font-family:var(--font-display); font-style:italic; font-size:15px; white-space:pre-line;}
.qa{border:1px solid var(--line); border-radius:var(--radius-sm); padding:12px 14px; margin:8px 0; background:var(--paper-raised);}
.qa .qtype{font-family:var(--font-mono); font-size:10.5px; text-transform:uppercase; color:var(--violet); font-weight:700;}
.qa .q{font-weight:600; margin:4px 0;}
.reveal-btn{
  font-size:12.5px; font-weight:700; color:var(--violet); background:none; border:1px solid var(--violet); border-radius:8px;
  padding:5px 10px; cursor:pointer; margin-top:4px;
}
.answer-box{display:none; margin-top:10px; padding-top:10px; border-top:1px dashed var(--line); font-size:13.5px;}
.answer-box.show{display:block;}
.answer-box .why{margin-top:8px; padding:8px 10px; background:var(--teal-soft); border-radius:8px; font-size:12.5px;}

/* ---------- Pending notice ---------- */
.pending-note{
  background:var(--coral-soft); border-radius:var(--radius-sm); padding:14px 16px; font-size:13.5px; color:var(--ink);
  border:1px solid var(--coral);
}
.pending-note b{color:var(--coral);}

/* ---------- Buttons ---------- */
.btn{
  border:none; border-radius:10px; padding:10px 16px; font-weight:700; font-size:13.5px; cursor:pointer;
  display:inline-flex; align-items:center; gap:6px;
}
.btn-primary{background:var(--ink); color:var(--paper);}
[data-theme="dark"] .btn-primary{background:var(--highlight); color:#14151F;}
.btn-ghost{background:var(--paper-raised); border:1px solid var(--line); color:var(--ink);}
.btn-undumbify{background:var(--highlight); color:#4a3900;}

/* ---------- Modal ---------- */
.modal-backdrop{
  position:fixed; inset:0; background:rgba(20,21,31,0.55); display:none; align-items:center; justify-content:center;
  z-index:50; padding:20px;
}
.modal-backdrop.show{display:flex;}
.modal{
  background:var(--paper-raised); border-radius:20px; max-width:520px; width:100%; max-height:85vh; overflow-y:auto;
  padding:26px; box-shadow:var(--shadow); position:relative;
}
.modal .close{position:absolute; top:16px; right:16px; background:none; border:none; font-size:20px; cursor:pointer; color:var(--ink-soft);}
.modal .analogy{background:var(--violet-soft); border-radius:12px; padding:12px 14px; margin:12px 0; font-size:14px;}
.modal .exam-def{background:var(--ink); color:var(--paper); border-radius:12px; padding:12px 14px; margin-top:12px; font-size:13.5px;}
[data-theme="dark"] .modal .exam-def{background:var(--highlight); color:#14151F;}

/* ---------- Grammar ---------- */
.rule-box{background:var(--violet-soft); border-radius:var(--radius-sm); padding:14px 16px; margin:10px 0;}
.example-line{display:flex; gap:10px; padding:6px 0; font-size:14px; border-bottom:1px dashed var(--line);}
.example-line:last-child{border-bottom:none;}
.example-line .lvl{font-family:var(--font-mono); font-size:10px; padding:2px 6px; border-radius:6px; background:var(--paper); flex-shrink:0; height:fit-content; margin-top:3px;}
.mistake-line{display:flex; align-items:center; gap:10px; font-size:14px; padding:6px 0;}
.mistake-line .x{color:var(--coral); font-weight:700;}
.mistake-line .ok{color:var(--teal); font-weight:700;}

.practice-item{background:var(--paper); border:1px solid var(--line); border-radius:var(--radius-sm); padding:12px 14px; margin:8px 0;}
input.blank-input{
  border:none; border-bottom:2px solid var(--violet); background:transparent; font-family:inherit; font-size:14px;
  width:130px; padding:2px 4px; color:var(--ink);
}
.mcq-opt{display:block; width:100%; text-align:left; padding:8px 10px; margin:5px 0; border-radius:8px; border:1px solid var(--line); background:var(--paper-raised); cursor:pointer; font-size:13.5px;}
.mcq-opt.correct{background:var(--teal-soft); border-color:var(--teal);}
.mcq-opt.wrong{background:var(--coral-soft); border-color:var(--coral);}

/* ---------- Writing / build-your-answer ---------- */
.wframe{background:var(--paper); border:1px solid var(--line); border-radius:var(--radius-sm); padding:16px; margin:10px 0; font-size:14px;}
.wframe .part{margin-bottom:10px;}
.wframe .part b{color:var(--violet);}
.build-step{display:none;}
.build-step.active{display:block;}
textarea.build-input{width:100%; min-height:90px; border-radius:10px; border:1px solid var(--line); padding:10px; font-family:inherit; font-size:14px; background:var(--paper-raised); color:var(--ink);}
.step-dots{display:flex; gap:6px; margin:14px 0;}
.step-dots span{width:8px;height:8px;border-radius:50%;background:var(--line);}
.step-dots span.active{background:var(--violet);}

/* ---------- Quiz ---------- */
.quiz-filters{display:flex; gap:10px; flex-wrap:wrap; margin:14px 0 20px;}
.filter-select{padding:10px 14px; border-radius:10px; border:1px solid var(--line); background:var(--paper-raised); font-family:inherit; font-size:13.5px; font-weight:600;}
.diff-tag{font-size:11px; font-weight:700; padding:3px 8px; border-radius:6px;}
.diff-easy{background:var(--teal-soft); color:var(--teal);}
.diff-medium{background:var(--highlight-soft); color:#8a6d00;}
[data-theme="dark"] .diff-medium{color:var(--highlight);}
.diff-challenge{background:var(--coral-soft); color:var(--coral);}
.quiz-card{background:var(--paper-raised); border:1px solid var(--line); border-radius:var(--radius); padding:20px; box-shadow:var(--shadow);}
.quiz-progress-bar{height:6px; background:var(--line); border-radius:6px; overflow:hidden; margin-bottom:16px;}
.quiz-progress-fill{height:100%; background:var(--violet); border-radius:6px; transition:width .2s ease;}
.feedback-box{margin-top:14px; padding:12px 14px; border-radius:10px; font-size:13.5px;}
.feedback-box.correct{background:var(--teal-soft);}
.feedback-box.wrong{background:var(--coral-soft);}

.quiz-hud{display:flex; align-items:center; justify-content:space-between; flex-wrap:wrap; gap:8px; margin-bottom:14px;}
.hud-chip{display:inline-flex; align-items:center; gap:6px; padding:6px 12px; border-radius:999px; background:var(--violet-soft); font-size:12.5px; font-weight:700; color:var(--violet); font-family:var(--font-mono);}
.hud-chip.streak{background:var(--coral-soft); color:var(--coral);}
.hud-chip.streak.hot{animation:pop .35s ease;}
.quiz-dots{display:flex; gap:5px; flex-wrap:wrap; margin-bottom:14px;}
.quiz-dot{width:11px; height:11px; border-radius:50%; background:var(--line); flex-shrink:0; transition:transform .15s ease;}
.quiz-dot.current{background:var(--violet); transform:scale(1.3);}
.quiz-dot.correct{background:var(--teal);}
.quiz-dot.wrong{background:var(--coral);}
.lifeline-row{display:flex; gap:8px; margin:10px 0 4px; flex-wrap:wrap;}
.lifeline-btn{font-size:12px; font-weight:700; padding:6px 12px; border-radius:999px; border:1px dashed var(--violet); background:none; color:var(--violet); cursor:pointer;}
.lifeline-btn:disabled{opacity:.35; cursor:not-allowed;}
.timer-wrap{height:6px; background:var(--line); border-radius:6px; overflow:hidden; margin:0 0 14px;}
.timer-fill{height:100%; border-radius:6px; background:var(--teal); transition:width 1s linear, background .3s ease;}
.type-answer{width:100%; padding:10px 12px; border-radius:10px; border:1px solid var(--line); background:var(--paper-raised); font-family:inherit; font-size:13.5px; resize:vertical; margin:8px 0; box-sizing:border-box;}
.type-answer:focus{outline:none; border-color:var(--violet);}

.streak-toast{position:fixed; top:22px; left:50%; transform:translateX(-50%) scale(0.9); background:var(--ink); color:var(--paper); font-weight:700; font-size:13.5px; padding:10px 20px; border-radius:999px; z-index:200; box-shadow:var(--shadow); animation:toastPop 1.6s ease forwards; pointer-events:none;}
.result-rank{font-family:var(--font-display); font-size:34px; font-weight:700; margin:6px 0; animation:pop .5s ease;}
.result-stats{display:grid; grid-template-columns:repeat(auto-fit,minmax(120px,1fr)); gap:10px; margin:16px 0;}
.result-stat{background:var(--paper); border:1px solid var(--line); border-radius:var(--radius-sm); padding:12px; text-align:center;}
.result-stat .n{font-family:var(--font-display); font-size:22px; font-weight:700;}
.result-stat .l{font-size:11px; color:var(--ink-soft); text-transform:uppercase; letter-spacing:.04em;}
@keyframes pop{0%{transform:scale(1);}40%{transform:scale(1.25);}100%{transform:scale(1);}}
@keyframes toastPop{0%{opacity:0; transform:translateX(-50%) scale(0.8) translateY(-10px);}12%{opacity:1; transform:translateX(-50%) scale(1) translateY(0);}80%{opacity:1;}100%{opacity:0; transform:translateX(-50%) scale(0.95) translateY(-6px);}}

/* ---------- Progress page ---------- */
.stat-row{display:grid; grid-template-columns:repeat(auto-fit,minmax(160px,1fr)); gap:14px; margin-bottom:24px;}
.stat-card{background:var(--paper-raised); border:1px solid var(--line); border-radius:var(--radius-sm); padding:16px;}
.stat-card .n{font-family:var(--font-display); font-size:28px; font-weight:700;}
.stat-card .l{font-size:12px; color:var(--ink-soft); text-transform:uppercase; letter-spacing:.04em;}
.bar-row{display:flex; align-items:center; gap:10px; margin:8px 0; font-size:13px;}
.bar-row .label{width:160px; flex-shrink:0; color:var(--ink-soft);}
.bar-track{flex:1; height:9px; background:var(--line); border-radius:6px; overflow:hidden;}
.bar-fill{height:100%; background:var(--teal); border-radius:6px;}

/* ---------- Home ---------- */
.hero{

<script>
/* =========================================================
   PERSISTENT STORAGE (with safe in-memory fallback)
========================================================= */
const memoryStore = {};
function withTimeout(promise, ms, fallback){
  return Promise.race([
    Promise.resolve(promise).catch(()=>fallback),
    new Promise(resolve=>setTimeout(()=>resolve(fallback), ms))
  ]);
}
async function storeGet(key){
  try{
    if(window.storage){ const r = await withTimeout(window.storage.get(key,false), 1200, null); return r ? JSON.parse(r.value) : null; }
  }catch(e){ /* not found or unavailable */ }
  return memoryStore[key] ?? null;
}
async function storeSet(key, value){
  memoryStore[key] = value;
  try{
    if(window.storage){ await withTimeout(window.storage.set(key, JSON.stringify(value), false), 1200, null); }
  }catch(e){ /* fall through — already saved in-memory above */ }
}

let PROGRESS = {
  lessonsViewed: {},      // {lessonId: {explanation:true, wordIndex:true, extracts:true, shortAnswers:true, longAnswers:true}}
  grammarViewed: {},      // {topicId: true}
  writingViewed: {},      // {typeId: true}
  quizAttempts: [],       // [{area, difficulty, score, total, date}]
  weakAreas: {}           // {tag: wrongCount}
};

/* =========================================================
   LOGIN
========================================================= */
const LOGIN_ID = 'OIS123';
const LOGIN_PW = 'OIS123';

function showApp(){
  document.getElementById('loginScreen').style.display = 'none';
  document.getElementById('app').style.display = '';
}
function showLogin(){
  document.getElementById('loginScreen').style.display = 'flex';
  document.getElementById('app').style.display = 'none';
}

async function attemptLogin(e){
  if(e) e.preventDefault();
  const idField = document.getElementById('loginId');
  const pwField = document.getElementById('loginPw');
  const errBox = document.getElementById('loginError');
  const id = (idField.value||'').trim();
  const pw = pwField.value||'';
  if(id===LOGIN_ID && pw===LOGIN_PW){
    errBox.textContent = '';
    showApp();
    bootApp();
    storeSet('auth-v1', true); // persist in the background — sign-in never waits on this
  } else {
    errBox.textContent = 'Incorrect login ID or password — try again.';
    const card = document.querySelector('.login-card');
    card.classList.remove('shake'); void card.offsetWidth; card.classList.add('shake');
    pwField.value = '';
    pwField.focus();
  }
}

async function logout(){
  if(!confirm('Log out of Ardour on this device?')) return;
  showLogin();
  document.getElementById('loginId').value = '';
  document.getElementById('loginPw').value = '';
  document.getElementById('loginError').textContent = '';
  document.getElementById('loginId').focus();
  if(document.getElementById('sidebar').classList.contains('open')) toggleSidebar();
  storeSet('auth-v1', false); // persist in the background
}

async function loadProgress(){
  const saved = await storeGet('progress-v1');
  if(saved) PROGRESS = Object.assign(PROGRESS, saved);
}
async function saveProgress(){ await storeSet('progress-v1', PROGRESS); }

function markViewed(lessonId, section){
  if(!PROGRESS.lessonsViewed[lessonId]) PROGRESS.lessonsViewed[lessonId] = {};
  PROGRESS.lessonsViewed[lessonId][section] = true;
  saveProgress(); updateMiniProgress();
}
function markGrammarViewed(id){ PROGRESS.grammarViewed[id]=true; saveProgress(); updateMiniProgress(); }
function markWritingViewed(id){ PROGRESS.writingViewed[id]=true; saveProgress(); updateMiniProgress(); }

  undumbify:{
    plain:"A traveller tells the poet about a giant, broken statue in the desert. It once belonged to a mega-powerful king who bragged that everyone should look at his 'works' and despair. Except... there are no works left. Just a smashed face and empty sand.",

  explanation:{
    undumbified:"A guy meets a traveller who describes a broken statue of a once-mighty king, Ozymandias, standing alone in an empty desert. The statue's arrogant boast — 'look at my great achievements and despair' — is now deeply ironic, because nothing is left except the statue itself, crumbling in the sand. The poem is really about how time defeats even the proudest rulers — though the sculptor's skill, and Shelley's poem itself, prove that art can outlast power.",
    sections:[
      {h:'Setting & Frame', p:"The poem is a frame narrative: the speaker (the poet) reports what 'a traveller from an antique land' told him. This distances Shelley from the description, making it feel like a second-hand travellers' tale — almost a legend."},
      {h:'The Statue', p:"Two huge stone legs stand without a body ('trunkless'). Near them, half-buried in sand, lies a shattered face (a 'visage') with a frown, a sneer, and an expression of 'cold command'. The sculptor clearly captured the king's arrogance perfectly — 'well those passions read'."},

      {h:'The Irony', p:"The final lines undercut the boast completely: 'Nothing beside remains.' Around the broken statue stretches nothing but 'lone and level sands' — empty desert, as far as the eye can see. The 'Works' Ozymandias bragged about have vanished entirely; only the arrogant statue (itself broken) survives, mocking its own maker."},
      {h:'Who was Ozymandias?', p:"'Ozymandias' was the title the ancient Greeks gave to Ramses II (reigned roughly BCE 1304–1237), one of the most powerful pharaohs of Egypt, who aggressively expanded his territories and built numerous cities and statues of himself. The poem was written at a time when Britain was both bringing back pieces of ancient Egyptian monuments and expanding its own colonial empire across the globe — giving the poem's warning about the impermanence of power extra historical resonance."},
      {h:'A second theme: art outlasts power', p:"Both the sculptor and the king are long dead, and Ozymandias's empire lies in ruins — yet the sculptor's creative skill survives, visible in the powerful, honest expressions still carved into the statue's face. The poem itself is another work of art that continues to be read centuries after Shelley's death, reinforcing the idea that artistic creation can outlast even the mightiest political power."}
    ],
    poemMeta:{
      centralIdea:"Human power, pride and empires are temporary; time and nature outlast and erase even the mightiest rulers' achievements — while art and creativity, by contrast, can endure.",
      tone:"Ironic, reflective, slightly mocking of tyranny; awe at time's power.",
      mood:"Bleak, desolate, thought-provoking.",
      rhymeScheme:"A sonnet (14 lines) with an unusual rhyme scheme, ABABACDCEDEFEF, where the 'C' sound is used to join the traditional break between the octave (first 8 lines) and the sestet (last 6 lines) — rather than keeping them cleanly separate. Shelley also uses slant rhymes (near-rhymes that sound similar but aren't identical), such as 'appear' and 'despair', plus striking internal rhymes and sound echoes like 'land'/'stand'/'sand'/'hand', 'trunkless'/'sunk', 'frown'/'Round'/'boundless', and 'stone'/'lone' — building a solemn, tightly-controlled mood. Unusually, the poem doesn't end on a neat moral lesson but on the simple, striking image of the desert sands.",
      devices:[
        {name:'Irony', ex:"The king's boast ('despair') becomes ironic because there is nothing left to despair about — 'Look on my Works, ye Mighty, and despair!' followed by 'Nothing beside remains.'"},
        {name:'Allusion', ex:"'Two vast and trunkless legs of stone' alludes to the Colossus of Rhodes, a huge ancient statue of the sun god Helios built by the ancient Greeks, famously imagined standing with its legs apart."},
        {name:'Hyperbole/Exaggeration', ex:"'King of Kings' is a grand exaggeration of Ozymandias's own importance, claiming supremacy over all other rulers."},

      phrases:[

        {phrase:"Sneer of cold command", meaning:"The king's arrogant, contemptuous expression — shows his tyrannical, uncaring personality."},
        {phrase:"The hand that mocked them, and the heart that fed", meaning:"The sculptor's skilful hand captured (mocked/imitated) the king's passions, which were originally fed by the king's own heart/ego."},
        {phrase:"Lone and level sands stretch far away", meaning:"Nothing remains except endless, flat desert — total erasure of the king's legacy."}

  },
  wordIndex:[

    {word:'Colossal', simple:'Extremely large', context:'Describes the huge scale of the ruined statue ("colossal Wreck").'},
    {word:'Boundless', simple:'Without limits', context:'Describes the endless desert surrounding the statue.'}

  extracts:[
    {
      text:"'My name is Ozymandias, King of Kings:\nLook on my Works, ye Mighty, and despair!'\nNothing beside remains.",
      qs:[
        {type:'Contextual', q:'Who is speaking in these lines, and where is this inscription found?', a:'The words are Ozymandias\'s own boast, carved by him onto the pedestal of his statue. The traveller reads it aloud while describing the ruined statue to the poet.', why:'The line "on the pedestal these words appear" tells us it is an inscription, and the direct quotation marks show it is Ozymandias\'s own words.'},

        {type:'Literary Analysis', q:'Identify and explain the irony in "Nothing beside remains."', a:'This is situational irony: Ozymandias boasted that his works would inspire awe, but in reality nothing is left except a broken statue surrounded by empty desert — the opposite of what he intended.', why:'Irony occurs when the actual outcome contradicts what was expected or intended; here the king\'s proud claim is completely undercut by reality.'},
        {type:'Inference', q:'What does this extract suggest about the nature of political power?', a:'It suggests that political power and pride are temporary — no matter how great a ruler believes himself to be, time will eventually erase his empire and legacy.', why:'The contrast between the grand boast and the "nothing" that remains implies that all human power is ultimately impermanent.'}

        {type:'Literary Analysis', q:'Pick out one example of alliteration from this extract and explain its effect.', a:'"Lone and level" is alliterative (repeated "l" sound). The soft, drawn-out sound mirrors the flat, endless, silent desert being described.', why:'Alliteration here slows the reading pace and reinforces the feeling of a vast, empty, unchanging landscape.'},
        {type:'Inference', q:'Why does Shelley end the poem on this image rather than on the statue itself?', a:'Ending on the empty sands (rather than the statue) drives home the central idea — that ultimately even the statue is insignificant against the scale of time and nature; what truly "remains" is nothingness.', why:'Poets often place their most important idea in the final lines; here the emptiness, not the statue, gets the last word.'}
      ]
    },
    {
      text:"I met a traveller from an antique land\nWho said: Two vast and trunkless legs of stone\nStand in the desert. Near them, on the sand,\nHalf sunk, a shattered visage lies, whose frown,\nAnd wrinkled lip, and sneer of cold command,\nTell that its sculptor well those passions read\nWhich yet survive, stamped on these lifeless things,\nThe hand that mocked them and the heart that fed:",
      qs:[
        {type:'Contextual', q:'Who is the "traveller" and what is he describing to the poet?', a:'The traveller is an unnamed figure who has journeyed through an "antique" (ancient) land and is now describing to the poet the ruined statue of Ozymandias that he saw there — two huge stone legs and a broken, half-buried face lying nearby.', why:'The opening line establishes the frame narrative: the poet is retelling what the traveller told him.'},
        {type:'Meaning', q:'What does "trunkless" mean, and what does it suggest about the statue?', a:'"Trunkless" means without a torso/body. It suggests the statue is badly broken — only the legs remain standing, disconnected from the rest of the figure, showing decay and ruin.', why:'The word directly describes the statue\'s damaged, incomplete state.'},
        {type:'Literary Analysis', q:'Explain the phrase "the hand that mocked them and the heart that fed" and identify the device used.', a:'This refers to the sculptor\'s hand, which skilfully imitated ("mocked" = mimicked) Ozymandias\'s arrogant expressions, expressions that were originally fuelled ("fed") by the king\'s own proud heart. It uses synecdoche, where "hand" and "heart" (parts of a person) stand in for the whole person — the sculptor\'s skill and the king\'s emotions/nature respectively.', why:'This is a textbook example of synecdoche — using a part (hand, heart) to represent the whole person\'s ability or character.'},
        {type:'Inference', q:'What does the phrase "sneer of cold command" reveal about Ozymandias as a ruler, even before we read the inscription?', a:'It reveals that Ozymandias was arrogant, contemptuous, and used to being obeyed without question — his very facial expression, captured permanently in stone, shows a personality accustomed to unchallenged power.', why:'The sculptor captured this expression accurately ("well those passions read"), so the statue itself is evidence of the king\'s tyrannical character, before we even reach his own boastful words.'}
      ]
    }
  ],
  shortAnswers:[
    {q:'Who was Ozymandias, and what does the poem suggest about his character?', a:'Ozymandias was the Greek name for Pharaoh Ramesses II of Egypt. The poem suggests he was arrogant and tyrannical — his statue\'s "sneer of cold command" and his boastful inscription reveal a ruler obsessed with his own power and legacy.', points:['Ozymandias = Ramesses II','Evidence: sneer, cold command, boastful inscription','Shows pride/tyranny'], why:'Good answers connect the historical identity to specific textual evidence of character.'},
    {q:'Why does Shelley use a traveller as the narrator of the statue\'s description, rather than describing it himself?', a:'Using a traveller\'s account creates distance and a sense of legend, as though the ruin is so remote and unfamiliar that it can only be described second-hand — reinforcing how far removed Ozymandias\'s empire now is from the present.', points:['Frame narrative technique','Creates distance/legend-like quality','Reinforces remoteness of the ruin in time and space'], why:'This shows understanding of narrative technique, not just plot.'},
    {q:'Explain the central theme of "Ozymandias" in your own words.', a:'The poem shows that human power and pride are temporary. No matter how mighty a ruler believes himself to be, time and nature will eventually reduce his empire to ruins and forgotten sand.', points:['Time defeats power/pride','Empires are impermanent','Nature outlasts human ambition'], why:'A theme answer should generalise beyond the specific plot to the poem\'s message.'},
    {q:'What does "two vast and trunkless legs of stone" suggest about the state of the statue, and why might Shelley have chosen to describe it this way rather than as a whole, intact statue?', a:'The image shows the statue as badly broken — legs standing with no body, face lying separately, half-buried in sand. Shelley deliberately describes it in ruins (rather than intact) to immediately establish the poem\'s theme: even a king\'s most permanent-seeming monument cannot resist decay.', points:['Statue is damaged/incomplete, not whole','Choice of ruin (not intact statue) sets up theme from the start','Physical brokenness mirrors the collapse of Ozymandias\'s power'], why:'Noticing what the poet chose to show (ruin, not glory) is a strong sign of close reading.'},
    {q:'What is the significance of the title "King of Kings"?', a:'"King of Kings" is Ozymandias\'s own grand title, claiming supremacy over all other rulers. Its significance lies in its irony: a title meant to declare eternal, unmatched greatness is now attached to a broken statue that no one recognises or fears — showing how empty such titles become once power fades.', points:['Title claims supreme power over all rulers','Now attached to a ruin, not a living empire','Irony: the grander the claim, the more ironic its downfall'], why:'Titles/boasts in the poem work as evidence for the poem\'s central irony about the impermanence of power.'},
    {q:'How does the sculptor, though only briefly mentioned, play an important role in the poem?', a:'The sculptor "well those passions read" — meaning he accurately captured Ozymandias\'s arrogant character in stone. The sculptor\'s artistic skill has, ironically, outlasted the king\'s actual empire: what survives is not Ozymandias\'s power, but an artist\'s honest, unflattering portrait of his pride.', points:['Sculptor accurately captured the king\'s arrogance','Art (the sculptor\'s skill) has outlasted the king\'s empire','Irony: the king wanted to be remembered as glorious, but is remembered as arrogant, via the sculptor\'s honest work'], why:'This shows how Shelley subtly contrasts lasting artistic truth with fleeting political power.'}

  longAnswers:[
    {q:'Discuss how Shelley uses irony to convey the central theme of "Ozymandias".', a:'Shelley builds the entire poem around a single, powerful irony: a king who demanded that others "despair" at his greatness is now himself an object of pity, reduced to a broken statue in an empty desert.\n\nIn the octave, the traveller describes the statue in detail — a "sneer of cold command" that reveals Ozymandias\'s arrogance, skilfully captured by the sculptor. The inscription on the pedestal then delivers the boast directly in the king\'s own words: "Look on my Works, ye Mighty, and despair!"\n\nHowever, the final tercet completely reverses the meaning of these words. Instead of magnificent "Works" to despair over, there is "Nothing beside" the ruined statue — only "boundless and bare" sand stretching endlessly. The very desert that should have showcased his glory has swallowed it instead.\n\nThis irony delivers Shelley\'s central message: political power, however absolute it may seem in its own time, cannot resist the erosion of time. The poem, written during an era when Romantic poets were sceptical of tyranny and empire, uses Ozymandias as a timeless warning to all rulers who believe their power is permanent.', structure:'Introduction (state the irony) → Description of the statue and inscription (evidence) → Reversal in the final lines (evidence) → Explanation of theme → Conclusion connecting to Romantic-era scepticism of power.', points:['Identify the central irony clearly','Use specific quotations/details as evidence','Explain how the ending reverses the boast','Link to the broader theme of power vs time']},
    {q:'Examine the role of the sonnet form and the frame narrative (traveller\'s account) in shaping the meaning of "Ozymandias".', a:'Shelley\'s choice of form is not incidental — it actively reinforces the poem\'s meaning.\n\nFirst, the poem is technically a sonnet, but Shelley breaks from the traditional, tightly regular rhyme schemes (Petrarchan or Shakespearean). Instead, the rhyme scheme is irregular (ABABACDCEDEFEF), mirroring how the statue itself is broken and irregular — the poem\'s structure enacts the very decay it describes.\n\nSecond, Shelley frames the entire description within a traveller\'s secondhand account: "I met a traveller... who said." This creates distance in both time and space, making Ozymandias\'s once-mighty empire feel like a half-forgotten legend rather than a living memory. The poet himself never sees the ruin directly; he only hears about it, emphasising just how far removed the present is from Ozymandias\'s era of power.\n\nTogether, the irregular sonnet form and the frame narrative work with the poem\'s content, not just alongside it: the very shape and structure of "Ozymandias" embody its central message that power, however grand, inevitably fades into distant, fragmented memory.', structure:'Introduction (form is not incidental) → Explain the irregular sonnet structure as mirroring the statue\'s brokenness → Explain the frame narrative and its effect of distance → Conclusion tying structure to theme.', points:['Identify the sonnet form and its irregularity','Connect the broken rhyme scheme to the broken statue','Explain the effect of the traveller\'s frame narrative','Conclude that form reinforces the theme of impermanence']}
  ]

    {q:'"Ode on Solitude" presents a philosophy of happiness very different from chasing wealth or fame. Discuss.', a:'Alexander Pope\'s "Ode on Solitude" builds, stanza by stanza, a portrait of happiness rooted in simplicity rather than ambition.\n\nIn the opening stanza, the "happy man" desires nothing beyond "a few paternal acres" — modest, inherited land, not conquered wealth. The second stanza shows his complete self-sufficiency: his own herds, fields, flocks and trees provide milk, bread, clothing, shade and fire, meaning he depends on no one and needs nothing more.\n\nThe third and fourth stanzas turn from material contentment to peace of mind: years pass gently, his health is good, his sleep is sound, and his days are filled with study, rest, gentle recreation and quiet meditation — a life in balance.\n\nMost strikingly, the final stanza rejects fame entirely. Pope wishes to live "unseen, unknown" and to die "unlamented", without even a gravestone. This is a direct contrast to the pursuit of wealth, status or public recognition that many people chase — Pope suggests that true contentment requires stepping away from the world\'s attention altogether.\n\nTaken together, the poem argues that happiness is found in modesty, self-reliance, and anonymity — not in riches or fame.', structure:'Introduction (state the poem\'s philosophy) → Stanza 1–2 evidence (modest land + self-sufficiency) → Stanza 3–4 evidence (peace of mind, balance) → Stanza 5 evidence (rejection of fame) → Conclusion tying it together.', points:['Reference each stanza\'s idea in order','Use quotations as evidence','Explicitly contrast with wealth/fame','End with a clear statement of theme']},
    {q:'Discuss the poetic devices Pope uses in "Ode on Solitude" and how they reinforce the poem\'s central theme.', a:'Pope reinforces the poem\'s message of balance and contentment through carefully chosen poetic devices, not just through content.\n\nStructurally, each stanza follows a steady ABAB rhyme scheme, with a short final line breaking the rhythm of the longer preceding lines. This consistent, settled pattern mirrors the calm, unhurried life the poem describes — the form itself feels peaceful and controlled, never chaotic.\n\nPope also relies heavily on parallelism and anaphora, especially in the second stanza: "Whose herds... whose fields... whose flocks... whose trees..." This repeated structure creates a rhythmic, almost hypnotic list that emphasises the completeness of the man\'s self-sufficiency — every need is accounted for, in an orderly, balanced way.\n\nFinally, in the closing stanza, Pope uses repetition of negative prefixes — "unseen", "unknown", "unlamented" — to hammer home his rejection of fame. The repeated "un-" sound creates a chant-like insistence on anonymity, making the poem\'s final wish impossible to miss.\n\nThrough rhyme scheme, parallel structure, and repetition, Pope\'s technique consistently mirrors and reinforces his theme: a life of quiet, ordered, self-sufficient contentment is more valuable than a life of fame or ambition.', structure:'Introduction (form reflects content) → Rhyme scheme and its calm effect → Parallelism/anaphora in stanza 2 (evidence) → Repetition of "un-" words in the final stanza (evidence) → Conclusion linking technique to theme.', points:['Explain the rhyme scheme and its calming effect','Give specific examples of parallelism/anaphora','Explain the repeated "un-" prefixes in the ending','Conclude by linking form directly to the theme of contentment']}

        {type:'Contextual', q:'How does Goldsmith address his readers at the start of the poem, and why?', a:'Goldsmith directly addresses "Good people all, of every sort", inviting everyone to listen to his "song" (poem). This mimics the traditional opening style of ballads and elegies, which often called out to a general audience.', why:'This direct-address opening is a recognisable feature of the ballad/elegy tradition Goldsmith is imitating for comic effect.'},
        {type:'Meaning', q:'What does Goldsmith mean when he warns that the poem is "wondrous short" and "cannot hold you long"?', a:'He is playfully warning readers, in advance, that the poem will be brief — a small joke that also hints the poem is not meant to be taken too seriously.', why:'This early, light-hearted comment prepares readers for the poem\'s ultimately comic tone, despite its serious "elegy" title.'},
        {type:'Literary Analysis', q:'What is ironic about describing the man as one who "a godly race he ran, whene\'er he went to pray"?', a:'This line politely praises the man\'s regular churchgoing and piety, but the exaggerated, formal phrasing ("a godly race he ran") is slightly mocking — Goldsmith gently pokes fun at how townspeople praise "respectable" behaviour without necessarily meaning it deeply.', why:'The overly formal, almost stock phrase used to describe ordinary piety hints at Goldsmith\'s satirical tone from the very start.'},
        {type:'Inference', q:'What tone does Goldsmith establish in this opening extract, and how does it prepare the reader for what follows?', a:'Goldsmith establishes a mock-serious, slightly playful tone — inviting "all" to listen, warning the poem is short, and offering exaggerated praise of the man. This tone prepares readers to expect something not entirely serious, setting up the later comic twist.', why:'Establishing tone early is important; the playful opening hints that this "elegy" will not follow the expected mournful pattern.'}
      ]
    }
  ],
  shortAnswers:[
    {q:'Why is the poem called an "elegy" even though it is comic?', a:'It is called an elegy because it mimics the serious, mournful form and tone traditionally used to honour someone\'s death — but Goldsmith uses this serious form ironically, since the ending is a comic twist rather than a genuine tragedy.', points:['Elegy = poem mourning death (traditionally serious)','Goldsmith mimics that serious tone/structure','Twist ending makes it a mock-elegy/satire'], why:'Understanding the title\'s irony is central to understanding the poem\'s purpose.'},
    {q:'What is ironic about the poem\'s ending?', a:'Everyone expects the "good" man to die from the dog bite, but instead he recovers completely, while the dog dies — reversing all of the neighbours\' confident predictions.', points:['Expectation: man dies','Reality: dog dies, man recovers','Reverses reader/neighbours\' expectations'], why:'Irony is the poem\'s central literary technique and most commonly tested idea.'},
    {q:'How does Goldsmith describe the man of Islington, and what is slightly mocking about this description?', a:'He describes the man as pious ("a godly race he ran") and generous ("the naked every day he clad"). The description is subtly mocking because the second phrase is a pun — he "clad" the naked only "when he put on his clothes", meaning his generosity is really just about himself, gently undercutting his reputation for kindness.', points:['Man is described as pious and generous','Pun: "clad the naked... when he put on his clothes"','Undercuts his reputation with humour'], why:'Spotting Goldsmith\'s wordplay is key to understanding how the poem mocks exaggerated reputations.'},
    {q:'What role do the neighbours play in the poem, and what does their behaviour reveal?', a:'The neighbours ("the rogues") rush to see the bitten man and confidently declare the dog mad and the man doomed to die. Their behaviour reveals how quickly gossip spreads and how confidently people make assumptions without real evidence.', points:['Neighbours react dramatically and confidently','They assume the worst without evidence','Revealed as "rogues" once proven wrong'], why:'The neighbours function as a satirical target representing gossiping, hasty communities.'},
    {q:'Describe the structure of the poem and how it builds towards the twist ending.', a:'The poem is written in simple ABAB quatrains, building steadily: introducing the man, then the dog, then the bite, then the neighbours\' alarmed reaction — all leading readers to expect a tragic outcome, before the final stanza suddenly reverses everything.', points:['Simple ballad-like ABAB stanzas','Gradual build-up of tension/expectation','Final stanza delivers the reversal/twist'], why:'Recognising how structure builds suspense before the twist shows understanding of the poem\'s craftsmanship, not just its plot.'}
  ],
  longAnswers:[
    {q:'How does Goldsmith use satire and irony to comment on gossip and hypocrisy in "An Elegy on the Death of a Mad Dog"?', a:'Goldsmith\'s poem is structured as a classic mock-elegy: it borrows the solemn tone and ballad-like rhyme scheme of a traditional elegy but uses them to tell a deliberately trivial, comic story.\n\nFrom the outset, the poem introduces a man praised for his piety and generosity, though even this praise is gently mocked through the pun that he "clad" the naked only "when he put on his clothes" — suggesting his reputation may be exaggerated by the townspeople rather than fully deserved.\n\nWhen the dog bites the man after a minor "pique", the neighbourhood reacts with dramatic certainty: they are convinced the dog is mad and the man will die. This rapid, confident gossip — despite no real evidence yet of the outcome — is exactly what Goldsmith satirises: people leap to dramatic conclusions and spread them as fact.\n\nThe final stanza\'s twist, "The man recovered of the bite, / The dog it was that died," directly punishes this gossip by proving the neighbours ("the rogues") wrong. The comic anticlimax undercuts all the earlier solemnity, revealing the whole affair to have been overblown from the start.\n\nThrough this structure, Goldsmith satirises small-town hypocrisy and the human tendency to dramatise and gossip about events without evidence — using humour rather than direct criticism to make his point.', structure:'Introduction (mock-elegy form) → Evidence: the "good" man\'s ironic introduction → Evidence: the neighbours\' dramatic, unverified gossip → Evidence: the twist ending punishing that gossip → Conclusion on Goldsmith\'s satirical purpose.', points:['Explain the mock-elegy form','Use the pun about the "good" man as evidence of gentle mockery','Explain the neighbours\' unfounded certainty','Tie the twist ending to the satirical purpose']},
    {q:'Discuss how Goldsmith builds humour through structure and language across the poem, leading up to its final twist.', a:'Goldsmith\'s humour is not confined to the final stanza — it is carefully built up through the poem\'s language and structure from the very first lines.\n\nThe opening stanza immediately signals playfulness: Goldsmith addresses "Good people all, of every sort" and jokes that his "song" is "wondrous short", gently undercutting the seriousness usually expected of an elegy before the story has even begun.\n\nThe introduction of the "good" man of Islington continues this playful undercutting through wordplay — he "clad" the naked only "when he put on his clothes", a pun that quietly mocks the exaggerated, almost performative nature of his reputed kindness.\n\nAs the story develops, Goldsmith heightens the drama artificially: the dog\'s bite is treated as a shocking betrayal ("to gain some private ends"), and the neighbours\' reaction is described with exaggerated certainty, as though a great tragedy is unfolding. This mismatch between the small, ordinary event (a dog bite) and the elevated, dramatic language used to describe it is a form of mock-heroic humour.\n\nAll of this build-up makes the final twist far funnier: after so much manufactured seriousness, the sudden, plain statement that "The dog it was that died" lands as a genuine punchline, rewarding readers who noticed the humour Goldsmith had been quietly building throughout.', structure:'Introduction (humour is built gradually, not just at the end) → Evidence from opening stanza\'s playful tone → Evidence from the pun about the "good" man → Evidence from the exaggerated, mock-heroic description of the bite and neighbours\' reaction → Conclusion on how this build-up sharpens the final twist.', points:['Trace the humour from the opening stanza onward','Explain the pun in the man\'s introduction','Explain mock-heroic exaggeration in describing the bite/reaction','Conclude by connecting the build-up to the effectiveness of the twist']}
  ]
});

ticism for it at the time. Finally, Rachel nervously shares her love of K-pop groups like BTS, Blackpink, and Red Velvet, and says she's planning to learn Korean to understand the lyrics without subtitles. The teacher admits she hasn't listened to K-pop yet but is aware of its popularity, and promises to check it out — ending the discussion by calling it a rewarding experience before the class returns to the monsoon passage as rain begins to fall outside.",

ents distinctly','Explain the personal "why" behind each preference, not just naming the genre','Use specific details from the text (song names, instruments, personal history)','Conclude by drawing a common thread across the three']},

    {
      text:"Sitting in a porchway cool,\nSunlight, I see, dying fast,\nTwilight hastens on to rule.\nWorking hours have well-nigh past.\nShadows run across the lands:\nBut a sower lingers still,\nOld, in rags, he patient stands.\nLooking on, I feel a thrill.",

        {type:'Meaning', q:'Why is the grain described as "precious"?', a:'The grain is called "precious" because it represents the promise of a future harvest and food — though small and simple now, it holds great future value, making it valuable despite its humble appearance.', why:'The word "precious" elevates the grain beyond its plain physical appearance, tying it to the idea of future reward ("soon shall come a time to reap").'},

  longAnswers:[
    {q:'Trace the development of the sower\'s character over the course of the poem.', a:'Across the poem, the sower undergoes a striking transformation — not in reality, but in how the speaker perceives and describes him.\n\nAt the start, the sower is introduced in humble, almost pitiable terms: "Old, in rags, he patient stands." He is simply an elderly labourer, dressed poorly, continuing his work quietly as the day ends. The only hint of something more is the speaker\'s own emotional reaction — feeling "a thrill" at the sight, suggesting the scene already carries some deeper significance for him.\n\nAs the poem progresses, the sower\'s description grows more powerful. His silhouette becomes "black and high", and it "dominates the furrows deep" — no longer just an old man, but a commanding, almost imposing shape against the darkening field. His actions are described with active, confident verbs: he "marches" and "scatters wide" the "precious grain", suggesting purpose and quiet authority rather than mere routine labour.\n\nBy the poem\'s final lines, this transformation reaches its peak. The sower\'s ordinary gestures now seem "august" — deeply dignified — and "strange" to the speaker\'s eyes. Most dramatically, his height "seems to touch the starry skies", elevating him into an almost mythical, larger-than-life figure.\n\nThis progression — from a humble, ordinary old man to a majestic, near-mystical presence — reflects the poem\'s central idea: that the closer and more attentively we observe simple, honest labour, the more its hidden nobility and grandeur can be revealed.', structure:'Introduction (the sower transforms in perception, not reality) → Stage 1: humble introduction (evidence) → Stage 2: growing power/dominance (evidence) → Stage 3: majestic, mystical climax (evidence) → Conclusion on what this progression reveals about the poem\'s theme.', points:['Trace the description across all three/five quatrains in order','Use specific quotations as evidence for each stage','Note the shift from passive to active verbs','Conclude with what the transformation reveals about the poem\'s message']},
    {q:'The poet keenly observes the sower. Write in your own words the response and reverence the poet expresses for the sower in the poem.', a:'Throughout "The Sower", the poet\'s response moves from simple curiosity to genuine reverence, expressed through the way his descriptions grow steadily more admiring and awestruck.\n\nAt first, the poet\'s attention is caught almost by accident — while relaxing in a cool porchway at dusk, he happens to notice the sower still working in the fields. His very first reaction, feeling "a thrill", shows that even this ordinary sight moves him more than expected, hinting at the deeper appreciation to come.\n\nAs he continues watching, the poet\'s tone becomes more thoughtful and admiring. He describes the sower\'s tall, dark silhouette "dominating" the fields, and pauses to "muse" — to reflect deeply — on the scene before him, rather than simply describing it. This marks a shift from passive observation to genuine emotional and intellectual engagement with what he is witnessing.\n\nBy the poem\'s end, the poet\'s reverence is unmistakable. He describes the sower\'s simple gestures as "august" — a word specifically chosen to convey deep respect and dignity — and imagines his height stretching up "to touch the starry skies". This final image goes far beyond ordinary admiration; it suggests the poet now views the sower with something close to awe, as though witnessing something almost sacred in his humble, repetitive labour.\n\nOverall, the poet\'s response develops from mild curiosity, through quiet emotional engagement, to a final, almost reverent admiration — reflecting his growing recognition of the quiet nobility and dignity present in the sower\'s honest, unglamorous work.', structure:'Introduction (response moves from curiosity to reverence) → Early reaction: "a thrill" (evidence) → Middle shift: musing/reflection (evidence) → Final reverence: "august", touching the skies (evidence) → Conclusion on what this reveals about the poet\'s view of labour.', points:['Describe the progression of the poet\'s emotional response','Use specific quotations to show each stage','Explain why the final image ("august", starry skies) signals deep reverence','Conclude by connecting this to the poem\'s theme about honest labour']}
  ]

  undumbify:{
    plain:"A Danish carpenter loses his workshop, his wholesaler goes bankrupt on him, and his factory literally burns to the ground — twice, life should have ended his toy business. Instead, he keeps rebuilding, obsesses over quality (making his son redo a paint job three times instead of two), and eventually names his company 'play well' in Danish. That company is LEGO, and its bricks are now sold at a rate of 28 sets every second at Christmas.",

    undumbified:"The chapter tells the true story of how LEGO became one of the world's biggest toy companies. It begins with carpenter Ole Kirk Christiansen in Billund, Denmark, who loses his workshop and his wife around the same time, but keeps making wooden toys for his children out of scrap wood. Slow early sales, a bankrupt wholesaler, and a devastating 1942 factory fire all threaten to end his business, but Ole rebuilds each time. He names the company 'Lego' (from the Danish 'leg godt', meaning 'play well') and insists on strict quality standards. After a 1946 discovery of plastic moulding technology, Ole's son Godtfred redesigns the toy bricks in plastic, eventually creating an interlocking 'system of play' inspired partly by another toy pioneer, Hilary Page. Despite early structural problems, the bricks succeed, and LEGO grows into a global brand with theme parks, movies, and record-breaking towers — all traced back to Ole's core values of courage, determination, and faith.",
    sections:[
      {h:'A familiar toy, an unfamiliar origin', p:"The chapter opens by noting how universally loved plastic building blocks are among children, made by 'all the leading toy companies in the world'. These colourful bricks were the 'ingenious creation' of The Lego Group, a Denmark-based company founded in 1932, today a 'formidable franchise' with its own amusement parks and movies — selling almost 28 Lego sets every second during the Christmas season."},
      {h:'Ole Kirk Christiansen\'s hard beginnings', p:"The story's real beginning is far humbler: Ole Kirk Christiansen, a gifted carpenter from Billund, a small town in central Denmark, had to shut down his workshop after falling on hard times. This became, surprisingly, 'a blessing in disguise'. While recovering from acute financial distress, Ole also lost his wife and was left alone with his four children. Tenacious as ever, he kept spending time in his empty workshop, thinking of ways to create something new."},

      {h:'Naming the company', p:"By 1934, despite steady effort, the company still hadn't found real success, which Ole attributed to not having a proper name. He settled on 'Lego', an abbreviation of the Danish phrase leg godt ('play well'). By coincidence, 'Lego' also means 'to gather' or 'to collect' in Latin — fitting nicely with the company's future innovations, even though Ole wasn't aware of this connection at the time. Within two years, profits rose dramatically."},
      {h:'Uncompromising quality', p:"Ole's commitment to quality shows clearly in one incident: when Godtfred tried to save money by applying only two coats of lacquer instead of three, Ole made him redo nearly a hundred toys with the missing third coat — a lesson that left a lasting impression on Godtfred. Ole's motto, det bedste er ikke for godt ('the best is never too good'), remains the Lego Group's motto to this day."},
      {h:'The 1942 fire', p:"Lego's sales grew steadily, surviving even the Second World War, until a fire broke out in the workshop in 1942. Despite the fire trucks dousing the flames, the factory was reduced to rubble, and Ole lost all his drawings and models — nearly losing everything he had painstakingly built. Persevering as always, Ole rebuilt the factory and quickly recaptured the toy market."},

      {h:'Solving the locking problem', p:"Godtfred solved this by designing bricks with tubes that allowed them to lock together, drawing inspiration from Hilary Page of Kiddicraft, another toy pioneer already working on self-locking bricks. Lego modified Page's design to make it easier for children to handle, unlocking 'endless creative opportunities' and striking a balance between learning and play."},
      {h:"Ole's death and Lego's global growth", p:"Ole died of a heart attack in 1958 and did not live to see the company stop producing wooden toys altogether in 1961, as the Lego system became its central focus. Godtfred expanded globally — building the Billund airport in 1964 exclusively for the Lego industry, and opening Legoland amusement park in 1968, which drew 600,000 visitors in its first year alone."},

      text:"Ole's uncompromising commitment to quality was also evident when he berated Godtfred for putting two coats of lacquer on the toys instead of three. Godtfred's intention was to save money, but his father made him put a third coat on almost a hundred toys that were supposed to be shipped.",

        {type:'Meaning', q:'What does Ole\'s reaction reveal about his priorities as a businessman?', a:'It reveals that Ole valued product quality above short-term cost savings — he was willing to have nearly a hundred toys redone rather than ship products that didn\'t meet his standards.', why:'Making Godtfred redo "almost a hundred toys" is a costly, time-consuming decision, showing quality mattered more to Ole than saving money or time.'},
        {type:'Literary Analysis', q:'What does the word "berated" suggest about the tone of Ole\'s reaction, and why might the author choose this specific word?', a:'"Berated" means scolded or criticised strongly, suggesting Ole\'s reaction was firm and forceful, not a gentle correction — the author likely chose this strong word to emphasise just how seriously Ole took quality control.', why:'A milder word like "reminded" or "told" would not convey the same intensity; "berated" signals real anger or urgency behind the lesson.'},

  shortAnswers:[
    {q:'Why was the shutting down of Ole\'s workshop a "blessing in disguise"?', a:'Although losing his workshop caused Ole immediate financial distress, it gave him free time in his now-empty space to think creatively, which led him to make a wooden duck for his children — the first step that eventually led to the founding of Lego.', points:['Caused financial hardship at first','Gave him time to think/create in his empty workshop','Directly led to the wooden duck and his toy-making venture'], why:'A good answer explains both the immediate downside and the eventual positive outcome, showing the irony of the phrase.'},
    {q:'What are the things that Godtfred learnt from his father?', a:'Godtfred learnt the importance of uncompromising quality — shown when Ole made him redo nearly a hundred toys with a proper third coat of lacquer — and he remained faithful to his father\'s vision throughout his own leadership of the company, including creating its structured "system of play".', points:['Learnt strict commitment to quality (the lacquer incident)','Remained faithful to his father\'s vision as a result','Applied this to his own later innovations (system of play)'], why:'The chapter directly links this early lesson to Godtfred\'s later faithfulness to Lego\'s founding values.'},

  longAnswers:[
    {q:'According to you, what factors contribute to the growth of a business? Use examples from the Lego story to support your answer.', a:'Several factors, illustrated clearly through Lego\'s history, contribute to the long-term growth of a business.\n\nFirst, resilience in the face of setbacks is essential. Lego faced repeated disasters — Ole\'s workshop closure, his wholesaler going bankrupt, and the devastating 1942 factory fire that reduced his factory to rubble — yet each time, the business recovered and grew stronger. A business that gives up after its first major setback rarely survives long enough to succeed.\n\nSecond, a genuine commitment to quality builds lasting trust and reputation. Ole\'s insistence on three coats of lacquer rather than two, even at extra cost and effort, reflects a business philosophy — captured in the motto "the best is never too good" — that prioritises long-term reputation over short-term savings, which likely built the customer loyalty needed for sustained growth.\n\nThird, willingness to innovate and adapt is crucial. Ole\'s decision to pivot from wooden toys to plastic bricks after seeing a moulding machine at a fair, and Godtfred\'s later invention of the interlocking "system of play" (inspired by learning from another innovator, Hilary Page), both show that businesses must be willing to change their products significantly rather than staying fixed on their original idea.\n\nFinally, identifying and solving real customer problems matters — Godtfred\'s system of play only became a lasting success once he solved the structural flaw of bricks not sticking together, showing that growth requires not just a good idea, but continual refinement based on real-world problems.\n\nTogether, these factors — resilience, quality, innovation, and problem-solving — explain how a small Danish carpentry workshop grew into a global toy empire.', structure:'Introduction (list the factors) → Factor 1: resilience (with fire/bankruptcy examples) → Factor 2: quality commitment (lacquer example) → Factor 3: innovation/adaptation (plastic pivot, system of play) → Factor 4: problem-solving (fixing the locking flaw) → Conclusion.', points:['Identify multiple distinct factors, not just one','Support each factor with a specific example from the text','Explain why each factor matters, not just describe it','Conclude by tying the factors together']},
    {q:'Give a few distinguishing character traits of Ole Kirk Christiansen. Support your answer with evidence from the text.', a:'Ole Kirk Christiansen displays several distinct character traits throughout the chapter, each clearly supported by specific events.\n\nThe first trait is tenacity, or persistence. The text explicitly calls him "tenacious" when, despite losing his workshop and his wife, he continued spending time thinking of new ideas rather than giving up — a pattern repeated later when he rebuilt his factory from scratch after the 1942 fire.\n\nThe second trait is an uncompromising commitment to quality. This is best shown when Ole "berated" his son Godtfred for applying only two coats of lacquer instead of three, insisting on redoing nearly a hundred toys — a costly decision that shows he valued product standards above short-term convenience or savings.\n\nThe third trait is entrepreneurial vision, or the ability to spot opportunity. When Ole encountered a plastic moulding machine at an industrial fair in Copenhagen in 1946, he immediately recognised its potential and brought a plastic brick home "as a keepsake" — a small decision that ultimately transformed his entire company\'s future.\n\nThe fourth trait is resilience under repeated hardship. Across the chapter, Ole faces workshop closure, his wife\'s death, a wholesaler\'s bankruptcy, and a factory fire — yet after each setback, he "persevered" and rebuilt, never permanently abandoning his goal.\n\nTogether, these traits — tenacity, commitment to quality, vision, and resilience — paint a picture of a determined, principled founder whose personal character directly shaped the values and ultimate success of the company he built.', structure:'Introduction (list the traits) → Trait 1: tenacity (workshop/rebuilding evidence) → Trait 2: quality commitment (lacquer evidence) → Trait 3: entrepreneurial vision (plastic brick evidence) → Trait 4: resilience (list of repeated hardships) → Conclusion linking traits to the company\'s success.', points:['Identify multiple distinct character traits','Support each trait with a specific textual example','Use the text\'s own vocabulary where relevant (e.g. "tenacious")','Conclude by connecting his character to the company\'s outcome']}

    plain:"Norman Gortsby sits on a park bench at dusk, cynically 'reading' the defeated people passing by. A well-dressed young man sits beside him and spins a sob story about losing track of his hotel and having no money. Gortsby doesn't believe him — until the young man storms off and Gortsby spots a cake of soap lying by the bench, seemingly fallen from the young man's pocket. Convinced this is proof the story was true, Gortsby chases him down, apologises, and hands over both the soap and a gold sovereign. Only afterwards does Gortsby pass an elderly man searching the ground near the same bench for something he's lost — a cake of soap. The soap was never the young man's at all; Gortsby's own 'clever' judgement was completely wrong.",

    examDef:"'Dusk' is a short story by Saki (the pen name of H. H. Munro), noted for its ironic twist ending. Set on a park bench in Hyde Park, London, at twilight, it follows the cynical Norman Gortsby, who confidently judges strangers by their appearance and circumstances, only to be completely misled by a coincidence — a lost cake of soap — that exposes the unreliability of judging people purely by outward appearances and circumstantial evidence."

  explanation:{
    undumbified:"At dusk in Hyde Park, Norman Gortsby sits on a bench, taking a cynical pleasure in watching and 'labelling' the passers-by he considers society's defeated. An elderly gentleman sits beside him briefly, looking dignified but clearly down on his luck, before leaving. He is replaced by a smartly-dressed young man who angrily explains that he has lost track of the London hotel he was meant to be staying at, and — having gone out to buy soap and had a drink — now has no money and nowhere to go for the night. Gortsby is sympathetic at first, even recalling a similar mishap of his own abroad, but grows suspicious when the young man cannot actually produce the cake of soap he claims to have bought. Caught out, the young man storms off. Moments later, Gortsby notices a cake of soap, wrapped and sealed, lying on the ground right where the young man had been sitting. Convinced this is the missing proof, Gortsby rushes after him, apologises for doubting him, and gives him both the soap and a sovereign as a loan. The young man gratefully pockets the coin and hurries away. As Gortsby retraces his steps, satisfied with his own generosity, he finds the elderly gentleman from earlier searching the ground around the very same bench — for a lost cake of soap. The twist reveals that the soap Gortsby found never belonged to the young man at all; it was the old man's, dropped earlier. Gortsby had rewarded a stranger's tall tale purely by coincidence, exposing how badly his confident, cynical judgement of people had actually failed.",

      {h:'Setting & Mood', p:"The story opens at half-past six on an early March evening, with dusk 'mitigated' by faint moonlight and street lamps near Hyde Park Corner. Gortsby finds the half-light fitting, calling dusk 'the hour of the defeated' — the time when people who have 'fought and lost' can move about with their shabby clothes and unhappy faces going largely unnoticed."},
      {h:'Gortsby\'s Character', p:"Gortsby is established as comfortably well-off (money troubles are 'not a concern for him') but cynically detached, taking pleasure in silently observing and mentally 'labelling' the other people on the walk as they pass between the lamplights — setting up the story's central irony that his confident judgement of others will prove badly mistaken."},
      {h:'The Old Man', p:"An elderly gentleman with an air of faded defiance sits beside Gortsby. His clothes 'passed muster' only in the half-light, and Gortsby imagines him going home to be snubbed, or to a bleak lodging where paying the weekly bill is the only interest anyone takes in him. This entirely invented backstory shows how readily Gortsby judges strangers from appearance alone."},
      {h:'The Young Man\'s Story', p:"A well-dressed but visibly annoyed young man takes the old man's place and, after some prompting, explains his 'predicament': he came to stay at the Patagonian Hotel, found it had been demolished and replaced by a cinema, went to buy soap while waiting to remember his new hotel's details, and afterwards find he cannot recall the hotel's name or street at all — leaving him with nowhere to stay and hardly any money."},
      {h:'Gortsby\'s Test — and the Young Man\'s Exit', p:"Gortsby is initially sympathetic, even recalling a similar experience of his own in a foreign city — but points out that the 'weak point' of the story is that the young man cannot produce the soap he claims to have just bought. Unable to find it in his pockets, the young man springs up and storms off with 'jaded jauntiness,' unable to bear the exposure of the flaw in his story."},
      {h:'The Twist — Finding the Soap', p:"As Gortsby rises to leave, he spots a small object wrapped and sealed in a chemist's envelope lying on the ground by the bench: a cake of soap, apparently fallen from the young man's overcoat pocket. Treating this as conclusive proof of the young man's honesty, Gortsby hurries after him through the dusk to make amends."},
      {h:'Amends and the Real Reveal', p:"Gortsby catches up with the young man, apologises for doubting him, hands over the soap and the loan of a sovereign, and gives his card so the money can be returned. The young man, visibly moved, thanks him and hurries off toward Knightsbridge. Satisfied, Gortsby reflects that he shouldn't be 'too clever in judging by circumstances' — not realising just how right that warning is about to prove. Retracing his steps past the bench, he finds the elderly gentleman from earlier searching the ground and learns the old man has lost — a cake of soap."},
      {h:'Theme: Appearance vs. Reality', p:"The story's central irony is that Gortsby, who prides himself on shrewdly 'reading' people from their appearance and circumstances, is completely deceived — not by any deliberate trick revealed in the text, but by a coincidence he mistakes for proof. The ending leaves the young man's honesty genuinely ambiguous while making clear that Gortsby's confident judgement, based only on circumstantial evidence, was flawed from the start."}
